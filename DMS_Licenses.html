    .cal-imp { display: flex; flex-direction: column; contain: size; min-height: 0; border-radius: 22px; overflow: hidden; background: var(--surface); border: 1px solid var(--line-strong); box-shadow: 0 24px 54px rgba(140, 18, 24, .12), 0 2px 4px rgba(90, 13, 18, .05); }

      return { max, used, remaining: Math.max(0, max - used), over: Math.max(0, used - max) };

    // Trả về Promise<boolean>: true nếu người dùng bấm nút xác nhận, false nếu Hủy / Esc / bấm ra ngoài.
    function confirmDialog({ title = "Xác nhận", message = "", confirmText = "Xác nhận", cancelText = "Hủy", danger = true } = {}) {
      return new Promise(resolve => {
        const root = $("#confirm-root");
        const onKey = e => { if (e.key === "Escape") close(false); };
        const close = (result) => {
          document.removeEventListener("keydown", onKey);
          root.innerHTML = "";
          resolve(result);
        };
        root.innerHTML = `<div class="modal-backdrop confirm-backdrop" id="confirm-backdrop"><section class="modal confirm-modal">
          <div class="confirm-icon ${danger ? "danger" : "info"}">${danger ? ICONS.trash : ICONS.toastInfo}</div>
          <h2 class="confirm-title">${escapeHtml(title)}</h2>
          <p class="confirm-msg">${escapeHtml(message)}</p>
          <div class="confirm-actions">
            <button type="button" class="btn btn-secondary" id="confirm-cancel">${escapeHtml(cancelText)}</button>
            <button type="button" class="btn ${danger ? "btn-danger" : "btn-primary"}" id="confirm-ok">${escapeHtml(confirmText)}</button>
          </div>
        </section></div>`;
        document.addEventListener("keydown", onKey);
        $("#confirm-backdrop").addEventListener("click", e => e.target.id === "confirm-backdrop" && close(false));
        $("#confirm-cancel").addEventListener("click", () => close(false));
        $("#confirm-ok").addEventListener("click", () => close(true));
        const ci = root.querySelector(".confirm-icon morph-icon");
        if (danger && ci) { MI.set(ci, ICON_D.toastError[0]); requestAnimationFrame(() => MI.to(ci, ICON_D.trash[0])); }
        $("#confirm-ok").focus();
      });
    }

    // ---------- Lịch Coke (445): kỳ 4-4-5 tuần, tuần chạy Thứ 7 → Thứ 6 ----------
    // Mỗi quý = 4 + 4 + 5 tuần (tháng cuối quý có 5 tuần). Tháng 1 bắt đầu 01/01, tháng 12 kết thúc 31/12.
    // Ngày bán hàng = trừ Chủ nhật và ngày lễ. Ngày lễ cố định áp dụng mọi năm; lễ âm lịch / nghỉ bù khai báo theo năm bên dưới: [tháng, ngày, tên].
    const COKE_DAY = 864e5;
    const COKE_FIXED_HOLIDAYS = [[1, 1, "Tết Dương lịch"], [4, 30, "Giải phóng miền Nam"], [5, 1, "Quốc tế Lao động"], [9, 2, "Quốc khánh"]];
    // Ngày lễ KHÔNG nghỉ: hiển thị trong "Ngày lễ" nhưng vẫn tính là ngày bán hàng (không trừ vào KPI)
    const COKE_NOOFF_HOLIDAYS = [[11, 24, "Ngày Văn hóa Việt Nam"]];
    const COKE_HOLIDAYS_BY_YEAR = {
      2026: [[2, 16, "Nghỉ Tết Nguyên đán"], [2, 17, "Nghỉ Tết Nguyên đán"], [2, 18, "Nghỉ Tết Nguyên đán"], [2, 19, "Nghỉ Tết Nguyên đán"], [2, 20, "Nghỉ Tết Nguyên đán"], [4, 26, "Giỗ Tổ Hùng Vương"], [4, 27, "Nghỉ bù Giỗ Tổ"]]
    };
    // Sự kiện lặp mỗi kỳ: Thứ Hai của Tuần 2 → Close GRN Module (khóa chức năng GRN để kiểm kê kho hàng tháng)
    const COKE_GRN_LABEL = "Close GRN Module";
    const cokeGridStart = p => p.start - ((cokeDow(p.start) + 1) % 7) * COKE_DAY;   // Thứ 7 đầu tiên của lưới
    const cokeGrnDay = p => cokeGridStart(p) + 9 * COKE_DAY;                          // Thứ 7 tuần 2 (+7) → Thứ Hai (+2)
    // Ngày đánh dấu (không nghỉ, vẫn tính là ngày bán hàng): ngày cố định hằng năm + ngày do Super-admin / Senior-member cấu hình (state.importantDays)
    const COKE_MARKED_FIXED = [];   // (đã chuyển Ngày Văn hóa Việt Nam sang nhóm Ngày lễ không nghỉ bên dưới)
    const IMPORTANT_DAYS_KEY = "important_days";   // lưu ở bảng app_settings (key/value), value = JSON mảng [{id, date:"YYYY-MM-DD", name, repeat:"none"|"weekly"|"yearly", yearly, time:"HH:MM"|""}]
    const GRN_OVERRIDE_KEY = "grn_overrides";      // value = JSON map {"YYYY-MM": "YYYY-MM-DD"(ghi đè) | "skip"(bỏ)} — Close GRN Module theo kỳ
    const JIRA_CONFIG_KEY = "jira_config";         // value = JSON {base_url, email, token, project_key, issue_type} — chỉ super-admin ghi, super-admin + senior-member đọc
    const parseImportantDays = v => {
      let a = v;
      if (typeof a === "string") { try { a = JSON.parse(a); } catch (_) { a = []; } }
      return (Array.isArray(a) ? a : []).filter(x => x && /^\d{4}-\d{2}-\d{2}$/.test(String(x.date)) && String(x.name || "").trim())
        .map(x => { const repeat = ["none", "weekly", "yearly"].includes(x.repeat) ? x.repeat : (x.yearly ? "yearly" : "none"); const time = /^\d{2}:\d{2}$/.test(String(x.time || "")) ? String(x.time) : ""; return { id: String(x.id || ""), date: x.date, name: String(x.name).trim().slice(0, 80), repeat, yearly: repeat === "yearly", time }; });
    };
    const cokeCustomDays = () => (typeof state !== "undefined" && Array.isArray(state.importantDays)) ? state.importantDays : [];
    function cokeMarks(y) {
      const map = new Map(), add = (t, n, time) => { if (!map.has(t)) map.set(t, []); map.get(t).push({ name: n, time: time || "" }); };
      COKE_MARKED_FIXED.forEach(([m, d, n]) => add(cokeUTC(y, m, d), n, ""));
      cokeCustomDays().forEach(it => {
        const [yy, mm, dd] = it.date.split("-").map(Number);
        if (it.repeat === "weekly") {
          const t0 = cokeUTC(yy, mm, dd), ys = cokeUTC(y, 1, 1), ye = cokeUTC(y, 12, 31);
          let t = t0 >= ys ? t0 : t0 + Math.ceil((ys - t0) / (7 * COKE_DAY)) * 7 * COKE_DAY;
          for (; t <= ye; t += 7 * COKE_DAY) add(t, it.name, it.time);
        }
        else if (it.repeat === "yearly") { const t = cokeUTC(y, mm, dd); if (new Date(t).getUTCMonth() + 1 === mm && y >= yy) add(t, it.name, it.time); }
        else if (yy === y) add(cokeUTC(yy, mm, dd), it.name, it.time);
      });
      return map;
    }
    // Sự kiện của một ngày: ngày lễ · Close GRN · ngày quan trọng — mỗi loại một màu, kèm giờ (trống = cả ngày)
    const CK_EV_TYPE = { grn: "Close GRN Module", imp: "Ngày quan trọng", hol: "Ngày lễ" };
    const CK_EV_SHORT = { grn: "GRN", imp: "★", hol: "Lễ" };
    const cokeEvTime = e => e.time || "Cả ngày";
    function cokeDayEvents(t, ctx) {
      const out = [], hn = ctx.holShow.get(t);
      if (hn) out.push({ type: "hol", name: hn, time: "", note: (ctx.noOff.has(t) && !ctx.hol.has(t)) ? "Không nghỉ, vẫn tính ngày bán hàng" : "Ngày lễ, không bán hàng" });
      if (t === ctx.grnT) out.push({ type: "grn", name: COKE_GRN_LABEL, time: "", note: "Khóa chức năng GRN để kiểm kê kho" });
      (ctx.marks.get(t) || []).forEach(e => out.push({ type: "imp", name: e.name, time: e.time, note: "" }));
      return out.sort((a, b) => (a.time && b.time) ? a.time.localeCompare(b.time) : a.time ? -1 : b.time ? 1 : 0);
    }
    const CK_DOW = ["CN", "T2", "T3", "T4", "T5", "T6", "T7"];
    const CK_DOW_FULL = ["Chủ nhật", "Thứ Hai", "Thứ Ba", "Thứ Tư", "Thứ Năm", "Thứ Sáu", "Thứ Bảy"];
    let cokeView = null;   // { y, m, day } — kỳ đang xem; tự quay về kỳ hiện tại khi sang ngày mới

    const cokeUTC = (y, m, d) => Date.UTC(y, m - 1, d);
    const cokeDow = t => new Date(t).getUTCDay();

    async function persistImportantDays(mutate) {
      if (!isAdmin()) { toast("Chỉ Super-admin mới được cấu hình ngày quan trọng.", "error"); return false; }
      const sb = state.supabase;
      const cur = await sb.from(LICENSE_SETTINGS_TABLE).select("value").eq("key", IMPORTANT_DAYS_KEY).maybeSingle();
      if (cur.error) { toast(`Không đọc được cấu hình: ${cur.error.message}`, "error"); return false; }
      const list = mutate(parseImportantDays(cur.data?.value));
      const { error } = await sb.from(LICENSE_SETTINGS_TABLE)
        .upsert({ key: IMPORTANT_DAYS_KEY, value: JSON.stringify(list), updated_at: new Date().toISOString(), updated_by: state.session?.user?.id }, { onConflict: "key" });
      if (error) { toast(`Không lưu được: ${error.message}. Hãy kiểm tra chính sách RLS của bảng app_settings (chỉ super-admin được ghi).`, "error"); return false; }
      state.importantDays = list;
      return true;
    }
    document.addEventListener("click", async e => {
      const b = e.target.closest ? e.target.closest("[data-imp]") : null;
      if (!b || b.disabled) return;
      const a = b.dataset.imp, form = document.querySelector("#imp-form");
      if (a === "toggle") { calSideOpen = true; impEditId = null; impFormOpen = !impFormOpen; refreshCokeRow(); if (impFormOpen) document.querySelector("#imp-name")?.focus(); }
      else if (a === "cancel") { impFormOpen = false; impEditId = null; refreshCokeRow(); }
      else if (a === "edit") { calSideOpen = true; impEditId = b.dataset.id; impFormOpen = true; refreshCokeRow(); document.querySelector("#imp-name")?.focus(); }
      else if (a === "save") {
        const date = document.querySelector("#imp-date")?.value || "", name = (document.querySelector("#imp-name")?.value || "").trim().replace(/\s+/g, " "), repeat = document.querySelector("#imp-repeat")?.value || "none", time = document.querySelector("#imp-time")?.value || "";
        if (time && !/^\d{2}:\d{2}$/.test(time)) return toast("Giờ không hợp lệ.", "error");
        if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) return toast("Hãy chọn ngày hợp lệ.", "error");
        if (!name) return toast("Hãy nhập nội dung cần chú ý.", "error");
        if (!["none", "weekly", "yearly"].includes(repeat)) return toast("Kiểu lặp không hợp lệ.", "error");
        b.disabled = true;
        const editId = impEditId, yearly = repeat === "yearly";
        const ok = await persistImportantDays(list => editId
          ? list.map(x => x.id === editId ? { ...x, date, name, repeat, yearly, time } : x)
          : (list.some(x => x.date === date && x.name.toLowerCase() === name.toLowerCase() && x.repeat === repeat) ? list : [...list, { id: impId(), date, name, repeat, yearly, time }]));
        if (ok) { impFormOpen = false; impEditId = null; toast(editId ? "Đã cập nhật ngày quan trọng." : "Đã thêm ngày quan trọng.", "success"); refreshCokeRow(); } else b.disabled = false;
      }

        const yes = await confirmDialog({ title: "Xóa ngày quan trọng?", message: `Xóa "${b.dataset.name}" khỏi lịch? Mọi người dùng sẽ không còn thấy ngày này.`, confirmText: "Xóa" });
        if (!yes) return;

      }

    // ---------- Close GRN Module: ghi đè / bỏ ngày theo kỳ (chỉ Super-admin) ----------
    async function persistGrnOverride(periodKey, value) {
      if (!isAdmin()) { toast("Chỉ Super-admin mới được chỉnh ngày Close GRN.", "error"); return false; }
      const sb = state.supabase;
      const cur = await sb.from(LICENSE_SETTINGS_TABLE).select("value").eq("key", GRN_OVERRIDE_KEY).maybeSingle();
      let map = {};
      if (cur.data?.value) { try { map = typeof cur.data.value === "string" ? JSON.parse(cur.data.value) : cur.data.value; } catch (_) { map = {}; } }
      if (!map || typeof map !== "object") map = {};
      if (value === null) delete map[periodKey]; else map[periodKey] = value;
      const { error } = await sb.from(LICENSE_SETTINGS_TABLE).upsert({ key: GRN_OVERRIDE_KEY, value: JSON.stringify(map), updated_at: new Date().toISOString(), updated_by: state.session?.user?.id }, { onConflict: "key" });
      if (error) { toast(`Không lưu được: ${error.message}. Hãy kiểm tra RLS app_settings.`, "error"); return false; }
      state.grnOverrides = map;
      return true;
    }

      const close = () => modalRoot.innerHTML = "";
      $("#grn-close").addEventListener("click", close);
      $("#grn-cancel").addEventListener("click", close);
      $("#grn-modal-bg").addEventListener("click", e => e.target.id === "grn-modal-bg" && close());

      });
    }
    async function deleteGrn(periodKey, name) {
      const yes = await confirmDialog({ title: "Bỏ Close GRN Module?", message: `Bỏ "${name}" cho kỳ ${periodKey}? Bấm icon khôi phục trên thẻ để hoàn lại.`, confirmText: "Bỏ", danger: true });

      if (await persistGrnOverride(periodKey, "skip")) { toast("Đã bỏ Close GRN cho kỳ này.", "success"); refreshCokeRow(); }
    }
    document.addEventListener("click", async e => {

    async function createJiraTicket() {
      if (!canEdit()) return toast("Chỉ Super-admin và Senior-member được tạo Jira ticket.", "error");
      const cfg = state.jiraConfig;
      if (!cfg || !cfg.project_key || (!cfg.proxy_url && (!cfg.base_url || !cfg.email || !cfg.token))) return toast("Chưa cấu hình Jira.", "error");
      const grn = cokeImportantList(cokeToday()).find(x => x.kind === "grn" && !x.past);
      if (!grn) return toast("Không tìm thấy ngày Close GRN Module sắp tới.", "error");
      const dateStr = cokeFmt(grn.t, true).replace(/\//g, "-");
      const summary = `[DMS] Close GRN Module on ${dateStr}`;
      const descText = `Hi Vxceed team,\n\nAs requested by our Finance/Business team, please help us schedule a temporary closure of the GRN Module on ${dateStr}, for financial closing purposes.\n\nClosure Time: 06:00 AM (VNT)\nRe-opening Time: 12:00 PM (VNT)\n\nPlease ensure the GRN Module is disabled for all distributors before 06:00 AM and fully restored by 12:00 PM.\n\nKindly confirm once this is scheduled and committed in your system.`;
      const btn = document.querySelector('[data-jira="create"]');
      const restore = btn ? btn.innerHTML : null;
      if (btn) { btn.disabled = true; btn.innerHTML = `<span class="btn-icon spin">${ICONS.refresh}</span> Đang tạo…`; }
      try {
                const base = String(cfg.base_url || "").replace(/\/+$/, "");
        const proxy = String(cfg.proxy_url || "").trim().replace(/\/+$/, "");
        let ticketKey = "", browseUrl = "", jiraWarnings = [], jiraStatus = "";
        if (proxy) {
          let res;
          try {
            res = await fetch(proxy, { method: "POST", headers: { "Content-Type": "application/json", "Accept": "application/json" }, body: JSON.stringify({ summary, description: descText, issue_type: cfg.issue_type || "Task", project_key: cfg.project_key, date: dateStr }) });
          } catch (e) {
            throw new Error("Không kết nối được tới Proxy URL. Kiểm tra lại địa chỉ proxy (phải là https và cho phép CORS).");
          }
          const data = await res.json().catch(() => ({}));
          if (!res.ok) throw new Error((data.errorMessages || []).join("; ") || data.message || data.error || `HTTP ${res.status}`);
          ticketKey = data.key || data.issue_key || "";
          jiraWarnings = Array.isArray(data.warnings) ? data.warnings : [];
          const stStep = (Array.isArray(data.steps) ? data.steps : []).find(x => /^4\./.test(x)); if (stStep) jiraStatus = stStep.replace(/^4\.\s*Đã chuyển trạng thái\s*→\s*/, "");
          browseUrl = data.browse_url || (ticketKey && base ? `${base}/browse/${ticketKey}` : "");
        } else {
          const body = { fields: { project: { key: cfg.project_key }, summary, description: { type: "doc", version: 1, content: [{ type: "paragraph", content: [{ type: "text", text: descText }] }] }, issuetype: { name: cfg.issue_type || "Task" } } };
          let res;
          try {
            res = await fetch(`${base}/rest/api/3/issue`, { method: "POST", headers: { "Authorization": `Basic ${btoa(`${cfg.email}:${cfg.token}`)}`, "Content-Type": "application/json", "Accept": "application/json" }, body: JSON.stringify(body) });
          } catch (e) {
            throw new Error("Trình duyệt bị chặn CORS khi gọi trực tiếp Jira. Hãy cấu hình Proxy URL để tạo ticket qua máy chủ.");
          }
          const data = await res.json().catch(() => ({}));
          if (!res.ok) throw new Error((data.errorMessages || []).join("; ") || data.message || `HTTP ${res.status}`);
          ticketKey = data.key || "";
          browseUrl = ticketKey && base ? `${base}/browse/${ticketKey}` : "";
        }
        toast(ticketKey ? `Đã tạo ticket ${ticketKey}${jiraStatus ? " · " + jiraStatus : ""} thành công` : "Đã tạo ticket Jira thành công", "success");
        if (jiraWarnings.length) toast("Cảnh báo: " + jiraWarnings.join(" | "), "error");
        if (browseUrl) window.open(browseUrl, "_blank", "noopener");
      } catch (err) {
        toast(err && err.message ? err.message : "Tạo ticket Jira thất bại.", "error");
      } finally {
        if (btn) { btn.disabled = false; btn.innerHTML = restore; }
      }
    }
    document.addEventListener("click", e => { const b = e.target.closest ? e.target.closest("[data-jira]") : null; if (b && !b.disabled && b.dataset.jira === "create") createJiraTicket(); });

    // ---------- Bảng dữ liệu: lọc → phân trang → dựng HTML ----------
    const searchIndex = new WeakMap();
    function rowSearchText(row, fields) {
      let text = searchIndex.get(row);
      if (text === undefined) { text = fields.map(([key]) => row[key] ?? "").join("\u0001").toLowerCase(); searchIndex.set(row, text); }
      return text;
    }
    let filterMemo = { rows: null, q: "", out: null, multi: null };
    let datasetMulti = null;   // thông tin tìm nhiều mã của lần lọc gần nhất (null = tìm thường)
    const multiBanner = mm => `<div class="tl-multi"><b>Đã dán ${nf(mm.total)} mã</b> · khớp ${nf(mm.total - mm.missing.length)}${mm.missing.length ? ` · <span class="bad">không thấy ${nf(mm.missing.length)}: ${escapeHtml(mm.missing.join(", "))}</span>` : ""}${mm.hidden ? ` · <span class="warn">${nf(mm.hidden)} account bị ẩn bởi bộ lọc Trạng thái</span>` : ""}</div>`;
    // Từ 2 mã trở lên (cách nhau bằng dấu cách / phẩy / xuống dòng) → khớp chính xác UserName, EmployeeCode hoặc Email;
    // không có kết quả nào thì quay về tìm chứa chuỗi như cũ
    function getFilteredRows(rows, fields, query) {
      const q = String(query || "").trim().toLowerCase();
      if (!q) { datasetMulti = null; return rows; }
      if (filterMemo.rows === rows && filterMemo.q === q) { datasetMulti = filterMemo.multi; return filterMemo.out; }
      let out = null, multi = null;
      const tokens = [...new Map(String(query).split(/[\s,;]+/).filter(Boolean).map(x => [x.toLowerCase(), x])).values()];
      if (tokens.length >= 2) {
        const want = new Set(tokens.map(x => x.toLowerCase())), found = new Set();
        out = rows.filter(row => { const hit = [row.username, row.employee_code, row.email].map(x => String(x ?? "").trim().toLowerCase()).filter(k => want.has(k)); hit.forEach(k => found.add(k)); return hit.length > 0; });
        if (found.size) multi = { total: tokens.length, missing: tokens.filter(x => !found.has(x.toLowerCase())), hidden: 0 };
        else out = null;
      }
      if (!out) out = rows.filter(row => rowSearchText(row, fields).includes(q));
      filterMemo = { rows, q, out, multi }; datasetMulti = multi;
      return out;
    }
    const nf = (n) => Number(n).toLocaleString("vi-VN");
    const cellHtml = (v) => (v === null || v === undefined || v === "") ? '<span class="nil">—</span>' : escapeHtml(v);

    function getDatasetView() {
      const isDms = state.tab === "dms";
      const fields = isDms ? DMS_FIELDS : CENTRAL_FIELDS;
      const baseRows = state[isDms ? "dms" : "central"];
      // Bộ lọc license chỉ áp dụng cho Central User list (nơi có TerritoryHierarchy/RoleName/IsActive dùng để tính license)
      const rows = isDms ? baseRows : applyLicenseFilter(baseRows, state.licenseFilter);
      const filtered = sortRows(getFilteredRows(rows, fields, state.search), isDms ? "dms" : "central", fields);
      const total = filtered.length;
      const totalPages = Math.max(1, Math.ceil(total / state.pageSize));
      state.page = Math.min(Math.max(1, Math.floor(state.page) || 1), totalPages);
      const start = (state.page - 1) * state.pageSize;
      return { multi: datasetMulti, isDms, fields, rows, baseRows, total, totalPages, start, filtered, pageRows: filtered.slice(start, start + state.pageSize) };
    }

    function rowBadgeText(v) {
      return state.search.trim() ? `${nf(v.total)} kết quả / ${nf(v.rows.length)} dòng` : `${nf(v.rows.length)} dòng`;
    }

    // Xuất dữ liệu đang được lọc (theo ô tìm kiếm) của tab hiện tại ra file Excel (.xlsx)
    async function exportExcel() {
      try { await loadLib("xlsx"); } catch (_) { toast("Không tải được thư viện xuất Excel.", "error"); return; }
      const v = getDatasetView();
      if (!v.filtered.length) { toast("Không có dữ liệu để xuất.", "error"); return; }
      const btn = $("#export-excel");
      const restore = btn ? btn.innerHTML : null;
      if (btn) { btn.disabled = true; btn.innerHTML = `<span class="btn-icon spin">${ICONS.refresh}</span> Đang xuất…`; }
      try {
        const header = v.fields.map(([, label]) => label);
        const rowsAoa = v.filtered.map(row => v.fields.map(([key]) => row[key] ?? ""));
        const ws = XLSX.utils.aoa_to_sheet([header, ...rowsAoa]);
        ws["!cols"] = header.map(h => ({ wch: Math.min(Math.max(String(h).length + 4, 14), 34) }));
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, v.isDms ? "DMS Userlist" : "Central User list");
        const stamp = new Date().toISOString().slice(0, 19).replace(/[:T]/g, "-");
        const fileName = `${v.isDms ? "DMS_Userlist" : "Central_Userlist"}_${stamp}.xlsx`;
        XLSX.writeFile(wb, fileName);
        toast(`Đã xuất ${nf(v.filtered.length)} dòng ra "${fileName}".`, "success");
        setTimeout(() => flashIcon($("#export-excel"), "check"), 0);
      } catch (err) {
        toast(`Xuất Excel thất bại: ${err.message}`, "error");
      } finally {
        if (btn) { btn.disabled = false; btn.innerHTML = restore; }
      }
    }

    function pageItems(current, totalPages) {
      const set = new Set([1, totalPages, current - 1, current, current + 1]);
      if (current <= 3) [2, 3, 4].forEach(p => set.add(p));
      if (current >= totalPages - 2) [totalPages - 1, totalPages - 2, totalPages - 3].forEach(p => set.add(p));
      const pages = [...set].filter(p => p >= 1 && p <= totalPages).sort((a, b) => a - b);
      const out = [];
      pages.forEach((p, idx) => {
        if (idx) { const gap = p - pages[idx - 1]; if (gap === 2) out.push(p - 1); else if (gap > 2) out.push("…"); }
        out.push(p);
      });
      return out;
    }

    function renderPager(v) {
      const { total, totalPages, start, pageRows } = v, page = state.page;
      const from = total ? start + 1 : 0, to = start + pageRows.length;
      const btn = (p, label, { disabled = false, active = false, aria = `Trang ${p}` } = {}) =>
        `<button type="button" class="pager-btn${active ? " active" : ""}" data-page="${p}" aria-label="${aria}"${active ? ' aria-current="page"' : ""}${disabled ? " disabled" : ""}>${label}</button>`;
      const nav = [
        btn(page - 1, ICONS.pgPrev, { disabled: page === 1, aria: "Trang trước" }),
        ...pageItems(page, totalPages).map(p => p === "…" ? '<span class="pager-gap">…</span>' : btn(p, nf(p), { active: p === page })),
        btn(page + 1, ICONS.pgNext, { disabled: page === totalPages, aria: "Trang sau" })
      ].join("");
      return `<div class="pager">
        <div>Hiển thị <b>${nf(from)}–${nf(to)}</b> / <b>${nf(total)}</b> ${state.search.trim() ? "kết quả" : "dòng"}</div>
        <div class="pager-controls">
          <label class="pager-size">Số dòng / trang <select id="page-size" aria-label="Số dòng mỗi trang">${PAGE_SIZES.map(n => `<option value="${n}"${n === state.pageSize ? " selected" : ""}>${n}</option>`).join("")}</select></label>
          <nav class="pager-nav" aria-label="Phân trang">${nav}</nav>
          ${totalPages > 1 ? `<label class="pager-jump">Đến trang <input id="page-jump" type="number" min="1" max="${totalPages}" value="${page}" inputmode="numeric" aria-label="Đến trang số" /></label>` : ""}
        </div>
      </div>`;
    }

    // ---------- Chọn nhiều dòng + thao tác hàng loạt (DMS / Central) ----------
    function selSet() { return state.tab === "dms" ? state.selected.dms : state.selected.central; }
    function saveSel() { saveJson(SEL_KEY, { dms: [...state.selected.dms], central: [...state.selected.central] }); }
    function renderBulkBar(v) {
      const sel = selSet(), n = sel.size;
      const allPage = v.pageRows.length > 0 && v.pageRows.every(r => sel.has(r.username));
      return `<div class="bulk-bar" data-bulk-bar>
        <label class="bulk-check"><input type="checkbox" id="select-all-page" ${allPage ? "checked" : ""} aria-label="Chọn trang hiện tại"> <span>Chọn trang này</span></label>
        <span class="bulk-count"><b id="sel-count">${nf(n)}</b> đã chọn</span>
        <div class="bulk-actions">
          <button type="button" class="btn btn-secondary" data-bulk="allresults">Chọn tất cả ${nf(v.total)} kết quả</button>
          <button type="button" class="btn btn-secondary" data-bulk="clear" ${!n ? "disabled" : ""}>Bỏ chọn</button>
          <button type="button" class="btn btn-excel" data-hover-icon="download" data-bulk="export" ${!n ? "disabled" : ""}>${ICONS.xlsx} Xuất đã chọn</button>
          ${isAdmin() ? `<button type="button" class="btn btn-danger" data-bulk="delete" ${!n ? "disabled" : ""}>${ICONS.trash} Xóa đã chọn</button>` : ""}
        </div>
      </div>`;
    }
    function updateBulkBar() {
      const v = getDatasetView(), sel = selSet(), n = sel.size;
      const c = $("#sel-count"); if (c) c.textContent = nf(n);
      const bar = $("[data-bulk-bar]"); if (!bar) return;
      const sap = bar.querySelector("#select-all-page"); if (sap) sap.checked = v.pageRows.length > 0 && v.pageRows.every(r => sel.has(r.username));
      bar.querySelectorAll("[data-bulk]").forEach(b => { const act = b.dataset.bulk; if (act === "clear" || act === "export" || act === "delete") b.disabled = !n; });
    }
    async function exportSelected() {
      const v = getDatasetView(), sel = selSet();
      const rows = v.filtered.filter(r => sel.has(r.username));
      if (!rows.length) return toast("Không có dòng nào được chọn để xuất.", "error");
      try { await loadLib("xlsx"); } catch (_) { return toast("Không tải được thư viện xuất Excel.", "error"); }
      try {
        const header = v.fields.map(([, label]) => label);
        const ws = XLSX.utils.aoa_to_sheet([header, ...rows.map(row => v.fields.map(([key]) => row[key] ?? ""))]);
        ws["!cols"] = header.map(h => ({ wch: Math.min(Math.max(String(h).length + 4, 14), 34) }));
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, v.isDms ? "DMS Userlist" : "Central User list");
        const stamp = new Date().toISOString().slice(0, 19).replace(/[:T]/g, "-");
        XLSX.writeFile(wb, `${v.isDms ? "DMS_Userlist" : "Central_Userlist"}_dachon_${stamp}.xlsx`);
        toast(`Đã xuất ${nf(rows.length)} dòng đã chọn.`, "success");
      } catch (err) { toast(`Xuất Excel thất bại: ${err.message}`, "error"); }
    }
    async function deleteRows(keys) {
      if (!isAdmin() || !keys.length) return;
      const ok = await confirmDialog({ title: `Xóa ${nf(keys.length)} bản ghi?`, message: `Xóa ${nf(keys.length)} bản ghi đã chọn khỏi ${state.tab === "dms" ? "DMS Userlist" : "Central User list"}? Không thể hoàn tác.`, confirmText: "Xóa" });
      if (!ok) return;
      const table = state.tab === "dms" ? "dms_users" : "central_users";
      const { data, error } = await state.supabase.from(table).delete().in("username", keys).select();
      if (error) return toast(`Không xóa được: ${error.message}`, "error");
      if (!data || !data.length) return toast(`Không xóa được — có thể do chưa có chính sách RLS DELETE cho bảng "${table}".`, "error");
      keys.forEach(k => selSet().delete(k)); saveSel();
      toast(`Đã xóa ${nf(data.length)} bản ghi.`, "success"); await loadData();
    }

    function renderDatasetBody(v) {
      const { fields, pageRows, start, total } = v, bn = v.multi ? multiBanner(v.multi) : "";
      if (!total) {
        const msg = state.loading && !v.rows.length
          ? `<div class="skeleton">${[72, 94, 81, 66, 90, 77, 85, 60].map(w => `<i class="sk" style="--w:${w}%"></i>`).join("")}<div class="loading"><i class="spinner"></i> <span data-loading-text>${loadingText()}</span></div></div>`
          : `<div class="empty"><strong>Không tìm thấy dữ liệu</strong>Thử đổi từ khóa tìm kiếm hoặc làm mới bảng.</div>`;
        return `${bn}${renderBulkBar(v)}<div class="table-wrap data-scroll is-empty">${msg}</div>${renderPager(v)}`;
      }
      const sel = selSet();
      const s = currentSort(v.isDms ? "dms" : "central", fields);
      const head = `<th class="col-sel"></th><th class="col-idx">#</th>${fields.map(([key, label]) => { const on = s?.key === key; return `<th class="sortable${on ? " sorted" : ""}" data-sort="${key}" aria-sort="${on ? (s.dir === "asc" ? "ascending" : "descending") : "none"}" title="Bấm để sắp xếp: tăng dần → giảm dần → bỏ sắp xếp">${escapeHtml(label)}<span class="sort-ind">${sortIcon(on ? s.dir : "")}</span></th>`; }).join("")}<th class="col-act">Thao tác</th>`;
      const body = pageRows.map((row, i) => `<tr><td class="col-sel"><input type="checkbox" class="row-sel" data-key="${escapeHtml(row.username)}" ${sel.has(row.username) ? "checked" : ""} aria-label="Chọn ${escapeHtml(row.username)}"></td><td class="col-idx">${nf(start + i + 1)}</td>${fields.map(([key]) => `<td>${key === "username" ? `<strong>${cellHtml(row[key])}</strong>` : cellHtml(row[key])}</td>`).join("")}<td class="col-act"><div style="display:flex;gap:4px">${canEdit() ? `<button class="btn btn-plain edit-row" data-key="${escapeHtml(row.username)}" title="Sửa">${ICONS.edit}</button>` : ""}${isAdmin() ? `<button class="btn btn-plain delete-row" data-key="${escapeHtml(row.username)}" title="Xóa" style="color:var(--danger)">${ICONS.trash}</button>` : ""}</div></td></tr>`).join("");
      return `${bn}${renderBulkBar(v)}<div class="table-wrap data-scroll" tabindex="0" aria-label="Bảng dữ liệu, cuộn ngang và dọc để xem đủ các cột"><table class="data-table"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>${renderPager(v)}`;
    }
    // Thẻ tổng hợp License DMS, chỉ hiển thị ở tab Central User list. Max Licenses cấu hình ở "Quản lý dữ liệu",
    // số đã dùng/còn lại tính theo chính dữ liệu Central User list (TerritoryHierarchy, RoleName, IsActive).
    function renderLicenseSummary() {
      const { max, used, remaining, over } = licenseStats();
      const pct = max > 0 ? Math.min(100, Math.round((used / max) * 100)) : 0;
      const status = over > 0 ? "over" : remaining === 0 && max > 0 ? "full" : max > 0 && remaining <= Math.max(1, Math.ceil(max * 0.1)) ? "warn" : "ok";
      const statusBadgeCls = status === "ok" ? "badge-success" : status === "warn" ? "badge-warning" : "badge-danger";
      const statusText = { over: `Vượt ${nf(over)} license`, full: "Đã dùng hết license", warn: `Sắp hết license`, ok: "Còn license trống" }[status];
      return `<section class="panel license-card license-${status}">
        <div class="license-head">
          <div><h2>License DMS đang sử dụng</h2><p>Tính từ Central User list: TerritoryHierarchy &amp; RoleName có giá trị, và IsActive = 1.</p></div>
          <span class="badge ${statusBadgeCls}">${statusText}</span>
        </div>
        <div class="license-stats">
          <div class="license-stat"><span class="license-num">${nf(max)}</span><span class="license-lbl">Max Licenses</span></div>
          <div class="license-stat"><span class="license-num">${nf(used)}</span><span class="license-lbl">Đã sử dụng</span></div>
          <div class="license-stat"><span class="license-num">${nf(remaining)}</span><span class="license-lbl">Còn lại</span></div>
        </div>
        <div class="license-bar"><div class="license-fill" style="width:${pct}%"></div></div>
        <div class="license-sub"><span>${pct}% license đã được sử dụng</span>${isAdmin() ? `<button type="button" class="link-btn" data-tab="admin">Cấu hình Max Licenses ở Quản lý dữ liệu →</button>` : ""}</div>
      </section>`;
    }

    // Hàng nút filter theo điều kiện license, chỉ hiển thị ở tab Central User list. Mặc định chọn "Đủ điều kiện license"
    // (đúng logic: TerritoryHierarchy & RoleName có giá trị, và IsActive = 1) để thấy ngay danh sách account đang chiếm license.
    function renderLicenseFilterTabs(v) {
      const total = v.baseRows.length;
      const used = v.baseRows.filter(usesLicense).length;
      const unused = total - used;
      const tabs = [
        { key: "used", label: "Đủ điều kiện license", count: used },
        { key: "unused", label: "Không đủ điều kiện", count: unused },
        { key: "all", label: "Tất cả", count: total }
      ];
      return `<div class="license-filter-row">
        <span class="lf-label">Lọc theo license:</span>
        <div class="license-filter-tabs" role="tablist" aria-label="Lọc theo điều kiện license">
          ${tabs.map(t => `<button type="button" class="filter-tab${state.licenseFilter === t.key ? " active" : ""}" role="tab" aria-selected="${state.licenseFilter === t.key}" data-license-filter="${t.key}">${escapeHtml(t.label)} <span class="lf-count">${nf(t.count)}</span></button>`).join("")}
        </div>
      </div>`;
    }

    function renderDataset() {
      const v = getDatasetView();
      return `<div class="header-row"><div><div class="eyebrow">${v.isDms ? "DMS directory" : "Central directory"}</div><h2 class="page-title">${v.isDms ? "DMS Userlist" : "Central User list"}</h2><p class="page-subtitle">${v.isDms ? "Danh sách người dùng DMS theo tenant, vùng và trạng thái." : "Danh sách nhân sự Central và thông tin hoạt động."}</p></div><div class="actions">${canEdit() ? `<button class="btn btn-light" id="new-row">${ICONS.plus} Thêm bản ghi</button>` : ""}</div></div>
        ${!v.isDms ? renderLicenseSummary() : ""}
        <section class="panel">
        ${!v.isDms ? renderLicenseFilterTabs(v) : ""}
        <div class="toolbar">
          <div class="search${state.search ? " has-value" : ""}"><span class="search-icon">${ICONS.search}</span><input id="table-search" value="${escapeHtml(state.search)}" placeholder="Tìm theo tên, email, tenant… hoặc dán nhiều UserName" autocomplete="off" /><button type="button" class="search-clear" id="search-clear" aria-label="Xóa tìm kiếm" tabindex="-1">${ICONS.close}</button></div>
          <div class="toolbar-right">
            <span class="loading${state.loading ? "" : " hidden"}" data-loading><i class="spinner"></i><span data-loading-text>${loadingText()}</span></span>
            <span class="badge badge-blue" id="row-badge">${rowBadgeText(v)}</span>
            <button class="btn btn-excel" data-hover-icon="download" id="export-excel" title="Xuất dữ liệu đang hiển thị ra file Excel">${ICONS.xlsx} Xuất Excel</button>
            <button class="btn btn-secondary" id="refresh-data"${state.loading ? " disabled" : ""}><span class="btn-icon${state.loading ? " spin" : ""}">${ICONS.refresh}</span> Làm mới</button>
          </div>
        </div>
        <div id="dataset-body">${renderDatasetBody(v)}</div></section>`;
    }

    // Chỉ cập nhật phần bảng + phân trang (không dựng lại cả trang) → tìm kiếm/chuyển trang mượt, không mất focus ô tìm kiếm
    function updateDatasetBody() {
      const body = $("#dataset-body"); if (!body) return;
      const v = getDatasetView();
      body.innerHTML = renderDatasetBody(v);
      const badge = $("#row-badge"); if (badge) badge.textContent = rowBadgeText(v);
      bindDatasetBody();
    }
    function goToPage(p) {
      const n = Math.floor(Number(p));
      if (!Number.isFinite(n)) return updateDatasetBody();
      state.page = n; updateDatasetBody();
    }
    function bindDatasetBody() {
      const body = $("#dataset-body"); if (!body) return;
      body.querySelectorAll(".edit-row").forEach(el => el.addEventListener("click", () => openRowModal(el.dataset.key)));
      body.querySelectorAll(".delete-row").forEach(el => el.addEventListener("click", () => deleteRow(el.dataset.key)));
      body.querySelectorAll("th[data-sort]").forEach(el => el.addEventListener("click", () => toggleSort(el.dataset.sort)));
      body.querySelectorAll(".row-sel").forEach(el => el.addEventListener("change", () => {
        const sel = selSet();
        if (el.checked) sel.add(el.dataset.key); else sel.delete(el.dataset.key);
        saveSel(); updateBulkBar();
      }));
      const sap = $("#select-all-page");
      sap?.addEventListener("change", () => {
        const sel = selSet(), v = getDatasetView();
        if (sap.checked) v.pageRows.forEach(r => sel.add(r.username)); else v.pageRows.forEach(r => sel.delete(r.username));
        saveSel();
        body.querySelectorAll(".row-sel").forEach(el => { el.checked = sel.has(el.dataset.key); });
        updateBulkBar();
      });
      body.querySelectorAll("[data-bulk]").forEach(el => el.addEventListener("click", () => {
        const act = el.dataset.bulk, sel = selSet(), v = getDatasetView();
        if (act === "allresults") { v.filtered.forEach(r => sel.add(r.username)); saveSel(); body.querySelectorAll(".row-sel").forEach(e => e.checked = sel.has(e.dataset.key)); updateBulkBar(); toast(`Đã chọn ${nf(sel.size)} dòng.`, "success"); }
        else if (act === "clear") { sel.clear(); saveSel(); body.querySelectorAll(".row-sel").forEach(e => e.checked = false); updateBulkBar(); }
        else if (act === "export") exportSelected();
        else if (act === "delete") deleteRows(v.filtered.filter(r => sel.has(r.username)).map(r => r.username));
      }));
      body.querySelectorAll("[data-page]").forEach(el => el.addEventListener("click", () => goToPage(el.dataset.page)));
      $("#page-size")?.addEventListener("change", e => { state.pageSize = Number(e.target.value); state.page = 1; savePageSize(state.pageSize); updateDatasetBody(); });
      const jump = $("#page-jump");
      jump?.addEventListener("keydown", e => { if (e.key === "Enter") goToPage(jump.value); });
      jump?.addEventListener("change", () => goToPage(jump.value));
    }
    // Panel cấu hình Max Licenses (chỉ Super-admin), kèm xem trước Đã dùng/Còn lại theo dữ liệu hiện có
    function renderLicenseAdminPanel() {
      const { max, used, remaining, over } = licenseStats();
      return `<section class="panel" style="margin-bottom:18px"><div class="panel-head"><div><h2>Cấu hình License DMS</h2><p>Đặt số lượng license tối đa; hiển thị trực tiếp trên trang DMS Userlist cho mọi người dùng.</p></div></div>
        <div class="panel-body">
          <div class="license-config">
            <div class="field"><label for="max-license-input">Max Licenses</label><input id="max-license-input" type="number" min="0" step="1" value="${escapeHtml(max)}" ${state.savingLicense ? "disabled" : ""} /></div>
            <button type="button" class="btn btn-primary" id="save-max-license" ${state.savingLicense ? "disabled" : ""}>${state.savingLicense ? '<span class="btn-icon spin">' + ICONS.refresh + "</span> Đang lưu…" : "Lưu cấu hình"}</button>
          </div>
          <div class="license-preview">
            <div class="license-stat"><span class="license-num">${nf(used)}</span><span class="license-lbl">Đang sử dụng (Central)</span></div>
            <div class="license-stat"><span class="license-num">${nf(remaining)}</span><span class="license-lbl">Còn lại nếu lưu ${nf(max)}</span></div>
            ${over ? `<div class="license-stat"><span class="license-num" style="color:var(--danger)">${nf(over)}</span><span class="license-lbl">Đang vượt mức</span></div>` : ""}
          </div>
        </div>
      </section>`;
    }

    function renderAdmin() {
      return `<div class="header-row"><div><div class="eyebrow">Super-admin console</div><h2 class="page-title">Quản lý dữ liệu</h2><p class="page-subtitle">Chỉ Super-admin nhìn thấy khu vực này.</p></div></div>
        ${renderLicenseAdminPanel()}
        ${renderJiraAdminPanel()}
        <div class="two-col">
          <section class="panel"><div class="panel-head"><div><h2>Import masterdata</h2><p>Upsert theo UserName — bản ghi cũ được cập nhật, bản ghi mới được thêm.</p></div></div><div class="panel-body">

    }

    function renderProfilesTable() {
      if (!state.profiles.length) return `<div class="empty"><strong>Chưa có tài khoản nào</strong>Người dùng mới sẽ xuất hiện sau khi đăng nhập Google.</div>`;

    function bindAppEvents() {
      $("#refresh-data")?.addEventListener("click", loadData);
      let searchTimer = null;
      const searchInput = $("#table-search"), searchWrap = searchInput?.closest(".search");
      searchInput?.addEventListener("paste", e => {   // dán cột từ Excel: input 1 dòng làm mất xuống dòng → đổi thành dấu cách
        const txt = (e.clipboardData || window.clipboardData).getData("text");
        if (!/[\r\n\t;,]/.test(txt)) return;
        e.preventDefault();
        searchInput.setRangeText(txt.replace(/[\r\n\t;,]+/g, " ").trim() + " ", searchInput.selectionStart, searchInput.selectionEnd, "end");
        searchInput.dispatchEvent(new Event("input"));
      });
      searchInput?.addEventListener("input", e => {
        setSearch(e.target.value); state.page = 1;
        searchWrap?.classList.toggle("has-value", !!e.target.value);
        clearTimeout(searchTimer); searchTimer = setTimeout(updateDatasetBody, 150);
      });
      $("#search-clear")?.addEventListener("click", () => {
        setSearch(""); state.page = 1;
        if (searchInput) searchInput.value = "";
        searchWrap?.classList.remove("has-value");
        searchInput?.focus();
        updateDatasetBody();
      });
      $("#export-excel")?.addEventListener("click", exportExcel);
      $("#new-row")?.addEventListener("click", () => openRowModal());
      document.querySelectorAll("[data-license-filter]").forEach(el => el.addEventListener("click", () => {
        const mode = el.dataset.licenseFilter;
        if (mode === state.licenseFilter) return;
        state.licenseFilter = mode; saveKey(LICENSE_FILTER_KEY, mode); setSearch(""); state.page = 1;
        render();
      }));
      bindDatasetBody();
      bindToolEvents();
      bindUpdateEvents();
      bindMdmEvents();
      $("#file-input")?.addEventListener("change", e => e.target.files[0] && importWorkbook(e.target.files[0]));
      const dropzone = $("#dropzone");
      if (dropzone) {
        const dzIcon = dropzone.querySelector(":scope > morph-icon");
        const dzSet = on => { if (dropzone.classList.contains("drag") === on) return; dropzone.classList.toggle("drag", on); MI.to(dzIcon, (on ? ICON_D.download : ICON_D.upload)[0]); };
        ["dragenter", "dragover"].forEach(type => dropzone.addEventListener(type, e => { e.preventDefault(); dzSet(true); }));
        ["dragleave", "drop"].forEach(type => dropzone.addEventListener(type, e => { e.preventDefault(); dzSet(false); }));
        dropzone.addEventListener("drop", e => e.dataTransfer.files[0] && importWorkbook(e.dataTransfer.files[0]));
      }
      document.querySelectorAll(".approve-user").forEach(el => el.addEventListener("click", () => updateProfile(el.dataset.id, { approval_status: "approved" })));
      document.querySelectorAll(".reject-user").forEach(el => el.addEventListener("click", () => updateProfile(el.dataset.id, { approval_status: "rejected" })));
      document.querySelectorAll(".role-select").forEach(el => el.addEventListener("change", () => updateProfile(el.dataset.id, { role: el.value })));
      document.querySelectorAll(".delete-profile").forEach(el => el.addEventListener("click", () => deleteProfile(el.dataset.id, el.dataset.name)));
      $("#save-max-license")?.addEventListener("click", () => {
        const input = $("#max-license-input");
        saveMaxLicenses(input ? input.value : state.settings.maxLicenses);
      });
      $("#save-jira")?.addEventListener("click", saveJiraConfig);
    }

    /* =====================================================================
       Công Cụ Hỗ Trợ — soạn phiếu Tạo mới / Thay thế / Remove / Cập nhật
       cho CẢ DMS Userlist và Central User list. Pill chuyển dataset ở đầu tab
       chọn bảng đang thao tác; 4 chế độ dùng schema riêng nên không xung đột.
        ===================================================================== */
    const TOOL_COLS = ["UserName", "Description", "EmployeeCode", "EmployeeName", "DateOfBirth", "DateOfJoining", "Email", "RoleName", "TerritoryHierarchy", "IsActive", "Note"];
    const TOOL_DEFAULT_ROLE = "Enterprise reports";
    const TOOL_LIST_LIMIT = 100;
    const TOOL_DS_KEY = "masterdata_tool_ds", TOOL_DS_OK = ["central", "dms"];

    const UPD_EDITABLE_KEYS = new Set(["password_expiry_date", "description", "employee_code", "employee_name", "date_of_birth", "date_of_joining", "email", "role_name", "territory_hierarchy", "is_active"]);
    const UPD_FIELDS = CENTRAL_FIELDS.filter(([key]) => UPD_EDITABLE_KEYS.has(key));
    const UPD_LIST_LIMIT = 100;

    // Cấu hình theo dataset: schema, bảng Supabase, cột ticket, trường nhập người mới...
    function dsConfig(ds) {
      if (ds === "dms") return {
        ds, label: "DMS Userlist",
        fields: DMS_FIELDS, rows: () => state.dms, table: "dms_users", key: "username",
        nameKey: "role_name",
        isActive: r => ["1", "true", "y", "yes", "active"].includes(String(r.user_active_status ?? r.dt_active_status ?? "").trim().toLowerCase()),
        listCols: [["username", "UserName"], ["role_name", "Role"], ["region", "Region"], ["tenant", "Tenant"], ["email", "Email"]],
        editableKeys: new Set(["dt_active_status", "tenant", "user_active_status", "expire_date", "email", "role_name", "region_code", "region"]),
        ticketCols: ["UserName", "RoleName", "Tenant", "Region Code", "Region", "Email", "ExpireDate", "USERACTIVESTATUS", "DTACTIVESTATUS", "Note"],
        personFields: [
          ["username", "UserName", true, "text", "vd: 0070504590D1"],
          ["role_name", "RoleName", false, "text", "Operator-Dist. Owner"],
          ["tenant", "Tenant", false, "text", ""],
          ["region_code", "Region Code", false, "text", "VN15"],
          ["region", "Region", false, "text", "Mekong Delta Region"],
          ["email", "Email", false, "email", ""],
          ["expire_date", "ExpireDate", false, "text", "2024-01-22 06:26:51.940"]
        ],
        filePrefix: { replace: "Phieu_Thay_The_DMS", create: "Phieu_Tao_Moi_DMS", remove: "Phieu_Remove_DMS" },
        sheetName: "DMS Licenses"
      };
      return {
        ds: "central", label: "Central User list",
        fields: CENTRAL_FIELDS, rows: () => state.central, table: "central_users", key: "username",
        nameKey: "employee_name",
        isActive: r => ["1", "true", "y", "yes", "active"].includes(String(r.is_active ?? "").trim().toLowerCase()),
        listCols: [["username", "UserName"], ["employee_name", "EmployeeName"], ["description", "Description"], ["email", "Email"], ["territory_hierarchy", "Territory"]],
        editableKeys: UPD_EDITABLE_KEYS,
        ticketCols: TOOL_COLS,
        personFields: [
          ["username", "UserName", true, "text", "vd: 10002183"],
          ["name", "EmployeeName", true, "text", "Nguyễn Văn A"],
          ["email", "Email", true, "email", "ten@coca-cola.com.vn"],
          ["code", "EmployeeCode", false, "text", "Tự lấy theo UserName"],
          ["desc", "Description", false, "text", "Distribution - South (50094541)"],
          ["role", "RoleName", false, "text", ""],
          ["terr", "TerritoryHierarchy", false, "text", "VN14"],
          ["dob", "DateOfBirth", false, "date", ""],
          ["doj", "DateOfJoining", false, "date", ""]
        ],
        filePrefix: { replace: "Phieu_Thay_The_License", create: "Phieu_Tao_Moi_License", remove: "Phieu_Remove_License" },
        sheetName: "Licenses"
      };
    }
    const curDs = () => dsConfig(tool.ds);

    const tool = { mode: loadKey(TOOL_MODE_KEY, TOOL_MODES_OK, "replace"), ds: loadKey(TOOL_DS_KEY, TOOL_DS_OK, "central"), picked: [], q: "", status: "", repl: {}, list: [], single: false, shared: null, snap: null, applying: false };
    let toolIdx = { src: null, ds: "" };
    const blankPerson = (ds, o = {}) => {
      const base = { username: "", touched: false, email: "" };
      if (ds === "dms") Object.assign(base, { role_name: "", tenant: "", region_code: "", region: "", expire_date: "" });
      else Object.assign(base, { code: "", codeEdited: false, name: "", desc: "", role: TOOL_DEFAULT_ROLE, terr: "", dob: "", doj: "" });
      return { ...base, ...o };
    };
    const isInactive = r => !curDs().isActive(r);
    const toolName = s => String(s).normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[đĐ]/g, "D").toUpperCase().replace(/\s+/g, " ").trim();

    function toolIndex() {
      const cfg = curDs();
      if (toolIdx.src !== cfg.rows() || toolIdx.ds !== cfg.ds) {
        const u = new Map(), e = new Map();
        cfg.rows().forEach(r => { u.set(String(r.username).trim().toLowerCase(), r); if (r.email) e.set(String(r.email).trim().toLowerCase(), r); });
        toolIdx = { src: cfg.rows(), ds: cfg.ds, u, e };
      }
      return toolIdx;
    }
    const toolPickedRows = () => { const u = toolIndex().u; return tool.picked.map(k => tool.snap?.[k.toLowerCase()] || u.get(k.toLowerCase())).filter(Boolean); };
    const toolCount = items => tool.mode === "remove" || (tool.mode === "replace" && tool.single) ? tool.picked.length : items.length;
    function toolPersons() {
      const cfg = curDs();
      if (tool.mode === "remove") return [];
      if (tool.mode === "create") {
        if (!tool.list.length) tool.list.push(blankPerson(cfg.ds));
        return tool.list.map((p, i) => ({ p, old: null, i }));
      }
      const idx = toolIndex();
      if (tool.single) {
        if (!tool.picked.length) return [];
        const first = idx.u.get(tool.picked[0].toLowerCase());
        const seed = cfg.ds === "central" ? { role: first?.role_name || TOOL_DEFAULT_ROLE } : { role_name: first?.role_name || "" };
        tool.shared ||= blankPerson(cfg.ds, seed);
        return [{ p: tool.shared, old: null, i: 0, shared: true }];
      }
      return tool.picked.map((k, i) => {
        const old = idx.u.get(k.toLowerCase());
        const seed = cfg.ds === "central" ? { role: old?.role_name || TOOL_DEFAULT_ROLE } : { role_name: old?.role_name || "" };
        return { p: tool.repl[k] ||= blankPerson(cfg.ds, seed), old, i };
      });
    }
    const toolSingleOn = () => tool.mode === "replace" && tool.single;
    function toolValidate(items) {
      if (toolSingleOn()) {
        const em = String(items[0]?.p.email || "").trim().toLowerCase(), m = [];
        if (!em) m.push(["e", "Thiếu Email mới"]); else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)) m.push(["e", "Email sai định dạng"]);
        return { res: items.map(() => m), errors: m.length ? 1 : 0, warnings: 0 };
      }
      const cfg = curDs(), idx = toolIndex(), seen = new Map(), emails = new Map();
      let errors = 0, warnings = 0;
      const res = items.map(({ p }, i) => {
        const m = [], u = p.username.trim().toLowerCase(), em = (p.email || "").trim().toLowerCase();
        if (!u) m.push(["e", "Thiếu UserName"]);
        else {
          if (seen.has(u)) m.push(["e", `Trùng UserName với người #${seen.get(u) + 1}`]); else seen.set(u, i);
          const ex = idx.u.get(u);
          if (ex) m.push(["w", `UserName đã có trong ${cfg.label} (${cfg.isActive(ex) ? "Active" : "Deactive"})`]);
        }
        if (cfg.ds === "central") {
          if (!p.name.trim()) m.push(["e", "Thiếu EmployeeName"]);
          if (!em) m.push(["e", "Thiếu Email"]);
          else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)) m.push(["e", "Email sai định dạng"]);
          else {
            if (emails.has(em)) m.push(["e", `Trùng Email với người #${emails.get(em) + 1}`]); else emails.set(em, i);
            const ex = idx.e.get(em);
            if (ex) m.push(["w", `Email đang dùng bởi ${ex.username}`]);
          }
          if (!p.desc.trim()) m.push(["w", "Chưa có Description"]);
          if (!p.terr.trim()) m.push(["w", "Chưa có TerritoryHierarchy"]);
        } else {
          if (em && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)) m.push(["e", "Email sai định dạng"]);
          if (!p.role_name.trim()) m.push(["w", "Chưa có RoleName"]);
          if (!p.tenant.trim()) m.push(["w", "Chưa có Tenant"]);
        }
        if (m.some(x => x[0] === "e")) errors++; else if (m.some(x => x[0] === "w")) warnings++;
        return m;
      });
      return { res, errors, warnings };
    }
    function toolRows(items) {
      const cfg = curDs();
      const nz = (v, d = "") => (v === null || v === undefined || String(v).trim() === "") ? d : String(v).trim();
      const dt = v => v ? `${v} 00:00:00.000` : "";
      const oldRow = (o, note) => cfg.ds === "central"
        ? [o.username, nz(o.description), nz(o.employee_code), nz(o.employee_name), nz(o.date_of_birth, "NULL"), nz(o.date_of_joining, "NULL"), nz(o.email), nz(o.role_name), nz(o.territory_hierarchy), "0", note]
        : [o.username, nz(o.role_name), nz(o.tenant), nz(o.region_code), nz(o.region), nz(o.email), nz(o.expire_date), nz(o.user_active_status, "0"), nz(o.dt_active_status, "0"), note];
      const olds = tool.mode === "replace" ? (tool.single ? toolPickedRows().map(o => oldRow(o, "Deactive")) : items.filter(x => x.old).map(x => oldRow(x.old, "Deactive"))) : tool.mode === "remove" ? toolPickedRows().map(o => oldRow(o, "Remove")) : [];
      const newEmail = String(items[0]?.p.email || "").trim().toLowerCase();
      const cloneNew = o => cfg.ds === "central"
        ? [o.username, nz(o.description), nz(o.employee_code), nz(o.employee_name), nz(o.date_of_birth, "NULL"), nz(o.date_of_joining, "NULL"), newEmail, nz(o.role_name), nz(o.territory_hierarchy), "1", "Active"]
        : [o.username, nz(o.role_name), nz(o.tenant), nz(o.region_code), nz(o.region), newEmail, nz(o.expire_date), nz(o.user_active_status, "0"), nz(o.dt_active_status, "0"), "Active"];
      const news = toolSingleOn() ? toolPickedRows().map(cloneNew) : items.map(({ p }) => cfg.ds === "central"
        ? [p.username.trim(), p.desc.trim(), p.code.trim() || p.username.trim(), toolName(p.name), dt(p.dob) || "NULL", dt(p.doj) || "1900-01-01 00:00:00.000", p.email.trim().toLowerCase(), p.role.trim(), p.terr.trim(), "1", "Active"]
        : [p.username.trim(), p.role_name.trim(), p.tenant.trim(), p.region_code.trim(), p.region.trim(), (p.email || "").trim().toLowerCase(), p.expire_date.trim(), "1", "1", "Active"]);
      return { olds, news };
    }
    const toolStatus = () => tool.status || "all";
    let toolMulti = null;
    function toolListRows() {
      const cfg = curDs();
      const q = tool.q.trim().toLowerCase(), st = toolStatus(), okStatus = r => st === "all" || (st === "inactive") === !cfg.isActive(r);
      const tokens = [...new Map(tool.q.split(/[\s,;]+/).filter(Boolean).map(x => [x.toLowerCase(), x])).values()];
      toolMulti = null;
      if (tokens.length >= 2) {
        const want = new Set(tokens.map(x => x.toLowerCase())), found = new Set(), out = [];
        let hidden = 0;
        cfg.rows().forEach(r => {
          const hit = [r.username, r.employee_code, r.email].map(x => String(x ?? "").trim().toLowerCase()).filter(k => want.has(k));
          if (!hit.length) return;
          hit.forEach(k => found.add(k));
          if (okStatus(r)) out.push(r); else hidden++;
        });
        if (found.size) { toolMulti = { total: tokens.length, missing: tokens.filter(x => !found.has(x.toLowerCase())), hidden }; return out; }
      }
      return cfg.rows().filter(r => okStatus(r) && (!q || rowSearchText(r, cfg.fields).includes(q)));
    }
    function renderToolList() {
      const cfg = curDs();
      const rows = toolListRows(), picked = new Set(tool.picked), lim = toolMulti ? 500 : TOOL_LIST_LIMIT;
      const banner = toolMulti ? multiBanner(toolMulti) : "";
      if (!rows.length) return banner + `<div class="empty"><strong>${state.loading ? "Đang tải dữ liệu…" : "Không có account phù hợp"}</strong>Không có account nào khớp. Thử đổi bộ lọc Trạng thái hoặc từ khóa tìm kiếm.</div>`;
      const statusCell = r => `<span class="badge ${cfg.isActive(r) ? "badge-success" : "badge-danger"}">${cfg.isActive(r) ? "Active" : "Deactive"}</span>`;
      const cols = cfg.listCols;
      const head = `<th></th>${cols.map(([, l]) => `<th>${escapeHtml(l)}</th>`).join("")}<th>Trạng thái</th>`;
      const body = rows.slice(0, lim).map(r => { const on = picked.has(r.username); return `<tr data-pk="${escapeHtml(r.username)}" class="${on ? "sel" : ""}"><td><input type="checkbox" ${on ? "checked" : ""} aria-label="Chọn ${escapeHtml(r.username)}"></td>${cols.map(([k]) => `<td>${k === "username" ? `<strong>${cellHtml(r[k])}</strong>` : cellHtml(r[k])}</td>`).join("")}<td>${statusCell(r)}</td></tr>`; }).join("");
      return banner + `<div class="table-wrap tl-scroll"><table class="tl-table"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div><div class="tl-foot">Hiển thị ${nf(Math.min(rows.length, lim))} / ${nf(rows.length)} account${rows.length > lim ? " — dùng ô tìm kiếm để thu hẹp" : ""}</div>`;
    }
    function toolMsg(m, touched, i) {
      const e = m.filter(x => x[0] === "e"), w = m.filter(x => x[0] === "w");
      const [cls, txt] = !touched && e.length ? ["", "Chưa nhập"] : e.length ? ["err", e[0][1]] : w.length ? ["warn", w[0][1]] : ["ok", "Hợp lệ"];
      return `<span class="tl-msg ${cls}" data-msg="${i}" title="${escapeHtml(m.map(x => x[1]).join("\n"))}">${escapeHtml(txt)}</span>`;
    }
    function renderToolCards(items, v) {

    const upd = { picked: [], q: "", status: "", edits: {}, single: false, sharedEmail: "" };

    async function updSave() {
      const cfg = curDs();

    async function updExport() {
      const cfg = curDs();
      const items = updChangedItems();
      const usingSaved = !items.length && updLastSaved && updLastSaved.pairs.length;
      if ((!items.length && !usingSaved) || updBlocked()) return;
      const cols = ["Status", ...cfg.fields.map(([, label]) => label), "Changed Fields"];
      const pairs = usingSaved ? updLastSaved.pairs : items.map(updRowPair);
      const stamp = new Date().toISOString().slice(0, 16).replace(/[:T]/g, "-");
      const fileName = `Phieu_Cap_Nhat_${cfg.ds === "dms" ? "DMS" : "Central"}_${stamp}.xlsx`;
      try {
        await loadLib("exceljs").catch(() => loadLib("xlsx"));
        if (window.ExcelJS) {
          const wb = new ExcelJS.Workbook(), ws = wb.addWorksheet(cfg.ds === "dms" ? "Cap Nhat DMS" : "Cap Nhat");
          const fill = argb => ({ type: "pattern", pattern: "solid", fgColor: { argb } });
          const side = { style: "thin", color: { argb: "FFBFBFBF" } };
          const put = (vals, baseArgb, changedIdx, headBold) => {
            ws.addRow(vals).eachCell({ includeEmpty: true }, (c, colNumber) => {
              const isChg = changedIdx.has(colNumber - 1);
              c.numFmt = "@";
              c.fill = fill(isChg ? "FFFFDB8A" : baseArgb);
              c.font = { name: "Times New Roman", size: 11, bold: !!headBold || isChg, color: isChg ? { argb: "FF6B4B00" } : undefined };
              c.border = { top: side, left: side, bottom: side, right: side };
            });
          };
          put(cols, "FFF3DCF2", new Set(), true);
          pairs.forEach(({ oldVals, changedIdx }) => put(oldVals, "FFD9D9D9", changedIdx));
          pairs.forEach(({ newVals, changedIdx }) => put(newVals, "FFB9E4A8", changedIdx));
          ws.getColumn(1).width = 13;
          cfg.fields.forEach((_, i) => { ws.getColumn(i + 2).width = 22; });
          ws.getColumn(cols.length).width = 30;
          ws.views = [{ state: "frozen", ySplit: 1, xSplit: 1 }];
          const buf = await wb.xlsx.writeBuffer();
          const a = Object.assign(document.createElement("a"), { href: URL.createObjectURL(new Blob([buf], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" })), download: fileName });
          document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
        } else {
          const aoa = [cols]; pairs.forEach(({ oldVals }) => aoa.push(oldVals)); pairs.forEach(({ newVals }) => aoa.push(newVals));
          const ws = XLSX.utils.aoa_to_sheet(aoa), wb = XLSX.utils.book_new();

    }
    function bindUpdateEvents() {
      const pg = $("#tool-page"); if (!pg) return;
      let timer;
      pg.addEventListener("click", e => {
        if (tool.mode !== "update") return;
        const t = e.target;
        const tr = t.closest("tr[data-pk]");
        if (tr) {
          const cb = tr.querySelector("input"); if (t !== cb) cb.checked = !cb.checked;
          tr.classList.toggle("sel", cb.checked);
          upd.picked = upd.picked.filter(k => k !== tr.dataset.pk); if (cb.checked) upd.picked.push(tr.dataset.pk);
          updLastSaved = null;
          updDrawCards(); return;
        }
        const a = t.closest("[data-upd]"); if (!a) return;
        const act = a.dataset.upd, key = a.dataset.key;
        if (act === "save") updSave();
        else if (act === "export") updExport();
        else if (act === "pickall") {
          const rows = updListRows();
          if (!rows.length) return toast("Không có kết quả để chọn.", "error");
          const have = new Set(upd.picked); rows.forEach(r => have.has(r.username) || upd.picked.push(r.username));
          updLastSaved = null;
          $("#upd-list").innerHTML = renderUpdList(); updDrawCards(); toast(`Đã chọn ${nf(rows.length)} account.`, "success");
        }
        else if (act === "clear") { upd.picked = []; upd.edits = {}; updLastSaved = null; $("#upd-list").innerHTML = renderUpdList(); updDrawCards(); }
        else if (act === "remove") {
          upd.picked = upd.picked.filter(k => k !== key); delete upd.edits[key]; updLastSaved = null;
          const row = [...pg.querySelectorAll("tr[data-pk]")].find(x => x.dataset.pk === key); if (row) { row.classList.remove("sel"); row.querySelector("input").checked = false; }
          updDrawCards();
        } else if (act === "reset") { delete upd.edits[key]; updLastSaved = null; updDrawCards(); }
      });
      pg.addEventListener("input", e => {
        if (tool.mode !== "update") return;
        const t = e.target;
        if (t.id === "upd-search") { upd.q = t.value; clearTimeout(timer); timer = setTimeout(() => { $("#upd-list").innerHTML = renderUpdList(); }, 150); return; }
        if (t.id === "upd-shared-email") {
          upd.sharedEmail = t.value; updLastSaved = null; updRefresh();
          const m = $("#upd-shared-msg"), err = updEmailError();
          if (m) { m.className = `tl-msg ${err ? (upd.sharedEmail.trim() ? "err" : "") : "ok"}`; m.textContent = err || "Hợp lệ"; }
          return;
        }
        if (!t.dataset.f) return;
        const edit = upd.edits[t.dataset.key]; if (!edit) return;
        edit[t.dataset.f] = t.value;

        updRefresh();
        const field = t.closest(".field");
        if (field) {
          const old = updIndex().u.get(t.dataset.key.toLowerCase());
          field.classList.toggle("changed", String(old?.[t.dataset.f] ?? "").trim() !== String(t.value).trim());
        }
        const msg = pg.querySelector(`[data-upd-msg="${CSS.escape(t.dataset.key)}"]`);
        const item = updPersons().find(x => x.key === t.dataset.key);
        if (msg && item) { const n = updChangedFields(item.old, item.edit).length; msg.className = `tl-msg ${n ? "ok" : ""}`; msg.textContent = n ? `${n} trường đã đổi` : "Chưa chỉnh sửa"; }

    }
    async function boot() {
      state.booting = configured();
      render();
      if (!configured()) return;
      state.supabase = window.supabase.createClient(SUPABASE_CONFIG.url, SUPABASE_CONFIG.anonKey, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } });
      state.supabase.auth.onAuthStateChange((event, session) => {
        const prevUserId = state.session?.user?.id || null;
        state.session = session;
        // Cửa sổ này chỉ là popup phụ để hoàn tất OAuth Google; khi đã có session thì đóng lại,
        // cửa sổ chính (window.opener) sẽ tự nhận session qua đồng bộ đa-tab của Supabase.
        if (window.opener && session) { setTimeout(() => window.close(), 300); return; }
        // Chuyển sang tab khác rồi quay lại: Supabase tự làm mới phiên và bắn lại SIGNED_IN / TOKEN_REFRESHED cho CÙNG người dùng.
        // Trước đây mỗi sự kiện đều tải lại toàn bộ dữ liệu (thường 2 lần liên tiếp). Giờ chỉ cập nhật session, không tải lại.
        if (event === "INITIAL_SESSION" || event === "TOKEN_REFRESHED" || (prevUserId === (session?.user?.id || null) && state.profile)) return;
        setTimeout(async () => { await ensureProfile(); state.booting = false; render(); }, 0);
      });
      try {
        const { data } = await state.supabase.auth.getSession();
        state.session = data.session; await ensureProfile();
      } finally { state.booting = false; render(); }
    }

    // Gộp các lần gọi trùng cho cùng một người dùng (khởi động + sự kiện đăng nhập + popup Google) → chỉ tải dữ liệu 1 lần.
    let profileTask = null, profileTaskFor;
    function ensureProfile() {
      const uid = state.session?.user?.id || null;
      if (profileTask && profileTaskFor === uid) return profileTask;
      profileTaskFor = uid;
      profileTask = resolveProfile().then(() => { if (!state.profile) profileTask = null; });
      return profileTask;
    }

    async function resolveProfile() {
      if (!state.session) { state.profile = null; return; }
      const { data, error } = await state.supabase.from("profiles").select("*").eq("id", state.session.user.id).maybeSingle();
      if (error) { toast(`Không đọc được hồ sơ: ${error.message}`, "error"); state.profile = null; return; }
      if (data) {
        state.profile = data;
      } else {
        // Lần đăng nhập Google đầu tiên: chưa có dòng profiles tương ứng.
        // Tự tạo hồ sơ ở trạng thái chờ duyệt để hiển thị đúng màn hình renderPending() thay vì kẹt ở loading.
        const email = state.session.user.email || "";
        const displayName = state.session.user.user_metadata?.full_name || state.session.user.user_metadata?.name || email;
        const { data: created, error: insertError } = await state.supabase
          .from("profiles")
          .insert({ id: state.session.user.id, email, display_name: displayName, approval_status: "pending" })
          .select()
          .maybeSingle();
        if (insertError) {
          // Có thể một trigger phía Supabase đã tạo hồ sơ ngay trước đó (race condition) — đọc lại 1 lần.
          const retry = await state.supabase.from("profiles").select("*").eq("id", state.session.user.id).maybeSingle();
          if (retry.data) {
            state.profile = retry.data;
          } else {
            // Không tự tạo được hồ sơ (có thể do RLS chặn insert) — vẫn hiển thị màn hình chờ duyệt
            // tạm thời trên giao diện, nhưng cần kiểm tra RLS/trigger để hồ sơ thực sự được lưu và
            // xuất hiện trong danh sách phê duyệt của Super-admin.
            toast(`Không tạo được hồ sơ mới: ${insertError.message}`, "error");
            state.profile = { id: state.session.user.id, email, display_name: displayName, approval_status: "pending" };
          }
        } else {
          state.profile = created;
        }
      }
      if (state.profile?.approval_status === "approved") { await loadData(); subscribeSettingsChanges(); }
      subscribeProfileChanges(state.session.user.id);
    }

    // Đồng bộ realtime Max Licenses: khi Super-admin đổi cấu hình, mọi phiên đang mở (kể cả trang Central User list) cập nhật ngay.
    function subscribeSettingsChanges() {
      if (settingsChannel) { state.supabase.removeChannel(settingsChannel); settingsChannel = null; }
      settingsChannel = state.supabase
        .channel(`${APP_CHANNEL_PREFIX}:app-settings`)
        .on("postgres_changes", { event: "*", schema: "public", table: LICENSE_SETTINGS_TABLE, filter: `key=eq.${LICENSE_SETTINGS_KEY}` }, (payload) => {
          const val = payload.new?.value;
          if (hasValue(val)) {
            const n = Number(val);
            if (Number.isFinite(n) && n >= 0 && n !== state.settings.maxLicenses) { state.settings.maxLicenses = n; render(); }
          }
        })
        .on("postgres_changes", { event: "*", schema: "public", table: LICENSE_SETTINGS_TABLE, filter: `key=eq.${IMPORTANT_DAYS_KEY}` }, (payload) => {
          state.importantDays = payload.eventType === "DELETE" ? [] : parseImportantDays(payload.new?.value);
          refreshCokeRow();
        })
        .on("postgres_changes", { event: "*", schema: "public", table: LICENSE_SETTINGS_TABLE, filter: `key=eq.${GRN_OVERRIDE_KEY}` }, (payload) => {
          state.grnOverrides = payload.eventType === "DELETE" ? {} : parseSettingJson(payload.new?.value);
          refreshCokeRow();
        })
        .on("postgres_changes", { event: "*", schema: "public", table: LICENSE_SETTINGS_TABLE, filter: `key=eq.${JIRA_CONFIG_KEY}` }, (payload) => {
          state.jiraConfig = payload.eventType === "DELETE" ? {} : parseSettingJson(payload.new?.value);
          if (document.querySelector(".cal-jira")) refreshCokeRow();
        })
        .subscribe();
    }

    function subscribeProfileChanges(userId) {
      if (profileChannel) { state.supabase.removeChannel(profileChannel); profileChannel = null; }
      if (!userId) return;
      profileChannel = state.supabase
        .channel(`${APP_CHANNEL_PREFIX}:profile-${userId}`)
        .on("postgres_changes", { event: "UPDATE", schema: "public", table: "profiles", filter: `id=eq.${userId}` }, async (payload) => {
          state.profile = payload.new;
          if (state.profile.approval_status === "approved") { toast("Tài khoản của bạn đã được phê duyệt!", "success"); await loadData(); }
          render();
        })
        .subscribe();
      // Nếu là Super-admin, lắng nghe luôn kênh thông báo "có người vừa gửi yêu cầu chờ duyệt".
      if (isAdmin()) subscribeAdminNotifications(); else if (adminChannel) { state.supabase.removeChannel(adminChannel); adminChannel = null; }
    }

    function subscribeAdminNotifications() {
      if (adminChannel) { state.supabase.removeChannel(adminChannel); adminChannel = null; }
      adminChannel = state.supabase
        .channel(`${APP_CHANNEL_PREFIX}:admin-notify`)
        .on("broadcast", { event: "new-request" }, async (payload) => {
          const p = payload.payload || {};
          toast(`${p.display_name || p.email || "Một tài khoản"} vừa gửi yêu cầu phê duyệt.`);
          await loadData();
          render();
        })
        .subscribe();
    }

    async function sendRequestToAdmin() {
      if (!state.supabase || !state.session || state.requestSent) return;
      const channel = state.supabase.channel(`${APP_CHANNEL_PREFIX}:admin-notify`);
      channel.subscribe(async (status) => {
        if (status === "SUBSCRIBED") {
          await channel.send({
            type: "broadcast",
            event: "new-request",
            payload: { email: state.profile?.email || state.session.user.email, display_name: state.profile?.display_name || "" }
          });
