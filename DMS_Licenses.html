<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Masterdata DMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <meta name="description" content="Cổng quản lý Masterdata với xác thực Google và phân quyền Supabase." />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="preconnect" href="https://esm.sh" crossorigin />
  <!-- Supabase tải song song, không chặn hiển thị. XLSX / ExcelJS (~2MB) được tải lười khi rảnh hoặc khi cần xuất/nhập Excel. -->
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- morphicons (npm install morphicons) — bản ESM chính thức qua esm.sh, định nghĩa <morph-icon> cho toàn app -->
  <script type="module" async>
    import { defineMorphIcon } from "https://esm.sh/morphicons@1.7.1/element";
    defineMorphIcon();
  </script>
  <style>
    /* =====================================================================
       Masterdata DMS — Crimson theme
       Màu gốc #b71c1c. Gradient đi từ đỏ tươi (#e53935) → đỏ gốc → đỏ rượu vang (#3d080c),
       điểm nhấn vàng hổ phách (#ffc857) dùng rất tiết chế cho trạng thái active / eyebrow.
       ===================================================================== */
    :root {
      --ink: #2a1416;
      --ink-2: #4a2f31;
      --muted: #80666a;
      --line: #f1dedd;
      --line-strong: #e7c7c5;
      --surface: #ffffff;
      --surface-soft: #fdf6f5;

      --brand: #b71c1c;
      --brand-light: #e53935;
      --brand-dark: #8e1216;
      --brand-deep: #5a0d12;
      --brand-soft: #fdeceb;
      --brand-soft-2: #fbd5d2;
      --gold: #ffc857;

      --g-brand: linear-gradient(135deg, #dc3b36 0%, #b71c1c 52%, #8a1015 100%);
      --g-brand-hover: linear-gradient(135deg, #ea4a44 0%, #c62626 52%, #9b1419 100%);
      --g-deep: linear-gradient(165deg, #6b1117 0%, #3d080c 58%, #1e0407 100%);
      --g-soft: linear-gradient(135deg, #fff3f2 0%, #fde2df 100%);
      --g-text: linear-gradient(100deg, #3d080c 0%, #b71c1c 100%);

      --success: #0b7a4f;
      --success-soft: #e4f6ed;
      --warning: #b45309;
      --warning-soft: #fff3df;
      --danger: #a31515;
      --danger-soft: #ffeceb;

      --shadow: 0 22px 60px rgba(90, 13, 18, .14);
      --shadow-card: 0 1px 2px rgba(90, 13, 18, .05), 0 10px 28px rgba(120, 20, 24, .06);
      --radius: 18px;
      --sidebar: 262px;
      font-family: "Be Vietnam Pro", Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background: #f4e2e0;
    }
    * { box-sizing: border-box; scrollbar-width: thin; scrollbar-color: #dba7a4 transparent; }
    *::-webkit-scrollbar { width: 9px; height: 9px; }
    *::-webkit-scrollbar-thumb { background: linear-gradient(180deg, #e8a9a5, #c96a66); border-radius: 99px; border: 2px solid transparent; background-clip: padding-box; }
    ::selection { background: #b71c1c; color: #fff; }
    body { margin: 0; min-width: 320px; color: var(--ink); background: #f4e2e0; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
    body::before {
      content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none; transform: translateZ(0);
      background:
        radial-gradient(900px 480px at 92% -8%, rgba(229, 57, 53, .11), transparent 62%),
        radial-gradient(800px 520px at -8% 108%, rgba(183, 28, 28, .10), transparent 60%);
    }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    :focus-visible { outline: 2px solid var(--brand-light); outline-offset: 2px; }
    .hidden { display: none !important; }
    .app-shell { min-height: 100vh; display: flex; }

    /* ---------- Sidebar ---------- */
    .sidebar {
      width: var(--sidebar); flex: 0 0 var(--sidebar); color: #f0d4d2; overflow: hidden;
      background: var(--g-deep);
      display: flex; flex-direction: column; padding: 24px 16px; position: fixed; inset: 0 auto 0 0; z-index: 20;
    }
    .sidebar::before {
      content: ""; position: absolute; inset: 0; pointer-events: none;
      background:
        radial-gradient(260px 220px at 0% 0%, rgba(239, 83, 80, .45), transparent 70%),
        radial-gradient(240px 260px at 100% 100%, rgba(183, 28, 28, .40), transparent 70%);
    }
    .sidebar > * { position: relative; z-index: 1; }
    .brand { display: flex; align-items: center; gap: 12px; padding: 2px 10px 30px; color: #fff; }
    .brand-mark {
      width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center; color: #fff; flex: 0 0 auto;
      background: linear-gradient(135deg, #ff7a6b 0%, #e53935 45%, #a51218 100%);
      box-shadow: 0 6px 18px rgba(229, 57, 53, .45), inset 0 1px 0 rgba(255, 255, 255, .38);
    }
    .brand-mark svg { width: 19px; height: 19px; }
    .brand strong { font-size: 15px; letter-spacing: -.02em; }
    .brand small { display: block; color: #d8a7a5; font-size: 10.5px; margin-top: 3px; }
    .nav-label { font-size: 11px; font-weight: 600; letter-spacing: .02em; color: rgba(255, 220, 217, .5); padding: 0 12px 9px; }
    .nav { display: grid; gap: 5px; }
    .nav button {
      border: 0; background: transparent; color: #dfb9b7; text-align: left; padding: 11px 12px; font-weight: 500;
      border-radius: 12px; display: flex; align-items: center; gap: 11px; transition: .18s ease;
    }
    .nav button:hover { background: rgba(255, 255, 255, .09); color: #fff; }
    .nav button.active {
      color: #fff; font-weight: 650;
      background: linear-gradient(100deg, #e53935 0%, #b71c1c 70%, #94141a 100%);
      box-shadow: inset 3px 0 0 var(--gold), 0 8px 20px rgba(0, 0, 0, .28);
    }
    .nav button:focus-visible, .signout:focus-visible { outline-color: var(--gold); }
    .nav button.nav-parent { width: 100%; }
    .nav button.nav-parent.group-on { color: #fff; font-weight: 650; background: rgba(255, 255, 255, .12); box-shadow: inset 3px 0 0 var(--gold); }
    .nav button.nav-parent .nav-chev { width: 15px; height: 15px; margin-left: auto; opacity: .85; transition: transform .3s var(--ease); }
    .nav button.nav-parent[aria-expanded="false"] .nav-chev { transform: rotate(-90deg); }
    .nav-sub-wrap { display: grid; grid-template-rows: 1fr; margin-top: -2px; transition: grid-template-rows .3s var(--ease), margin-top .3s var(--ease), opacity .25s; }
    .nav-sub-wrap.collapsed { grid-template-rows: 0fr; margin-top: -5px; opacity: 0; pointer-events: none; }
    .nav-sub-wrap.collapsed .nav-sub-inner { visibility: hidden; transition: visibility 0s .3s; }
    .nav-sub-inner { overflow: hidden; min-height: 0; display: grid; gap: 4px; position: relative; }
    .nav-sub-inner::before { content: ""; position: absolute; left: 23px; top: 6px; bottom: 6px; width: 1px; background: rgba(255, 255, 255, .18); }
    .nav button.nav-sub { padding: 9px 12px 9px 38px; font-size: 13px; gap: 10px; }
    .nav button.nav-sub::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: .55; flex: 0 0 auto; margin-left: -17px; }
    .nav button.nav-sub.active::before { opacity: 1; background: var(--gold); }
    .nav svg { width: 17px; height: 17px; flex: 0 0 auto; }
    .sidebar-foot { margin-top: auto; padding: 16px 4px 0; border-top: 1px solid rgba(255, 255, 255, .12); }
    .user-card {
      display: flex; align-items: center; gap: 9px; padding: 8px 8px 8px 9px; border-radius: 14px;
      background: rgba(255, 255, 255, .05); border: 1px solid rgba(255, 255, 255, .08); transition: .18s ease;
    }
    .user-card:hover { background: rgba(255, 255, 255, .09); border-color: rgba(255, 255, 255, .14); }
    .user-chip { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1 1 auto; }
    .user-chip div:last-child { min-width: 0; }
    .user-chip b, .user-chip span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .user-chip b { color: #fff4f3; font-size: 12px; }
    .user-chip span { color: #d8a7a5; font-size: 11px; margin-top: 2px; }
    .signout {
      flex: 0 0 auto; width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; padding: 0;
      border: 1px solid rgba(255, 255, 255, .14); background: rgba(255, 255, 255, .05); color: #dfb9b7; transition: .18s ease;
    }
    .signout svg { width: 15px; height: 15px; }
    .signout:hover { background: linear-gradient(135deg, #ea4a44, #8e1216); color: #fff; border-color: transparent; box-shadow: 0 8px 18px rgba(183, 28, 28, .38); transform: translateY(-1px); }
    .signout:active { transform: translateY(0); }
    .avatar {
      width: 33px; height: 33px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 12px; flex: 0 0 auto;
      background: linear-gradient(135deg, #ffe0a8, #ff9a76); color: #5a0d12; box-shadow: 0 0 0 2px rgba(255, 255, 255, .18);
    }

    /* ---------- Main / topbar ---------- */
    .main { margin-left: var(--sidebar); flex: 1; min-width: 0; }
    .topbar {
      height: 78px; padding: 0 36px; background: linear-gradient(180deg, #fffefe 0%, #fffbfa 100%); border-bottom: 1px solid var(--line);
      display: flex; align-items: center; justify-content: space-between; gap: 16px; position: sticky; top: 0; z-index: 10;
      box-shadow: 0 10px 26px rgba(90, 13, 18, .07), 0 1px 0 rgba(255, 255, 255, .6) inset;
    }
    .topbar::after { content: ""; position: absolute; left: 0; right: 0; bottom: -2px; height: 3px; background: linear-gradient(90deg, #b71c1c 0%, #e53935 32%, rgba(229, 57, 53, 0) 80%); }
    .topbar-icon {
      width: 40px; height: 40px; border-radius: 13px; display: grid; place-items: center; color: #fff; flex: 0 0 auto;
      background: var(--g-brand); box-shadow: 0 10px 20px rgba(183, 28, 28, .32), inset 0 1px 0 rgba(255, 255, 255, .3);
    }
    .topbar-icon svg { width: 19px; height: 19px; }
    .topbar h1 { margin: 0; font-size: 21px; font-weight: 780; letter-spacing: -.03em; color: var(--ink); }
    .topbar p { margin: 3px 0 0; color: var(--muted); font-size: 12.5px; }

    /* ---------- Topbar right: connection badge ---------- */
    .topbar-right { display: flex; align-items: center; gap: 14px; }
    .conn-badge {
      display: inline-flex; align-items: center; gap: 8px; padding: 8px 16px; border-radius: 99px; font-size: 12px; font-weight: 700;
      background: linear-gradient(135deg, #e9f9f1, #d2f1e2); border: 1px solid #b6e5cf; color: var(--success); white-space: nowrap;
      box-shadow: 0 6px 16px rgba(11, 122, 79, .14), inset 0 1px 0 rgba(255, 255, 255, .5);
    }
    .conn-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--success); flex: 0 0 auto; animation: conn-pulse 1.8s infinite; }
    @keyframes conn-pulse { 0% { box-shadow: 0 0 0 0 rgba(11, 122, 79, .45); } 70% { box-shadow: 0 0 0 6px rgba(11, 122, 79, 0); } 100% { box-shadow: 0 0 0 0 rgba(11, 122, 79, 0); } }
    /* section.page: "tờ làm việc" sáng, bo góc, có viền và bóng — nổi hẳn lên khỏi nền hồng đậm phía sau */
    .page {
      position: relative; margin: 18px 24px 26px; padding: 20px 24px 26px; border-radius: 30px;
      background:
        radial-gradient(640px 260px at 100% 0%, rgba(229, 57, 53, .07), transparent 70%),
        linear-gradient(180deg, #fffefd 0%, #fff7f6 100%);
      border: 1px solid #efcdcb;
      box-shadow: inset 0 1px 0 #fff, 0 2px 6px rgba(120, 20, 24, .06), 0 36px 80px rgba(120, 20, 24, .13);
    }
    .page .panel { border-color: #f0d6d4; box-shadow: 0 1px 2px rgba(90, 13, 18, .06), 0 16px 38px rgba(120, 20, 24, .10); }
    .eyebrow {
      display: inline-block; color: var(--brand); font-size: 12px; font-weight: 650; margin-bottom: 10px;
      background: var(--g-soft); border: 1px solid var(--brand-soft-2); border-radius: 99px; padding: 4px 11px;
    }
    .page-title {
      margin: 0; font-size: 29px; letter-spacing: -.04em; line-height: 1.2; font-weight: 750; width: fit-content; max-width: 100%;
      background: var(--g-text); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent;
    }
    .page-subtitle { margin: 8px 0 0; color: var(--muted); font-size: 14px; }
    /* header-row: banner đỏ đậm ở đầu mỗi trang, cùng họ với sidebar */
    .header-row {
      position: relative; overflow: hidden; display: flex; justify-content: space-between; gap: 18px; align-items: center;
      padding: 20px 28px; margin-bottom: 18px; border-radius: 22px;
      background:
        radial-gradient(360px 220px at 92% -30%, rgba(255, 200, 87, .30), transparent 65%),
        radial-gradient(320px 220px at 6% 140%, rgba(255, 110, 96, .34), transparent 65%),
        linear-gradient(118deg, #c62828 0%, #a11318 46%, #5e0c12 100%);
      box-shadow: 0 18px 38px rgba(140, 18, 24, .28), inset 0 1px 0 rgba(255, 255, 255, .18);
    }
    .header-row::after {
      content: ""; position: absolute; right: -50px; bottom: -120px; width: 260px; height: 260px; border-radius: 50%; pointer-events: none;
      border: 1px solid rgba(255, 255, 255, .15); box-shadow: 0 0 0 30px rgba(255, 255, 255, .03), 0 0 0 62px rgba(255, 255, 255, .02);
    }
    .header-row > * { position: relative; z-index: 1; }
    .header-row .eyebrow { background: rgba(255, 255, 255, .13); border-color: rgba(255, 255, 255, .22); color: #ffdca0; margin-bottom: 9px; }
    .header-row .page-title { background: none; -webkit-text-fill-color: #fff; color: #fff; font-size: 27px; }
    .header-row .page-subtitle { color: rgba(255, 236, 234, .84); margin-top: 6px; }

    /* Dải chào mừng ở Tổng quan — điểm nhấn gradient lớn nhất của app */
    .header-row.hero {
      position: relative; overflow: hidden; align-items: center; padding: 30px 32px; border-radius: 24px; margin-bottom: 24px;
      background:
        radial-gradient(420px 260px at 88% -20%, rgba(255, 200, 87, .38), transparent 65%),
        radial-gradient(360px 260px at 8% 130%, rgba(255, 110, 96, .40), transparent 65%),
        linear-gradient(118deg, #c62828 0%, #a11318 42%, #5e0c12 100%);
      box-shadow: 0 22px 46px rgba(140, 18, 24, .30), inset 0 1px 0 rgba(255, 255, 255, .18);
    }
    .header-row.hero::after {
      content: ""; position: absolute; right: -60px; bottom: -110px; width: 320px; height: 320px; border-radius: 50%; pointer-events: none;
      border: 1px solid rgba(255, 255, 255, .16); box-shadow: 0 0 0 38px rgba(255, 255, 255, .035), 0 0 0 78px rgba(255, 255, 255, .025);
    }
    .header-row.hero > * { position: relative; z-index: 1; }
    .hero .eyebrow { background: rgba(255, 255, 255, .13); border-color: rgba(255, 255, 255, .22); color: #ffdca0; }
    .hero .page-title { background: none; -webkit-text-fill-color: #fff; color: #fff; font-size: 30px; }
    .hero .page-subtitle { color: rgba(255, 236, 234, .82); }

    .actions { display: flex; flex-wrap: wrap; gap: 9px; align-items: center; }

    /* ---------- Buttons ---------- */
    .btn {
      display: inline-flex; gap: 8px; align-items: center; justify-content: center; border: 1px solid transparent;
      border-radius: 11px; padding: 10px 16px; font-size: 13px; font-weight: 650; transition: .2s ease; white-space: nowrap;
    }
    .btn svg { width: 16px; height: 16px; }
    .btn-primary {
      color: #fff; background: var(--g-brand); background-size: 140% 140%; background-position: 0 50%;
      box-shadow: 0 8px 20px rgba(183, 28, 28, .30), inset 0 1px 0 rgba(255, 255, 255, .22);
    }
    .btn-primary:hover { background: var(--g-brand-hover); transform: translateY(-1px); box-shadow: 0 12px 26px rgba(183, 28, 28, .38), inset 0 1px 0 rgba(255, 255, 255, .28); }
    .btn-primary:active { transform: translateY(0); box-shadow: 0 4px 10px rgba(183, 28, 28, .3); }
    .btn-light { color: #8e1216; background: linear-gradient(180deg, #fff, #ffeceb); box-shadow: 0 8px 22px rgba(0, 0, 0, .22); }
    .btn-light:hover { background: #fff; transform: translateY(-1px); }
    .btn-secondary { background: linear-gradient(180deg, #fff, #fff8f7); color: var(--ink-2); border-color: var(--line-strong); }
    .btn-secondary:hover { background: var(--g-soft); border-color: #dc8985; color: var(--brand-dark); }
    .btn-danger { background: linear-gradient(180deg, #fff5f4, #ffe4e2); color: var(--danger); border-color: #f0b3b0; }
    .btn-danger:hover { background: linear-gradient(135deg, #a31515, #6b0d10); color: #fff; border-color: transparent; }
    .btn-plain { background: transparent; color: var(--muted); border: 0; padding: 6px; border-radius: 9px; }
    .btn-plain:hover { background: var(--brand-soft); color: var(--brand); }
    .btn:disabled { cursor: not-allowed; opacity: .55; transform: none; }
    .btn-icon { display: inline-flex; width: 16px; height: 16px; flex: 0 0 auto; }
    .btn-icon svg { width: 16px; height: 16px; }
    .btn-icon.spin svg { animation: spin .85s linear infinite; }
    .btn-excel {
      color: #0b6b42; background: linear-gradient(180deg, #fff, #eafaf1); border-color: #b6e5cf;
      box-shadow: 0 1px 0 rgba(255, 255, 255, .6) inset;
    }
    .btn-excel:hover {
      background: linear-gradient(135deg, #17a765, #0b6b42); color: #fff; border-color: transparent;
      transform: translateY(-1px); box-shadow: 0 10px 22px rgba(11, 107, 66, .30);
    }
    .btn-excel:active { transform: translateY(0); }

    /* ---------- Cards ---------- */
    .grid-stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; margin-bottom: 22px; }
    .stat-card, .panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow-card); }
    .stat-card { --a: #e53935; --b: #a51218; padding: 20px 18px 18px; position: relative; overflow: hidden; }
    .stat-card:nth-child(2) { --a: #f4511e; --b: #b23a0c; }
    .stat-card:nth-child(3) { --a: #d81b60; --b: #7c0b45; }
    .stat-card:nth-child(4) { --a: #d97706; --b: #a8410a; }
    .stat-card::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 4px; background: linear-gradient(90deg, var(--a), var(--b)); }
    .stat-card::after { content: ""; position: absolute; width: 96px; height: 96px; border-radius: 50%; right: -28px; top: -34px; background: linear-gradient(135deg, var(--a), var(--b)); opacity: .13; }
    .stat-label { color: var(--muted); font-size: 12px; font-weight: 600; position: relative; z-index: 1; }
    .stat-value {
      font-size: 30px; font-weight: 750; letter-spacing: -.04em; margin-top: 10px; position: relative; z-index: 1; font-variant-numeric: tabular-nums;
      width: fit-content; max-width: 100%;
      background: linear-gradient(120deg, var(--a), var(--b)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent;
    }
    .stat-note { color: #a08b8d; font-size: 11px; margin-top: 4px; position: relative; z-index: 1; }
    .panel { overflow: hidden; }
    .panel-head {
      padding: 18px 20px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 12px;
      background: linear-gradient(180deg, #fffdfd, #fff7f6);
    }
    .panel-head h2 { margin: 0; font-size: 15px; letter-spacing: -.015em; display: flex; align-items: center; gap: 9px; }
    .panel-head h2::before { content: ""; width: 4px; height: 16px; border-radius: 4px; background: linear-gradient(180deg, #e53935, #8e1216); flex: 0 0 auto; }
    .panel-head p { margin: 4px 0 0; color: var(--muted); font-size: 12px; }
    .panel-body { padding: 20px; }

    /* ---------- Tables ---------- */
    .table-wrap { width: 100%; overflow: auto; }
    table { border-collapse: collapse; width: 100%; min-width: 820px; }
    th, td { padding: 11px 16px; border-bottom: 1px solid #f7e9e8; text-align: left; font-size: 12px; vertical-align: middle; white-space: nowrap; font-variant-numeric: tabular-nums; }
    th {
      color: #7f2a2c; font-size: 11.5px; font-weight: 700; letter-spacing: .01em; position: sticky; top: 0; z-index: 1;
      background: linear-gradient(180deg, #fff6f5, #fdeae8); border-bottom: 1px solid var(--line-strong);
    }
    td { color: var(--ink-2); }
    tr:hover td { background: linear-gradient(90deg, #fff1f0, #fffafa); }
    td strong { color: var(--ink); font-size: 12px; }
    tbody tr:last-child td { border-bottom: 0; }

    /* Bảng dữ liệu lớn: cố định chiều cao, cuộn ngang + dọc, tiêu đề và cột chính luôn hiển thị */
    .data-scroll { height: clamp(320px, calc(100vh - 444px), 800px); overflow: auto; overscroll-behavior: contain; background: #fff; }
    .data-scroll.is-empty { display: grid; place-items: center; overflow: hidden; }
    .data-table { border-collapse: separate; border-spacing: 0; width: 100%; min-width: max-content; }
    .data-table tbody tr { --row-bg: #fff; }
    .data-table tbody tr:nth-child(even) { --row-bg: #fffafa; }
    .data-table tbody tr:hover { --row-bg: #fff0ef; }
    .data-table tbody td { background: var(--row-bg); }
    .data-table tbody tr:hover td { background: var(--row-bg); }
    .data-table tbody tr:last-child td { border-bottom: 1px solid #f7e9e8; }
    .data-table thead th { position: sticky; top: 0; z-index: 2; }

    .data-table tr > :nth-child(3) { left: 118px; box-shadow: 1px 0 0 var(--line-strong); }
    .data-table .col-act { right: 0; box-shadow: -1px 0 0 var(--line-strong); }
    .data-table tbody .col-sel, .data-table tbody .col-idx, .data-table tbody tr > :nth-child(3), .data-table tbody .col-act { z-index: 1; }

    .pager {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 22px;
      padding: 12px 20px; border-top: 1px solid var(--line-strong); background: linear-gradient(180deg, #fffafa, #fff4f3);
      font-size: 12px; color: var(--muted);
    }
    .pager b { color: var(--ink); font-weight: 700; font-variant-numeric: tabular-nums; }
    .pager-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; }
    .pager-size, .pager-jump { display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
    .pager-size select, .pager-jump input {
      height: 32px; border: 1px solid var(--line-strong); border-radius: 9px; padding: 0 8px; background: #fff; color: var(--ink);
      font-size: 12px; font-weight: 600; outline: none; transition: .18s;
    }
    .pager-jump input { width: 64px; text-align: center; }
    .pager-size select:focus, .pager-jump input:focus { border-color: #dd5a55; box-shadow: 0 0 0 4px rgba(229, 57, 53, .13); }
    .pager-nav { display: flex; align-items: center; gap: 4px; }
    .pager-btn {
      min-width: 32px; height: 32px; padding: 0 9px; border-radius: 9px; border: 1px solid var(--line-strong); background: linear-gradient(180deg, #fff, #fff8f7);
      color: var(--ink-2); font-size: 12px; font-weight: 650; display: inline-grid; place-items: center; transition: .16s; font-variant-numeric: tabular-nums;
    }
    .pager-btn svg { width: 15px; height: 15px; }
    .pager-btn:hover:not(:disabled):not(.active) { background: var(--g-soft); border-color: #dc8985; color: var(--brand-dark); }
    .pager-btn.active { background: var(--g-brand); color: #fff; border-color: transparent; box-shadow: 0 6px 14px rgba(183, 28, 28, .30); cursor: default; }
    .pager-btn:disabled { opacity: .42; cursor: not-allowed; }
    .pager-gap { min-width: 22px; text-align: center; color: #c98c89; }
    .toolbar-right { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

    /* ---------- License filter tabs (Central User list) ---------- */
    .license-filter-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 12px 20px; border-bottom: 1px solid var(--line); background: #fffdfc; }
    .license-filter-row .lf-label { font-size: 11.5px; font-weight: 700; color: var(--muted); white-space: nowrap; }
    .license-filter-tabs { display: inline-flex; gap: 6px; padding: 4px; background: var(--surface-soft); border: 1px solid var(--line); border-radius: 99px; flex-wrap: wrap; }
    .filter-tab {
      border: 0; background: transparent; color: var(--ink-2); font-size: 12px; font-weight: 650; padding: 7px 14px;
      border-radius: 99px; cursor: pointer; transition: .16s; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px;
    }
    .filter-tab:hover:not(.active) { background: #fff; color: var(--brand-dark); }
    .filter-tab.active { background: var(--g-brand); color: #fff; box-shadow: 0 6px 14px rgba(183, 28, 28, .28); }
    .filter-tab .lf-count { font-variant-numeric: tabular-nums; opacity: .85; font-weight: 700; }
    .filter-tab.active .lf-count { opacity: 1; }

    /* ---------- Badges ---------- */
    .badge { display: inline-flex; align-items: center; border-radius: 99px; padding: 4px 10px; font-size: 10.5px; font-weight: 700; border: 1px solid transparent; }
    .badge-success { background: linear-gradient(135deg, #e9f9f1, #d2f1e2); color: var(--success); border-color: #b6e5cf; }
    .badge-warning { background: linear-gradient(135deg, #fff6e6, #ffe8c2); color: var(--warning); border-color: #f6d7a0; }
    .badge-danger { background: linear-gradient(135deg, #ffeeed, #ffd6d3); color: var(--danger); border-color: #f5b7b3; }
    .badge-blue { background: linear-gradient(135deg, #fff0ef, #fbd3cf); color: var(--brand); border-color: #f2b7b2; }

    /* ---------- Import: progress bar + kết quả ---------- */
    .progress-card { background: linear-gradient(180deg, #fff, #fffafa); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; box-shadow: 0 1px 2px rgba(90, 13, 18, .04); animation: fade-in .18s ease both; }
    .progress-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 10px; }
    .progress-label { font-size: 12.5px; font-weight: 650; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .progress-pct { font-size: 13px; font-weight: 780; color: var(--brand); font-variant-numeric: tabular-nums; flex: 0 0 auto; }
    .progress-track { position: relative; height: 10px; border-radius: 99px; background: #f6e2e1; overflow: hidden; }
    .progress-fill { height: 100%; border-radius: 99px; background: var(--g-brand); transition: width .35s ease; position: relative; overflow: hidden; min-width: 10px; }
    .progress-fill::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .5), transparent); animation: progress-shimmer 1.3s linear infinite; }
    @keyframes progress-shimmer { from { transform: translateX(-100%); } to { transform: translateX(100%); } }
    .progress-sub { margin-top: 9px; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }

    /* ---------- License DMS: thẻ tổng hợp Max / Đã dùng / Còn lại ---------- */
    .license-card { margin-bottom: 18px; --lic-a: #0b7a4f; --lic-b: #0b7a4f; }
    .license-card.license-warn { --lic-a: #d97706; --lic-b: #b45309; }
    .license-card.license-full, .license-card.license-over { --lic-a: #c62828; --lic-b: #a31515; }
    .license-head { padding: 16px 20px 0; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
    .license-head h2 { margin: 0; font-size: 14.5px; letter-spacing: -.015em; display: flex; align-items: center; gap: 9px; }
    .license-head h2::before { content: ""; width: 4px; height: 15px; border-radius: 4px; background: linear-gradient(180deg, var(--lic-a), var(--lic-b)); flex: 0 0 auto; }
    .license-head p { margin: 4px 0 0; color: var(--muted); font-size: 12px; max-width: 480px; }
    .license-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; padding: 16px 20px 4px; }
    .license-stat { text-align: left; }
    .license-num { display: block; font-size: 24px; font-weight: 780; letter-spacing: -.03em; font-variant-numeric: tabular-nums; color: var(--ink); }
    .license-card .license-stat:nth-child(2) .license-num { color: var(--lic-a); }
    .license-lbl { display: block; margin-top: 2px; font-size: 11.5px; color: var(--muted); font-weight: 600; }
    .license-bar { margin: 12px 20px 0; height: 10px; border-radius: 99px; background: #f6e2e1; overflow: hidden; position: relative; }
    .license-fill { height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--lic-a), var(--lic-b)); transition: width .35s ease; }
    .license-sub { padding: 9px 20px 16px; font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .link-btn { border: 0; background: none; padding: 0; color: var(--brand); font-weight: 700; font-size: 11px; cursor: pointer; text-decoration: underline; }
    .link-btn:hover { color: var(--brand-dark); }
    .license-config { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
    .license-config .field { max-width: 220px; }
    .license-config input[type="number"] { -moz-appearance: textfield; }
    .license-preview { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--line-strong); }
    .license-preview .license-stat { min-width: 90px; }
    .result-card { display: flex; gap: 12px; align-items: flex-start; border-radius: 14px; padding: 15px 16px; border: 1px solid; animation: confirm-pop .2s ease both; }
    .result-card.success { background: linear-gradient(135deg, #eafaf1, #dcf4e7); border-color: #b6e5cf; }
    .result-card.error { background: linear-gradient(135deg, #fff1f0, #ffe0dd); border-color: #f5b7b3; }
    .result-icon { flex: 0 0 auto; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: #fff; }
    .result-card.success .result-icon { color: var(--success); box-shadow: 0 4px 12px rgba(11, 122, 79, .20); }
    .result-card.error .result-icon { color: var(--danger); box-shadow: 0 4px 12px rgba(163, 21, 21, .20); }
    .result-icon svg { width: 17px; height: 17px; }
    .result-title { font-size: 13px; font-weight: 760; color: var(--ink); margin-bottom: 3px; }
    .result-detail { font-size: 12px; color: var(--ink-2); line-height: 1.65; }

    /* ---------- Toolbar / inputs ---------- */
    .toolbar { padding: 14px 20px; display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--line); background: linear-gradient(180deg, #fff, #fffafa); }
    .search { width: min(340px, 100%); position: relative; }
    .search input {
      width: 100%; height: 38px; padding: 0 34px 0 36px; border: 1.5px solid var(--line-strong); border-radius: 11px; outline: none;
      color: var(--ink); background: #fff; font-size: 12.5px; font-weight: 500; transition: .2s ease;
      box-shadow: inset 0 1px 2px rgba(90, 13, 18, .03);
    }
    .search input::placeholder { color: #b98f8d; font-weight: 400; }
    .search:hover input { border-color: #dba7a4; }
    .search input:focus, .field input:focus, .field select:focus, .field textarea:focus, .role-select:focus {
      border-color: #dd5a55; box-shadow: 0 0 0 4px rgba(229, 57, 53, .13);
    }
    .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #c98c89; width: 16px; height: 16px; pointer-events: none; transition: color .2s; }
    .search input:focus ~ .search-icon { color: var(--brand); }
    .search svg { display: block; }
    .search-clear {
      position: absolute; right: 6px; top: 50%; transform: translateY(-50%); width: 24px; height: 24px; border-radius: 50%;
      display: none; align-items: center; justify-content: center; border: 0; background: #f6e2e1; color: #a5696a; padding: 0; transition: .15s;
    }
    .search-clear svg { width: 12px; height: 12px; }
    .search-clear:hover { background: var(--brand); color: #fff; }
    .search.has-value .search-clear { display: inline-flex; }
    .search.has-value input { padding-right: 34px; }
    .role-select { border: 1px solid var(--line-strong); border-radius: 8px; padding: 6px 8px; font-size: 11px; background: #fff; color: var(--ink-2); outline: none; }
    .role-select:disabled { background: #faf3f2; color: #a08b8d; cursor: not-allowed; }
    .empty { text-align: center; padding: 44px 20px; color: var(--muted); background: radial-gradient(260px 140px at 50% 0%, rgba(229, 57, 53, .06), transparent 70%); }
    .empty strong { display: block; color: var(--ink); font-size: 14px; margin-bottom: 6px; }
    .two-col { display: grid; grid-template-columns: 1.2fr .8fr; gap: 18px; }
    .two-col .table-wrap table { min-width: 0; }

    /* ---------- Import ---------- */
    .import-drop {
      border: 1.5px dashed #dc9591; border-radius: 16px; padding: 30px; text-align: center; transition: .2s;
      background: linear-gradient(160deg, #fffdfd 0%, #fff1f0 100%);
    }
    .import-drop.drag { border-color: var(--brand); background: linear-gradient(160deg, #ffe6e4 0%, #ffc9c5 100%); box-shadow: 0 0 0 5px rgba(229, 57, 53, .10); }
    .import-drop > svg {
      width: 62px; height: 62px; padding: 16px; border-radius: 20px; color: #fff;
      background: var(--g-brand); box-shadow: 0 12px 26px rgba(183, 28, 28, .32), inset 0 1px 0 rgba(255, 255, 255, .28);
    }
    .import-drop h3 { margin: 14px 0 6px; font-size: 15px; }
    .import-drop p { margin: 0 auto 16px; color: var(--muted); font-size: 12px; max-width: 430px; line-height: 1.6; }
    .table-list { display: grid; gap: 10px; }
    .table-item { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 13px 14px; border: 1px solid var(--line); border-radius: 14px; background: linear-gradient(180deg, #fff, #fffafa); transition: .18s; }
    .table-item b { font-size: 12px; display: block; }
    .table-item span { color: var(--muted); font-size: 11px; display: block; margin-top: 3px; }
    button.table-item { width: 100%; color: inherit; text-align: left; }
    button.table-item:hover { border-color: #e29a96; background: linear-gradient(90deg, #fff1f0, #fff); box-shadow: 0 8px 22px rgba(183, 28, 28, .10); }
    .table-item .go {
      margin: 0; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; flex: 0 0 auto;
      background: var(--g-brand); color: #fff; font-size: 14px; box-shadow: 0 5px 12px rgba(183, 28, 28, .28);
    }

    /* ---------- Modal ---------- */
    .modal-backdrop { position: fixed; inset: 0; background: rgba(38, 7, 10, .62); backdrop-filter: blur(5px); display: grid; place-items: center; padding: 20px; z-index: 50; }
    .modal-backdrop.confirm-backdrop { z-index: 60; animation: fade-in .15s ease both; }
    @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }

    /* ---------- Confirm dialog (thay browser confirm() mặc định) ---------- */
    .confirm-modal { width: min(400px, 100%); padding: 30px 28px 26px; text-align: center; animation: confirm-pop .22s var(--ease, cubic-bezier(.22, 1, .36, 1)) both; }
    @keyframes confirm-pop { from { opacity: 0; transform: translateY(10px) scale(.96); } to { opacity: 1; transform: none; } }
    .confirm-icon { width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center; margin: 0 auto 16px; }
    .confirm-icon svg { width: 24px; height: 24px; }
    .confirm-icon.danger { background: linear-gradient(135deg, #ffe4e2, #ffc9c5); color: var(--danger); box-shadow: 0 10px 24px rgba(163, 21, 21, .20); }
    .confirm-icon.info { background: var(--g-soft); color: var(--brand); box-shadow: 0 10px 24px rgba(183, 28, 28, .16); }
    .confirm-title { margin: 0 0 9px; font-size: 16.5px; font-weight: 760; color: var(--ink); letter-spacing: -.01em; }
    .confirm-msg { margin: 0 0 24px; font-size: 12.5px; color: var(--muted); line-height: 1.65; }
    .confirm-actions { display: flex; gap: 10px; }
    .confirm-actions .btn { flex: 1; padding: 11px 14px; }
    .btn-outline-danger { background: #fff; border-color: var(--line-strong); color: var(--danger); }
    .btn-outline-danger:hover { background: linear-gradient(135deg, #a31515, #6b0d10); color: #fff; border-color: transparent; box-shadow: 0 8px 18px rgba(163, 21, 21, .28); }
    .modal { background: #fff; border-radius: 22px; width: min(630px, 100%); max-height: min(800px, 92vh); overflow: auto; box-shadow: 0 30px 90px rgba(60, 8, 12, .40); }
    .modal-head { padding: 22px 22px 18px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; position: relative; background: linear-gradient(180deg, #fff4f3, #fff); }
    .modal-head::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 5px; background: linear-gradient(90deg, #e53935, #b71c1c 55%, #5e0c12); }
    .modal-head h2 { margin: 0; font-size: 17px; }
    .modal-head p { margin: 5px 0 0; color: var(--muted); font-size: 12px; }
    .modal-body { padding: 21px 22px; }
    .modal-foot { padding: 14px 22px 20px; display: flex; justify-content: flex-end; gap: 9px; background: linear-gradient(180deg, #fff, #fff8f7); border-top: 1px solid var(--line); }
    .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
    .field { display: grid; gap: 6px; }
    .field.full { grid-column: 1 / -1; }
    .field label { font-size: 11.5px; color: var(--ink-2); font-weight: 650; }
    .field input, .field select, .field textarea { width: 100%; border: 1px solid var(--line-strong); border-radius: 10px; padding: 10px 11px; outline: none; color: var(--ink); font-size: 12px; background: #fff; transition: .18s; }
    .field textarea { min-height: 82px; resize: vertical; }

    /* ---------- Toast ---------- */
    .toast-wrap { position: fixed; right: 22px; bottom: 22px; z-index: 100; display: grid; gap: 10px; width: min(380px, calc(100vw - 44px)); }
    .toast {
      position: relative; overflow: hidden; display: flex; align-items: flex-start; gap: 10px;
      background: linear-gradient(135deg, #3f2124, #1f0f11); color: #fff; border-radius: 14px; padding: 13px 14px 15px 13px; font-size: 12.5px;
      line-height: 1.45; box-shadow: 0 12px 30px rgba(20, 4, 6, .32), 0 2px 6px rgba(20, 4, 6, .18);
      border: 1px solid rgba(255, 255, 255, .08); animation: toast-in .28s var(--ease, cubic-bezier(.22, 1, .36, 1)) both;
    }
    .toast.leaving { animation: toast-out .2s ease both; }
    .toast.error { background: linear-gradient(135deg, #b3181d, #6b0d10); }
    .toast.success { background: linear-gradient(135deg, #10935f, #075d3b); }
    .toast-icon {
      flex: 0 0 auto; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center;
      background: rgba(255, 255, 255, .16); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .12);
    }
    .toast-icon svg { width: 14px; height: 14px; }
    .toast.success .toast-icon { color: #a7f3d0; }
    .toast.error .toast-icon { color: #ffb4ac; }
    .toast:not(.success):not(.error) .toast-icon { color: var(--gold); }
    .toast-msg { flex: 1; padding-top: 4px; word-break: break-word; }
    .toast-close {
      flex: 0 0 auto; width: 20px; height: 20px; border-radius: 50%; border: 0; background: transparent; color: rgba(255, 255, 255, .6);
      display: grid; place-items: center; padding: 0; transition: .15s;
    }
    .toast-close svg { width: 11px; height: 11px; }
    .toast-close:hover { background: rgba(255, 255, 255, .18); color: #fff; }
    .toast-bar { position: absolute; left: 0; bottom: 0; height: 3px; background: rgba(255, 255, 255, .55); width: 100%; transform-origin: left; animation: toast-shrink 4.2s linear forwards; }
    .toast.success .toast-bar { background: #a7f3d0; }
    .toast.error .toast-bar { background: #ffb4ac; }
    .toast:not(.success):not(.error) .toast-bar { background: var(--gold); }
    @keyframes toast-in { from { opacity: 0; transform: translateX(26px) scale(.98); } to { opacity: 1; transform: none; } }
    @keyframes toast-out { from { opacity: 1; transform: none; } to { opacity: 0; transform: translateX(20px) scale(.97); } }
    @keyframes toast-shrink { from { transform: scaleX(1); } to { transform: scaleX(0); } }

    .loading { display: inline-flex; align-items: center; gap: 9px; color: var(--muted); font-size: 13px; }
    .spinner { width: 16px; height: 16px; border: 2px solid #f0cfcc; border-top-color: var(--brand); border-radius: 50%; animation: spin .7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .mobile-menu { display: none; border: 1px solid var(--line-strong); background: var(--g-soft); color: var(--brand); padding: 7px; border-radius: 11px; }
    .mobile-menu svg { width: 20px; height: 20px; }

    /* ---------- Responsive ---------- */
    @media (max-width: 1050px) { .grid-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } .two-col { grid-template-columns: 1fr; } }
    @media (max-width: 760px) {
      :root { --sidebar: 0px; }
      .sidebar { transform: translateX(-100%); transition: transform .2s; width: 262px; }
      .sidebar.open { transform: translateX(0); box-shadow: 14px 0 44px rgba(30, 4, 7, .35); }
      .mobile-menu { display: inline-grid; place-items: center; }
      .topbar { padding: 0 14px; height: 64px; }
      .topbar-icon { width: 32px; height: 32px; border-radius: 10px; }
      .topbar-icon svg { width: 15px; height: 15px; }
      .topbar h1 { font-size: 17px; }
      .topbar p { display: none; }
      .topbar-right { gap: 10px; }
      .conn-badge span:not(.conn-dot) { display: none; }
      .conn-badge { padding: 8px; }
      .page { margin: 12px 10px 24px; padding: 14px 12px 22px; border-radius: 22px; }
      .header-row { align-items: flex-start; flex-direction: column; margin-bottom: 16px; padding: 20px 18px; border-radius: 18px; }
      .header-row.hero { padding: 24px 20px; align-items: flex-start; border-radius: 20px; }
      .data-scroll { height: clamp(300px, calc(100vh - 440px), 640px); }
      .pager { padding: 12px 14px; }
      /* Màn hình nhỏ: chỉ giữ dính cột UserName để còn chỗ xem dữ liệu */
      .data-table .col-idx { display: none; }
      .data-table tr > :nth-child(3) { left: 42px; }
      .data-table .col-act { position: static; box-shadow: none; }
      .page-title { font-size: 25px; }
      .grid-stats { gap: 10px; }
      .stat-card { padding: 16px 14px 14px; }
      .stat-value { font-size: 23px; }
      .panel-head, .panel-body { padding: 15px; }
      .toolbar { padding: 12px 15px; }
      .form-grid { grid-template-columns: 1fr; }
      .field.full { grid-column: auto; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }

    /* =====================================================================
       Auth screens — đăng nhập / chờ duyệt / loading
       Một lớp nền "aurora" cố định nằm ngoài #root nên khi chuyển giữa các màn hình
       nền không bị chạy lại, chỉ phần nội dung chuyển cảnh.
       ===================================================================== */
    :root { --ease: cubic-bezier(.22, 1, .36, 1); --ease-io: cubic-bezier(.65, 0, .35, 1); }
    #root { position: relative; z-index: 1; }
    body.auth { background: #36070b; }

    .aurora {
      position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none;
      background: linear-gradient(140deg, #c62828 0%, #8e1216 46%, #36070b 100%);
      opacity: 0; visibility: hidden; transition: opacity .5s ease, visibility 0s .5s;
    }
    body.auth .aurora { opacity: 1; visibility: visible; transition: opacity .5s ease; }
    .aurora .blob { position: absolute; border-radius: 50%; will-change: transform; }
    .aurora .b1 { width: 62vmax; height: 62vmax; left: -20vmax; top: -26vmax; background: radial-gradient(circle, rgba(255, 122, 107, .62), transparent 62%); animation: drift-a 22s ease-in-out infinite alternate; }
    .aurora .b2 { width: 58vmax; height: 58vmax; right: -22vmax; bottom: -28vmax; background: radial-gradient(circle, rgba(240, 84, 72, .52), transparent 62%); animation: drift-b 27s ease-in-out infinite alternate; }
    .aurora .b3 { width: 34vmax; height: 34vmax; left: 34%; top: 26%; background: radial-gradient(circle, rgba(255, 168, 120, .26), transparent 66%); animation: drift-c 31s ease-in-out infinite alternate; }
    .aurora .grid {
      position: absolute; inset: 0;
      background-image: linear-gradient(rgba(255, 255, 255, .055) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, .055) 1px, transparent 1px);
      background-size: 46px 46px;
      -webkit-mask-image: radial-gradient(ellipse at 50% 45%, #000 0%, transparent 72%); mask-image: radial-gradient(ellipse at 50% 45%, #000 0%, transparent 72%);
    }
    @keyframes drift-a { to { transform: translate3d(16vmax, 12vmax, 0) scale(1.14); } }
    @keyframes drift-b { to { transform: translate3d(-14vmax, -10vmax, 0) scale(1.1); } }
    @keyframes drift-c { to { transform: translate3d(-12vmax, 10vmax, 0) scale(1.25); } }

    /* Trình tự xuất hiện: chỉ chạy một lần khi vào màn hình (class is-entering) */
    .is-entering .rv { animation: rise .8s var(--ease) backwards; animation-delay: calc(var(--d, 0) * 1ms); }
    @keyframes rise { from { opacity: 0; transform: translateY(18px); } }
    @keyframes panel-in { from { opacity: 0; transform: translateX(56px); } }
    @keyframes panel-in-up { from { opacity: 0; transform: translateY(48px); } }
    @keyframes card-in { from { opacity: 0; transform: translateY(30px) scale(.95); } }
    @keyframes row-in { from { opacity: 0; transform: translateX(-16px); } }
    @keyframes chip-in { from { opacity: 0; transform: scale(.7) translateY(10px); } }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    @keyframes pop-in { from { opacity: 0; transform: scale(.94); } }
    @keyframes draw { to { stroke-dashoffset: 0; } }

    /* ---------- Đăng nhập: chia đôi ---------- */
    .auth-split {
      /* Cụm nội dung nằm giữa màn hình: cột trái (giới thiệu) + thẻ đăng nhập nổi bên phải */
      min-height: 100vh; display: grid; align-items: center; justify-content: center;
      grid-template-columns: minmax(0, 500px) minmax(0, clamp(400px, 38vw, 440px));
      column-gap: clamp(48px, 6vw, 96px);
      width: min(1120px, calc(100% - 2 * clamp(24px, 5vw, 72px))); margin: 0 auto; padding: 48px 0;
    }
    .auth-showcase { position: relative; display: flex; flex-direction: column; gap: 28px; color: #fff; }
    .auth-brand { display: none; align-items: center; gap: 12px; }
    .auth-brand strong { font-size: 16px; letter-spacing: -.02em; }
    .auth-brand small { display: block; color: rgba(255, 225, 222, .74); font-size: 11px; margin-top: 3px; }
    .auth-stage { display: grid; gap: 40px; }
    .showcase-copy { max-width: 100%; }
    .showcase-copy h2 { margin: 0; font-size: clamp(28px, 2.9vw, 42px); line-height: 1.14; letter-spacing: -.04em; font-weight: 750; text-wrap: balance; }
    .showcase-copy p { margin: 16px 0 0; font-size: 15px; line-height: 1.7; color: rgba(255, 232, 229, .84); max-width: 440px; }

    .preview-wrap { position: relative; width: min(470px, 100%); }
    .preview {
      border-radius: 24px; padding: 18px 16px 10px;
      background: linear-gradient(160deg, rgba(255, 255, 255, .21), rgba(255, 255, 255, .07));
      border: 1px solid rgba(255, 255, 255, .26); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
      box-shadow: 0 32px 74px rgba(20, 2, 5, .42), inset 0 1px 0 rgba(255, 255, 255, .36);
    }
    .pv-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 0 6px 12px; font-size: 13px; font-weight: 650; }
    .pv-search { width: 118px; height: 26px; border-radius: 99px; background: rgba(255, 255, 255, .13); border: 1px solid rgba(255, 255, 255, .2); }
    .pv-rows { position: relative; }
    .pv-row { display: flex; align-items: center; gap: 12px; height: 52px; padding: 0 10px; border-radius: 13px; position: relative; }
    .pv-row + .pv-row::before { content: ""; position: absolute; left: 10px; right: 10px; top: 0; height: 1px; background: rgba(255, 255, 255, .11); }
    .pv-ava { width: 30px; height: 30px; border-radius: 50%; flex: none; background: linear-gradient(135deg, var(--h1), var(--h2)); box-shadow: 0 0 0 2px rgba(255, 255, 255, .22); }
    .pv-lines { flex: 1; display: grid; gap: 6px; }
    .pv-lines i { display: block; height: 7px; border-radius: 99px; background: rgba(255, 255, 255, .36); }
    .pv-lines i:last-child { height: 6px; width: 52%; background: rgba(255, 255, 255, .17); }
    .pv-role { font-size: 10.5px; font-weight: 650; padding: 4px 10px; border-radius: 99px; background: rgba(255, 255, 255, .15); border: 1px solid rgba(255, 255, 255, .24); }
    .pv-scan {
      position: absolute; left: 0; right: 0; top: 0; height: 52px; border-radius: 13px; pointer-events: none; opacity: 0;
      background: linear-gradient(90deg, rgba(255, 255, 255, .26), rgba(255, 255, 255, .05));
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .3);
      animation: scan 9s var(--ease-io) 2.4s infinite both;
    }
    @keyframes scan {
      0% { transform: translateY(0); opacity: 0; }
      5%, 12% { transform: translateY(0); opacity: 1; }
      18%, 30% { transform: translateY(52px); }
      36%, 48% { transform: translateY(104px); }
      54%, 66% { transform: translateY(156px); }
      72%, 84% { transform: translateY(208px); opacity: 1; }
      100% { transform: translateY(208px); opacity: 0; }
    }
    .pv-chip {
      position: absolute; display: flex; align-items: center; gap: 9px; padding: 9px 14px 9px 10px; border-radius: 15px; white-space: nowrap;
      font-size: 12px; font-weight: 650; color: var(--ink); background: rgba(255, 255, 255, .97); box-shadow: 0 18px 38px rgba(20, 2, 5, .36);
      animation: float 6.5s ease-in-out infinite;
    }
    .pv-chip.c1 { right: -20px; top: -22px; }
    .pv-chip.c2 { left: 34px; bottom: -32px; animation-duration: 7.5s; animation-delay: -2.5s; }
    .chip-ico { width: 24px; height: 24px; border-radius: 8px; display: grid; place-items: center; color: #fff; background: var(--g-brand); box-shadow: 0 4px 10px rgba(183, 28, 28, .3); }
    .chip-ico svg { width: 13px; height: 13px; }
    .is-entering .preview { animation: card-in .95s var(--ease) .5s backwards; }
    .is-entering .pv-row { animation: row-in .65s var(--ease) backwards; animation-delay: calc(.95s + var(--i) * 90ms); }
    .is-entering .pv-chip.c1 { animation: chip-in .7s var(--ease) 1.5s backwards, float 6.5s ease-in-out 2.2s infinite; }
    .is-entering .pv-chip.c2 { animation: chip-in .7s var(--ease) 1.7s backwards, float 7.5s ease-in-out 2.4s infinite; }

    .auth-form-side {
      position: relative; overflow: hidden; padding: 28px 34px 34px;
      background: radial-gradient(420px 320px at 100% 0%, rgba(229, 57, 53, .10), transparent 70%), linear-gradient(180deg, #fff 0%, #fff8f7 100%);
      border-radius: 28px; border: 1px solid rgba(255, 255, 255, .75);
      box-shadow: 0 44px 96px rgba(20, 2, 5, .46), 0 0 0 6px rgba(255, 255, 255, .08);
    }
    .card-brand { display: flex; align-items: center; gap: 12px; padding-bottom: 20px; margin-bottom: 24px; border-bottom: 1px solid var(--line); }
    .card-brand strong { display: block; font-size: 15px; letter-spacing: -.02em; color: var(--ink); }
    .card-brand small { display: block; font-size: 11.5px; color: var(--muted); margin-top: 2px; }
    .card-badge { margin-left: auto; display: inline-flex; align-items: center; gap: 5px; padding: 5px 10px; border-radius: 99px; font-size: 11px; font-weight: 650; color: var(--brand); background: var(--g-soft); border: 1px solid var(--brand-soft-2); white-space: nowrap; }
    .card-badge svg { width: 12px; height: 12px; }
    .is-entering .auth-form-side { animation: panel-in .95s var(--ease) backwards; }
    .auth-form { width: 100%; margin: 0; }
    .auth-form h1 {
      margin: 0; font-size: 31px; line-height: 1.15; letter-spacing: -.04em; font-weight: 750; width: fit-content; max-width: 100%;
      background: var(--g-text); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent;
    }
    .auth-form > p { color: var(--muted); line-height: 1.7; font-size: 13.5px; margin: 12px 0 28px; }

    .google-btn {
      position: relative; overflow: hidden; width: 100%; display: flex; align-items: center; justify-content: center; gap: 12px;
      border: 0; border-radius: 15px; padding: 13px 18px; color: #fff; font-weight: 700; font-size: 14.5px; cursor: pointer;
      background: var(--g-brand);
      box-shadow: 0 14px 30px rgba(183, 28, 28, .34), inset 0 1px 0 rgba(255, 255, 255, .26);
      transition: transform .3s var(--ease), box-shadow .3s var(--ease), background .3s;
    }
    .google-btn::after {
      content: ""; position: absolute; inset: 0; pointer-events: none; transform: translateX(-120%);
      background: linear-gradient(105deg, transparent 35%, rgba(255, 255, 255, .34) 50%, transparent 65%);
    }
    .google-btn:hover:not(:disabled) { background: var(--g-brand-hover); transform: translateY(-2px); box-shadow: 0 22px 40px rgba(183, 28, 28, .42), inset 0 1px 0 rgba(255, 255, 255, .3); }
    .google-btn:hover:not(:disabled)::after { transform: translateX(120%); transition: transform .85s var(--ease); }
    .google-btn:active:not(:disabled) { transform: translateY(0) scale(.985); box-shadow: 0 8px 18px rgba(183, 28, 28, .3); }
    .google-btn:disabled { cursor: progress; }
    .g-chip { position: relative; width: 30px; height: 30px; border-radius: 50%; background: #fff; display: grid; place-items: center; box-shadow: 0 3px 8px rgba(60, 8, 12, .28); }
    .google-icon { width: 18px; height: 18px; transition: transform .35s var(--ease), opacity .2s; }
    .google-btn:hover:not(:disabled) .google-icon { transform: scale(1.12); }
    .g-spin { position: absolute; width: 16px; height: 16px; border-radius: 50%; border: 2px solid #f0cfcc; border-top-color: var(--brand); animation: spin .7s linear infinite; opacity: 0; transition: opacity .2s; }
    .google-btn.is-loading .google-icon { opacity: 0; transform: scale(.5); }
    .google-btn.is-loading .g-spin { opacity: 1; }

    .flow { margin-top: 30px; padding-top: 22px; border-top: 1px solid var(--line); }
    .flow-title { font-size: 12.5px; font-weight: 650; color: var(--ink-2); margin-bottom: 16px; }
    .flow-list { list-style: none; margin: 0; padding: 0; }
    .flow-item { position: relative; display: flex; gap: 14px; padding-bottom: 18px; }
    .flow-item:last-child { padding-bottom: 0; }
    .flow-item:not(:last-child)::before { content: ""; position: absolute; left: 13px; top: 30px; bottom: 2px; width: 2px; border-radius: 2px; background: linear-gradient(180deg, var(--brand-soft-2), rgba(251, 213, 210, .2)); }
    .flow-num { position: relative; z-index: 1; width: 28px; height: 28px; border-radius: 50%; flex: none; display: grid; place-items: center; font-style: normal; font-size: 12px; font-weight: 700; color: var(--brand); background: var(--g-soft); border: 1px solid var(--brand-soft-2); }
    .flow-item b { display: block; font-size: 12.5px; color: var(--ink); line-height: 28px; }
    .flow-item small { display: block; font-size: 12px; color: var(--muted); line-height: 1.55; margin-top: -3px; }

    /* ---------- Chờ duyệt / loading ---------- */
    .auth-center { min-height: 100vh; display: grid; place-items: center; padding: 28px 20px; }
    .pending-card {
      position: relative; overflow: hidden; width: min(480px, 100%); text-align: center; padding: 42px 36px 30px; border-radius: 30px;
      background: linear-gradient(180deg, #fff 0%, #fff8f7 100%);
      box-shadow: 0 44px 110px rgba(20, 2, 5, .52), 0 0 0 1px rgba(255, 255, 255, .5);
    }
    .pending-card::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 6px; background: linear-gradient(90deg, #ff7a6b, #e53935 35%, #b71c1c 65%, #5e0c12); }
    .is-entering .pending-card { animation: card-in .9s var(--ease) backwards; }

    .status-orb { position: relative; width: 86px; height: 86px; margin: 0 auto 22px; display: grid; place-items: center; }
    .status-orb::before, .status-orb::after { content: ""; position: absolute; inset: 7px; border-radius: 50%; border: 2px solid rgba(245, 158, 11, .55); animation: ring 2.8s ease-out infinite; }
    .status-orb::after { animation-delay: 1.4s; }
    @keyframes ring { from { transform: scale(.9); opacity: .9; } to { transform: scale(1.5); opacity: 0; } }
    .status-orb .core {
      position: relative; z-index: 1; width: 72px; height: 72px; border-radius: 50%; display: grid; place-items: center; color: #8a4b05;
      background: linear-gradient(135deg, #ffe4ae, #ffb04a);
      box-shadow: 0 16px 34px rgba(217, 119, 6, .36), inset 0 1px 0 rgba(255, 255, 255, .65);
    }
    .status-orb svg { width: 34px; height: 34px; }
    .status-orb.is-rejected::before, .status-orb.is-rejected::after { display: none; }
    .status-orb.is-rejected .core { color: #8e1216; background: linear-gradient(135deg, #ffd3cf, #ff8f88); box-shadow: 0 16px 34px rgba(183, 28, 28, .32), inset 0 1px 0 rgba(255, 255, 255, .6); }
    .hand-h, .hand-m { transform-box: view-box; transform-origin: 12px 12px; animation: spin 24s linear infinite; }
    .hand-m { animation-duration: 3s; }
    .pending-card h2 { margin: 0; font-size: 22px; letter-spacing: -.03em; font-weight: 750; }
    .pending-card > p, .pending-card .rv > p { color: var(--muted); font-size: 13.5px; line-height: 1.7; margin: 10px auto 0; max-width: 380px; }

    .steps { list-style: none; margin: 28px 0 22px; padding: 0; display: grid; grid-template-columns: repeat(3, 1fr); }
    .step { position: relative; display: grid; justify-items: center; align-content: start; gap: 10px; padding: 0 4px; font-size: 11.5px; font-weight: 600; line-height: 1.35; color: var(--muted); }
    .step .dot {
      position: relative; z-index: 1; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-style: normal; font-size: 12px; font-weight: 700;
      color: #b69a9c; background: #fff; border: 2px solid var(--line-strong);
    }
    .step:not(:last-child)::after {
      content: ""; position: absolute; top: 14px; left: calc(50% + 21px); width: calc(100% - 42px); height: 2px; border-radius: 2px;
      background-image: linear-gradient(90deg, var(--line-strong) 6px, transparent 6px); background-size: 11px 2px;
    }
    .step.done { color: #0b7a4f; }
    .step.done .dot { color: #fff; border-color: transparent; background: linear-gradient(135deg, #17b978, #0a7048); box-shadow: 0 6px 14px rgba(11, 122, 79, .3); }
    .step.done .dot svg { width: 15px; height: 15px; stroke-width: 2.6; }
    .step.done::after { background-image: none; background: linear-gradient(90deg, #17b978, #e53935); transform-origin: left; }
    .is-entering .step.done::after { animation: line-fill .9s var(--ease) .8s backwards; }
    @keyframes line-fill { from { transform: scaleX(0); } }
    .step.current { color: var(--brand); font-weight: 700; }
    .step.current .dot { border-color: var(--brand-light); }
    .step.current::after { animation: march 1.1s linear infinite; }
    @keyframes march { to { background-position-x: 11px; } }
    .pulse { width: 10px; height: 10px; border-radius: 50%; background: var(--g-brand); animation: pulse 1.9s ease-out infinite; }
    @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(229, 57, 53, .55); } 75%, 100% { box-shadow: 0 0 0 10px rgba(229, 57, 53, 0); } }
    .step.fail { color: var(--danger); font-weight: 700; }
    .step.fail .dot { color: #fff; border-color: transparent; background: linear-gradient(135deg, #e53935, #8e1216); box-shadow: 0 6px 14px rgba(183, 28, 28, .3); }
    .step.fail .dot svg { width: 14px; height: 14px; stroke-width: 2.6; }

    .account { display: flex; align-items: center; gap: 12px; text-align: left; padding: 12px 14px; border-radius: 16px; background: linear-gradient(100deg, #fff1f0, #fff8f7); border: 1px solid var(--brand-soft-2); }
    .account .avatar { width: 38px; height: 38px; font-size: 13px; }
    .account-info { flex: 1; min-width: 0; }
    .account-info b { display: block; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .account-info small { display: block; margin-top: 2px; color: var(--muted); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .live { display: flex; align-items: center; justify-content: center; gap: 9px; margin: 16px 0 20px; font-size: 12px; color: var(--muted); }
    .live i { width: 8px; height: 8px; border-radius: 50%; background: #10a06a; animation: live 1.9s ease-out infinite; }
    @keyframes live { 0% { box-shadow: 0 0 0 0 rgba(16, 160, 106, .55); } 75%, 100% { box-shadow: 0 0 0 8px rgba(16, 160, 106, 0); } }
    .pending-actions { display: grid; gap: 10px; }
    .pending-card .account + .pending-actions { margin-top: 18px; }

    .loading-card { display: inline-flex; align-items: center; gap: 12px; padding: 16px 24px; border-radius: 18px; background: rgba(255, 255, 255, .97); color: var(--ink-2); font-size: 13px; font-weight: 600; box-shadow: 0 30px 70px rgba(20, 2, 5, .45); animation: fade-in .35s ease both; }

    /* ---------- Button system ---------- */
    .btn-primary { position: relative; overflow: hidden; }
    .btn-primary::after { content: ""; position: absolute; inset: 0; pointer-events: none; transform: translateX(-120%); background: linear-gradient(105deg, transparent 35%, rgba(255, 255, 255, .3) 50%, transparent 65%); }
    .btn-primary:hover:not(:disabled)::after { transform: translateX(120%); transition: transform .8s var(--ease); }
    .btn { transition: transform .25s var(--ease), box-shadow .25s var(--ease), background .25s, border-color .25s, color .25s; }
    .btn:active:not(:disabled) { transform: translateY(0) scale(.985); }
    .btn-lg { padding: 14px 20px; font-size: 14px; border-radius: 15px; }
    .btn-lg svg { width: 18px; height: 18px; }
    .btn-block { width: 100%; }
    .btn-success { color: #fff; background: linear-gradient(135deg, #17b978 0%, #0b8a58 55%, #086b45 100%); box-shadow: 0 12px 26px rgba(11, 122, 79, .32), inset 0 1px 0 rgba(255, 255, 255, .25); }
    .btn-success:disabled { opacity: 1; cursor: default; }
    .btn.is-sent { animation: pop-in .45s var(--ease); }
    .btn.is-sent svg { stroke-width: 2.4; }
    .btn.is-sent svg path { stroke-dasharray: 26; stroke-dashoffset: 26; animation: draw .5s ease .15s forwards; }
    #send-request-btn svg { transition: transform .3s var(--ease); }
    #send-request-btn:hover:not(:disabled) svg { transform: translate(2px, -2px); }
    #logout-pending svg { transition: transform .3s var(--ease); }
    #logout-pending:hover svg { transform: translateX(3px); }

    /* Màn hình vừa (laptop nhỏ / tablet ngang): bỏ phần minh hoạ, giữ thẻ đăng nhập thoáng */
    @media (min-width: 961px) and (max-width: 1180px) {
      .auth-split { grid-template-columns: minmax(0, 400px) minmax(0, 420px); }
      .preview-wrap, .card-badge { display: none; }
      .auth-form h1 { font-size: 27px; }
      .card-brand strong { white-space: nowrap; }
    }

    /* ---------- Auth: responsive ---------- */
    @media (max-width: 960px) {
      .auth-split { width: 100%; padding: 0; margin: 0; grid-template-columns: 1fr; grid-template-rows: auto 1fr; column-gap: 0; align-items: stretch; }
      .auth-showcase { padding: 30px 26px 56px; gap: 22px; }
      .auth-brand { display: flex; }
      .card-brand { display: none; }
      .showcase-copy h2 { font-size: 26px; }
      .auth-form h1 { font-size: 26px; }
      .showcase-copy p, .preview-wrap { display: none; }
      .auth-form-side { border: 0; border-radius: 30px 30px 0 0; margin-top: -30px; padding: 36px 26px 40px; box-shadow: 0 -22px 60px rgba(20, 2, 5, .32); }
      .is-entering .auth-form-side { animation-name: panel-in-up; }
    }
    @media (max-width: 480px) {
      .pending-card { padding: 36px 22px 24px; border-radius: 26px; }
      .step { font-size: 11px; }
    }

    /* ---------- Công Cụ Hỗ Trợ ---------- */
    .tl-seg { display: inline-flex; flex-wrap: wrap; gap: 4px; padding: 4px; margin-bottom: 18px; background: #fff; border: 1px solid var(--line-strong); border-radius: 14px; box-shadow: var(--shadow-card); }
    .tl-seg button { border: 0; background: transparent; color: var(--ink-2); font-weight: 600; font-size: 13px; padding: 9px 16px; border-radius: 10px; display: flex; align-items: center; gap: 8px; }
    .tl-seg button svg { width: 16px; height: 16px; }

    .tl-panel { margin-bottom: 18px; }
    .tl-check { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--ink-2); cursor: pointer; }

    .tl-table { border-collapse: collapse; width: 100%; min-width: max-content; font-size: 12px; }

    .tl-idx { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; background: var(--g-brand); color: #fff; font-weight: 700; font-size: 12px; flex: 0 0 auto; }

    .tl-msg.err { background: var(--danger-soft); color: var(--danger); }
    .tl-msg.warn { background: var(--warning-soft); color: var(--warning); }
    .tl-msg.ok { background: var(--success-soft); color: var(--success); }
    .tl-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }

    @media (max-width: 900px) { .tl-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 600px) { .tl-grid { grid-template-columns: 1fr; } }

    /* ---------- Cập Nhật Thông Tin: đánh dấu trường / ô dữ liệu đã thay đổi ---------- */

    .field.changed label { color: var(--brand); display: inline-flex; align-items: center; gap: 6px; }
    .chg-dot { width: 7px; height: 7px; border-radius: 99px; background: var(--gold); box-shadow: 0 0 0 2px rgba(255, 200, 87, .35); display: inline-block; }
    .tl-prev tr.r-old td.chg { background: #ffdb8a; color: #6b4b00; font-weight: 700; }
    .tl-prev tr.r-new td.chg { background: #ffdb8a; color: #6b4b00; font-weight: 700; box-shadow: inset 0 0 0 1px #f2c94c; }
    .upd-legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 11.5px; color: var(--muted); margin-bottom: 12px; }
    .upd-legend span { display: inline-flex; align-items: center; gap: 6px; }
    .upd-legend i { width: 12px; height: 12px; border-radius: 4px; display: inline-block; }
    .upd-legend .lg-old { background: #e6e6e6; }
    .upd-legend .lg-new { background: #d8f0cf; }
    .upd-legend .lg-chg { background: #ffdb8a; }
    /* ---------- Sắp xếp theo cột (DMS / Central) ---------- */
    .data-table th.sortable { cursor: pointer; user-select: none; transition: color .15s; }
    .data-table th.sortable:hover { color: var(--brand); }
    .data-table th .sort-ind { display: inline-block; margin-left: 6px; font-size: 9px; opacity: .35; transition: opacity .15s; }
    .data-table th.sortable:hover .sort-ind { opacity: .7; }
    .data-table th.sorted { color: var(--brand); }
    .data-table th.sorted .sort-ind { opacity: 1; }
    /* ---------- Chọn nhiều dòng + thao tác hàng loạt ---------- */
    .bulk-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: linear-gradient(180deg, #fff6f5, #fff); font-size: 12px; }
    .bulk-check { display: inline-flex; align-items: center; gap: 7px; cursor: pointer; color: var(--ink-2); font-weight: 600; }
    .bulk-count { color: var(--brand); font-weight: 700; }
    .bulk-count b { font-variant-numeric: tabular-nums; }
    .bulk-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-left: auto; }
    .bulk-actions .btn { padding: 7px 12px; font-size: 12px; }
    .data-table .col-sel { width: 42px; min-width: 42px; max-width: 42px; text-align: center; }
    .data-table .col-sel input { width: 16px; height: 16px; accent-color: var(--brand); cursor: pointer; }

    morph-icon { display: contents; }
    morph-icon > svg { width: 1em; height: 1em; flex: 0 0 auto; overflow: visible; }
    .search-icon svg { width: 16px; height: 16px; }
    .badge svg { width: 12px; height: 12px; margin-right: 5px; }
    .data-table th .sort-ind { display: inline-flex; vertical-align: -2px; font-size: inherit; }
    .sort-ind svg { width: 12px; height: 12px; display: block; }
    .import-drop > morph-icon > svg {
      width: 62px; height: 62px; padding: 16px; border-radius: 20px; color: #fff;
      background: var(--g-brand); box-shadow: 0 12px 26px rgba(183, 28, 28, .32), inset 0 1px 0 rgba(255, 255, 255, .28);
      transition: transform .45s var(--ease);
    }
    .import-drop { transition: border-color .25s, background .3s, box-shadow .3s; }
    .import-drop.drag > morph-icon > svg { transform: translateY(3px) scale(1.07); }
    .table-item .go svg { width: 15px; height: 15px; }
    .table-item .go { transition: transform .35s var(--ease), box-shadow .35s var(--ease); }
    button.table-item { transition: transform .35s var(--ease), border-color .25s, background .25s, box-shadow .35s var(--ease); }
    button.table-item:hover { transform: translateY(-2px); }
    button.table-item:hover .go { transform: translateX(3px); box-shadow: 0 8px 18px rgba(183, 28, 28, .36); }

    body:not(.auth) .aurora .blob { animation: none; }

    .nav { position: relative; }
    .nav-indicator {
      position: absolute; left: 0; right: 0; top: 0; height: 42px; border-radius: 12px; pointer-events: none; opacity: 0;
      background: linear-gradient(100deg, #e53935 0%, #b71c1c 70%, #94141a 100%);
      box-shadow: inset 3px 0 0 var(--gold), 0 8px 20px rgba(0, 0, 0, .28);
      transition: transform .55s var(--ease), height .35s var(--ease), opacity .3s; will-change: transform;
    }
    .nav button { position: relative; z-index: 1; transition: color .2s, background-color .2s, transform .35s var(--ease); }
    .nav button:not(.active):hover { transform: translateX(3px); }
    .nav.has-indicator button.active, .nav.has-indicator button.active:hover { background: transparent; box-shadow: none; }
    .nav button svg { transition: transform .4s var(--ease); }
    .nav button.active svg { transform: scale(1.1); }
    .brand-mark { transition: transform .6s var(--ease); }
    .brand:hover .brand-mark { transform: rotate(-8deg) scale(1.06); }

    .topbar h1.swap { animation: title-in .5s var(--ease) both; }
    @keyframes title-in { from { opacity: 0; transform: translate3d(0, 7px, 0); } }
    .topbar-icon { transition: transform .45s var(--ease), box-shadow .45s var(--ease); }
    .topbar-icon:hover { transform: rotate(-6deg) scale(1.06); }

    .page.page-enter > * { animation: page-rise .65s var(--ease) both; }
    .page.page-enter > :nth-child(2) { animation-delay: 70ms; }
    .page.page-enter > :nth-child(3) { animation-delay: 140ms; }
    .page.page-enter > :nth-child(4) { animation-delay: 210ms; }
    .page.page-enter > :nth-child(n+5) { animation-delay: 260ms; }
    .page.page-enter .stat-card { animation: card-rise .7s var(--ease) both; animation-delay: 90ms; }
    .page.page-enter .stat-card:nth-child(2) { animation-delay: 160ms; }
    .page.page-enter .stat-card:nth-child(3) { animation-delay: 230ms; }
    .page.page-enter .stat-card:nth-child(4) { animation-delay: 300ms; }
    .page.page-enter .license-fill { animation: bar-grow 1.2s var(--ease) .25s both; transform-origin: left center; }

    @keyframes page-rise { from { opacity: 0; transform: translate3d(0, 16px, 0); } }
    @keyframes card-rise { from { opacity: 0; transform: translate3d(0, 20px, 0) scale(.97); } }
    @keyframes bar-grow { from { transform: scaleX(0); } }
    @keyframes sheen { to { transform: translateX(100%); } }

    .stat-card { transition: transform .45s var(--ease), box-shadow .45s var(--ease); }
    .stat-card:hover { transform: translateY(-4px); box-shadow: 0 2px 4px rgba(90, 13, 18, .05), 0 24px 46px rgba(120, 20, 24, .14); }
    .stat-card::after { transition: transform .7s var(--ease); }
    .stat-card:hover::after { transform: scale(1.4); }
    .panel { transition: box-shadow .35s var(--ease); }

    .btn, .filter-tab, .tl-seg button, .pager-btn, .nav button, .table-item { position: relative; overflow: hidden; }
    .ripple { position: absolute; border-radius: 50%; pointer-events: none; background: currentColor; opacity: .2; transform: scale(0); animation: ripple .65s var(--ease) forwards; }
    @keyframes ripple { to { transform: scale(1); opacity: 0; } }
    .filter-tab, .tl-seg button { transition: background .28s, color .25s, box-shadow .28s, transform .25s var(--ease); }
    .filter-tab:active, .tl-seg button:active, .pager-btn:active:not(:disabled) { transform: scale(.96); }
    .pager-btn { transition: background .2s, color .2s, border-color .2s, transform .25s var(--ease), box-shadow .25s; }
    .pager-btn:hover:not(:disabled):not(.active) { transform: translateY(-1px); }
    .data-table tbody td { transition: background-color .15s ease; }
    .badge { transition: transform .3s var(--ease); }

    .modal-backdrop { animation: fade-in .22s ease both; backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }
    .modal:not(.confirm-modal) { animation: confirm-pop .34s var(--ease) both; }
    .toast-icon { animation: pop-in .45s var(--ease) .05s both; }

    .skeleton { place-self: stretch; align-self: start; width: 100%; padding: 20px; display: grid; gap: 13px; }
    .skeleton .loading { margin-top: 8px; justify-self: center; }
    .sk { display: block; height: 14px; width: var(--w, 80%); border-radius: 8px; background: linear-gradient(90deg, #f7e6e5 0%, #fff6f5 45%, #f7e6e5 90%); background-size: 200% 100%; animation: sk 1.3s linear infinite; }
    @keyframes sk { to { background-position: -200% 0; } }

    .scrim { display: none; }
    @media (max-width: 760px) {
      .sidebar { transition: transform .45s var(--ease); }
      .scrim { display: block; position: fixed; inset: 0; z-index: 15; background: rgba(30, 4, 7, .45); opacity: 0; pointer-events: none; transition: opacity .35s ease; }
      .scrim.show { opacity: 1; pointer-events: auto; }
    }
    @media (hover: none) { .stat-card:hover, button.table-item:hover, .nav button:not(.active):hover { transform: none; } }
  
    /* ---- MDM · Tăng/Giảm tồn ---- */
    .adj-dir { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
    .adj-dir button { text-align: left; display: flex; gap: 14px; align-items: center; padding: 14px 16px; border: 1.5px solid var(--line-strong); border-radius: 14px; background: #fff; color: var(--ink); transition: .18s; }
    .adj-dir button:hover { border-color: var(--brand-light); }
    .adj-dir .sign { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; font-size: 22px; font-weight: 800; background: var(--surface-soft); color: var(--muted); flex: none; }
    .adj-dir strong { display: block; font-size: 14px; }
    .adj-dir small { color: var(--muted); font-size: 11.5px; }
    .adj-dir button.on.inc { border-color: var(--success); background: var(--success-soft); }
    .adj-dir button.on.inc .sign { background: var(--success); color: #fff; }
    .adj-dir button.on.dec { border-color: var(--brand); background: var(--brand-soft); }
    .adj-dir button.on.dec .sign { background: var(--g-brand); color: #fff; }
    .adj-cfg { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; padding: 16px; background: var(--surface-soft); border: 1px solid var(--line); border-radius: 14px; margin-bottom: 18px; }
    .adj-cfg .field.bad input { border-color: var(--danger); background: var(--danger-soft); }
    .adj-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .adj-bar h3 { margin: 0; font-size: 13.5px; }
    .adj-bar h3 small { font-weight: 500; color: var(--muted); margin-left: 6px; }
    .adj-chips { display: flex; gap: 8px; flex-wrap: wrap; }
    .adj-chip { font-size: 12px; font-weight: 650; padding: 5px 11px; border-radius: 99px; background: #f4eeee; color: var(--ink-2); }
    .adj-chip.ok { background: var(--success-soft); color: var(--success); }
    .adj-chip.err { background: var(--danger-soft); color: var(--danger); }
    .adj-chip.warn { background: var(--warning-soft); color: var(--warning); }
    .adj-grid { border: 1px solid var(--line-strong); border-radius: 14px; background: #fff; max-height: 440px; overflow: auto; }
    .adj-head, .adj-row { display: grid; grid-template-columns: 52px minmax(0, 1fr) minmax(0, 1fr) 44px; align-items: center; }
    .adj-head { position: sticky; top: 0; z-index: 2; background: linear-gradient(#fff6f5, #fdeceb); border-bottom: 1px solid var(--line-strong); font-size: 11.5px; font-weight: 700; color: var(--brand-dark); text-transform: uppercase; letter-spacing: .04em; }
    .adj-head span { padding: 11px 12px; }
    .adj-head em { font-style: normal; text-transform: none; color: var(--muted); font-weight: 500; letter-spacing: 0; }
    .adj-row { border-bottom: 1px solid var(--line); }
    .adj-row:last-child { border-bottom: 0; }
    .adj-row:nth-child(even) { background: #fffafa; }
    .adj-n { text-align: center; font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .adj-row input { width: 100%; border: 0; border-left: 1px solid var(--line); background: transparent; padding: 11px 12px; font: 600 13.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: var(--ink); outline: none; }
    .adj-row input.num { text-align: right; }
    .adj-row input:focus { background: #fff; box-shadow: inset 0 0 0 2px var(--brand-light); }
    .adj-row input.bad { background: var(--danger-soft); box-shadow: inset 0 0 0 1.5px var(--danger); color: var(--danger); }
    .adj-row input.dup { background: var(--warning-soft); }
    .adj-row .adj-del { border: 0; background: transparent; color: var(--muted); font-size: 18px; line-height: 1; padding: 8px; border-radius: 8px; }
    .adj-row .adj-del:hover { color: var(--danger); background: var(--danger-soft); }
    .adj-tip { margin: 10px 2px 0; font-size: 12px; color: var(--muted); }
    .adj-tip kbd { font: 600 11px ui-monospace, Consolas, monospace; background: #fff; border: 1px solid var(--line-strong); border-bottom-width: 2px; border-radius: 5px; padding: 1px 6px; color: var(--ink-2); }
    .adj-foot { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; margin-top: 18px; padding-top: 16px; border-top: 1px dashed var(--line-strong); }
    .adj-foot .meta { font-size: 12px; color: var(--muted); }
    .adj-foot .meta b { color: var(--ink-2); }
    @media (max-width: 900px) { .adj-cfg { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 600px) { .adj-dir, .adj-cfg { grid-template-columns: 1fr; } }
  
    /* ---------- Lịch Coke (445) ở Tổng quan ---------- */
    .cal-wrap { max-width: 1000px; margin-bottom: 22px; }

    .cal-title { margin: 0; font-size: 30px; line-height: 1.05; font-weight: 800; letter-spacing: -.025em; text-shadow: 0 4px 22px rgba(60, 0, 6, .45); }

    .cal-kpi label { display: block; font-size: 10.5px; font-weight: 650; letter-spacing: .04em; color: rgba(255, 236, 234, .82); }

    .cal-today b { color: var(--brand-dark); }

    /* ---------- Hàng lịch + thẻ Ngày quan trọng ---------- */
    .cal-row { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(300px, 420px); gap: 18px; align-items: stretch; margin-bottom: 22px; }
