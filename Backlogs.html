function cleanText(v){
  const s = String(v == null ? "" : v).trim();
  return s || null;
}
function cleanNum(v){
  if (v === "" || v === null || v === undefined) return null;
  const n = Number(String(v).replace(",", "."));
  return Number.isFinite(n) ? n : null;
}
function cleanDay(v){
  const s = String(v == null ? "" : v).trim();
  if (!s) return null;
  return /^\d{4}-\d{2}-\d{2}$/.test(s) ? s : dayKey(s) || null;
}
function buildPayload(kind, data){
  const status = data.status || (kind === "backlog" ? "planned" : "todo");
  if (kind === "backlog") {
    const payload = {
      title: String(data.title || "").trim(),
      description: cleanText(data.description),
      owner_id: cleanText(data.owner_id),
      status: status,
      priority: data.priority || "medium",
      start_date: cleanDay(data.start_date),
      target_date: cleanDay(data.target_date),
      actual_start_date: cleanDay(data.actual_start_date),
      completed_date: cleanDay(data.completed_date),
      estimated_effort: cleanNum(data.estimated_effort),
      actual_effort: cleanNum(data.actual_effort),
      progress: cleanNum(data.progress),
      blocked_reason: cleanText(data.blocked_reason),
      jira_key: cleanText(data.jira_key)
    };
    payload.due_date = payload.target_date;
    if (status === "done" && !payload.completed_date) payload.completed_date = todayKey();
    if (!payload.progress && status === "done") payload.progress = 100;
    return payload;
  }
  const payload = {
    title: String(data.title || "").trim(),
    description: cleanText(data.description),
    assignee_id: cleanText(data.assignee_id),
    backlog_id: cleanText(data.backlog_id),
    status: status,
    priority: data.priority || "medium",
    start_date: cleanDay(data.start_date),
    due_date: cleanDay(data.due_date),
    actual_start_date: cleanDay(data.actual_start_date),
    completed_date: cleanDay(data.completed_date),
    estimated_hours: cleanNum(data.estimated_hours),
    actual_hours: cleanNum(data.actual_hours),
    blocked_reason: cleanText(data.blocked_reason),
    jira_key: cleanText(data.jira_key)
  };
  if (status === "done" && !payload.completed_date) payload.completed_date = todayKey();
  return payload;
}
function validatePayload(kind, payload){
  if (!payload.title) return "Cần nhập tiêu đề.";
  if (kind === "backlog") {
    if (payload.start_date && payload.target_date && diffDays(payload.start_date, payload.target_date) < 0) return "Deadline phải sau ngày bắt đầu.";
    if (payload.progress != null && (payload.progress < 0 || payload.progress > 100)) return "Tiến độ phải trong khoảng 0–100%.";
    if (norm(payload.status) === "blocked" && !payload.blocked_reason) return "Trạng thái Blocked cần có lý do bị chặn.";
  } else {
    if (payload.start_date && payload.due_date && diffDays(payload.start_date, payload.due_date) < 0) return "Deadline phải sau ngày bắt đầu.";
    if (norm(payload.status) === "blocked" && !payload.blocked_reason) return "Trạng thái Blocked cần có lý do bị chặn.";
  }
  return "";
}
async function saveRecord(event){
  event.preventDefault();
  if (!state.editing) return;
  const kind = state.editing.kind;
  const form = new FormData(event.currentTarget);
  const data = Object.fromEntries(form.entries());
  const payload = buildPayload(kind, data);
  const invalid = validatePayload(kind, payload);
  if (invalid) { toast(invalid, "error"); return; }
  if (kind === "task" && !state.editing.id) {
    const dup = state.tasks.find(function(t){ return norm(t.title) === norm(payload.title); });
    if (dup && !confirm("Đã có task cùng tên: “" + dup.title + "”. Vẫn tạo mới?")) return;
  }
  const table = kind === "backlog" ? BACKLOG_TABLE : TASK_TABLE;
  const btn = $("#recordSubmit");
  btn.disabled = true;
  btn.textContent = "Đang lưu…";
  try {
    const r = state.editing.id
      ? await state.client.from(table).update(payload).eq("id", state.editing.id)
      : await state.client.from(table).insert(payload);
    if (r.error) throw r.error;
    $("#recordDialog").close();
    state.editing = null;
    toast(kind === "backlog" ? "Đã lưu backlog" : "Đã lưu task", "good");
    await loadAll({ only: ["backlogs", "tasks"] });
  } catch (e) {
    toast("Không thể lưu: " + e.message, "error");
  } finally {
    btn.disabled = false;
    btn.textContent = "Lưu";
  }
}
async function deleteRecord(kind, id){
  const list = kind === "backlog" ? state.backlogs : state.tasks;
  const row = list.find(function(x){ return x.id === id; });
  if (!row) return;
  if (!confirm("Xoá “" + row.title + "”? Thao tác này không thể hoàn tác.")) return;
  const r = await state.client.from(kind === "backlog" ? BACKLOG_TABLE : TASK_TABLE).delete().eq("id", id);
  if (r.error) { toast("Không thể xoá: " + r.error.message, "error"); return; }
  closeDrawer();
  toast("Đã xoá mục", "good");
  await loadAll({ only: ["backlogs", "tasks"] });
}
async function patchItem(kind, id, patch, message){
  const table = kind === "backlog" ? BACKLOG_TABLE : TASK_TABLE;
  const r = await state.client.from(table).update(patch).eq("id", id);
  if (r.error) { toast("Không cập nhật được: " + r.error.message, "error"); return false; }
  const row = (kind === "backlog" ? state.backlogs : state.tasks).find(function(x){ return x.id === id; });
  if (row) Object.assign(row, patch);
  if (message) toast(message, "good");
  return true;
}

function backlogGroupKey(item, mode){
  if (mode === "owner") return item.ownerId || "none";
  if (mode === "status") return item.statusGroup;
  if (mode === "priority") return norm(item.priority);
  if (mode === "deadline") {
    if (!item.due) return "missing";
    const left = daysLeft(item);
    if (item.statusGroup === "done") return "done";
    if (left < 0) return "overdue";
    if (left <= 7) return "week";
    if (left <= 30) return "month";
    return "later";
  }
  return "all";
}

function backlogGroupedHtml(list, mode){
  if (!list.length) return emptyBox("Không có backlog phù hợp", "Thử đổi bộ lọc hoặc tạo backlog mới");
  if (mode === "none") {
    return dataTable({ scope: "backlogs", cols: backlogRowCols(), rows: list, sort: state.sort.backlogs, rowAction: "open-item" });
  }
  const keys = [];
  list.forEach(function(i){
    const k = backlogGroupKey(i, mode);
    if (keys.indexOf(k) < 0) keys.push(k);
  });
  const order = mode === "deadline" ? ["overdue", "week", "month", "later", "missing", "done"] : keys.slice().sort();
  const sorted = order.filter(function(k){ return keys.indexOf(k) >= 0; }).concat(keys.filter(function(k){ return order.indexOf(k) < 0; }));
  return sorted.map(function(k){
    const group = list.filter(function(i){ return backlogGroupKey(i, mode) === k; });
    const label = mode === "owner" ? (k === "none" ? "Chưa giao" : memberName(k)) : (BACKLOG_GROUP_LABEL[k] || k);
    const est = group.reduce(function(a, b){ return a + (b.effort || 0); }, 0);
    return panel({
      title: label + " · " + group.length,
      sub: est ? "Effort ước tính " + fmtHours(est) : "",
      tight: true,
      body: dataTable({ scope: "backlogs", cols: backlogRowCols(), rows: group, sort: state.sort.backlogs, rowAction: "open-item" })
    });
  }).join("");
}

/* ---------------- TIMELINE / GANTT ---------------- */
const TIMELINE_ZOOM = {
  day: { unitDays: 1, colw: 36, label: "Ngày" },
  week: { unitDays: 7, colw: 58, label: "Tuần" },
  month: { unitDays: 30.44, colw: 76, label: "Tháng" },
  quarter: { unitDays: 91.3, colw: 92, label: "Quý" }
};
function timelineDefaults(){
  const f = state.filters.timeline;
  if (!f.from || !f.to) {
    const monday = startOfWeek(new Date());
    f.from = dayKey(addDays(monday, -14));
    f.to = dayKey(addDays(monday, 56));
  }
  if (!f.zoom) f.zoom = "week";
  if (!f.group) f.group = "owner";
  return f;
}
function snapStart(value, zoom){
  const d = parseDay(value) || new Date();
  if (zoom === "month") return startOfMonth(d);
  if (zoom === "quarter") return startOfQuarter(d);
  if (zoom === "week") return startOfWeek(d);
  return d;
}
function timelineBuckets(start, end, zoom){
  const out = [];
  let cursor = new Date(start.getTime());
  let guard = 0;
  while (cursor <= end && guard < 160) {
    let next;
    if (zoom === "month") next = new Date(cursor.getFullYear(), cursor.getMonth() + 1, 1);
    else if (zoom === "quarter") next = new Date(cursor.getFullYear(), cursor.getMonth() + 3, 1);
    else if (zoom === "week") next = addDays(cursor, 7);
    else next = addDays(cursor, 1);
    const isWeekend = zoom === "day" && (cursor.getDay() === 0 || cursor.getDay() === 6);
    let label;
    if (zoom === "day") label = String(cursor.getDate());
    else if (zoom === "week") label = fmtDayShort(cursor);
    else if (zoom === "month") label = DF_MONTH.format(cursor);
    else label = "Q" + (Math.floor(cursor.getMonth() / 3) + 1) + "/" + String(cursor.getFullYear()).slice(2);
    out.push({ label: label, from: new Date(cursor.getTime()), weekend: isWeekend });
    cursor = next;
    guard++;
  }
  return out;
}
function timelineModel(){
  const f = timelineDefaults();
  const zoom = TIMELINE_ZOOM[f.zoom] ? f.zoom : "week";
  const z = TIMELINE_ZOOM[zoom];
  const start = snapStart(f.from, zoom);
  let end = snapStart(f.to, zoom);
  if (zoom === "week") end = addDays(end, 6);
  else if (zoom === "month") end = addDays(new Date(end.getFullYear(), end.getMonth() + 1, 0), 0);
  else if (zoom === "quarter") end = addDays(new Date(end.getFullYear(), end.getMonth() + 3, 0), 0);
  if (end < start) end = addDays(start, z.unitDays * 6);
  const buckets = timelineBuckets(start, end, zoom);
  const totalDays = diffDays(start, end) + 1;
  const width = Math.max(Math.round((totalDays / z.unitDays) * z.colw), 640);
  const left = function(dateValue){
    const d = parseDay(dateValue);
    if (!d) return null;
    return (diffDays(start, d) / z.unitDays) * z.colw;
  };
  return { f: f, zoom: zoom, z: z, start: start, end: end, buckets: buckets, width: width, left: left };

function timelineBar(item, model){

  const e = item.due && parseDay(item.due) ? item.due : s;

  let w = Math.max((diffDays(s, e) + 1) / model.z.unitDays * model.z.colw - 3, 10);

async function rescheduleItem(item, days){
  const patch = {};

    if (item.start) patch.start_date = dayKey(addDays(item.start, days));
    if (item.due) patch.due_date = dayKey(addDays(item.due, days));
  } else if (item.kind === "backlog") {
    if (item.start) patch.start_date = dayKey(addDays(item.start, days));
    if (item.due) { patch.target_date = dayKey(addDays(item.due, days)); patch.due_date = patch.target_date; }
  }
  if (!Object.keys(patch).length) { toast("Mục này chưa có ngày để dời", "error"); return false; }

function initTimelineDrag(){
  let drag = null;
  document.addEventListener("pointerdown", function(event){
    const bar = event.target.closest(".gantt-bar[data-drag]");
    if (!bar || event.button !== 0) return;
    const parts = bar.dataset.drag.split(":");
    drag = { el: bar, kind: parts[0], id: parts.slice(1).join(":"), x: event.clientX, moved: false };
    bar.classList.add("dragging");
  });
  document.addEventListener("pointermove", function(event){
    if (!drag) return;
    const model = timelineModel();
    const perDay = model.z.colw / model.z.unitDays;
    const days = Math.round((event.clientX - drag.x) / perDay);
    if (days !== 0) drag.moved = true;
    drag.days = days;
    drag.el.style.transform = "translateX(" + (days * perDay) + "px)";
    drag.el.style.zIndex = 7;
    if (Math.abs(event.clientX - drag.x) > 4) {
      drag.el.style.pointerEvents = "none";
      event.preventDefault();
    }
  }, { passive: false });
  document.addEventListener("pointerup", async function(){
    if (!drag) return;
    const current = drag;
    drag = null;
    current.el.classList.remove("dragging");
    current.el.style.transform = "";
    current.el.style.pointerEvents = "";
    if (!current.moved || !current.days) return;
    const item = withBlockedSince(allItems()).find(function(i){ return i.kind === current.kind && i.id === current.id; });
    if (!item) return;
    if (!confirm("Dời “" + item.title + "” thêm " + (current.days > 0 ? "+" : "") + current.days + " ngày?")) { renderShell(); return; }
    const ok = await rescheduleItem(item, current.days);
    if (ok) {
      if (state.loaded.activity) { try { await loadActivity(true); } catch (e) {} }
      const f = state.filters.timeline;
      if (f.from || f.to) { /* giữ nguyên khung nhìn */ }
      renderShell();
    }
  });
}

function activityFiltered(){
  const f = state.filters.activity;
  const term = String(f.q || "").trim().toLowerCase();
  return state.activity.filter(function(log){
    if (f.kind !== "all" && log.entity_type !== f.kind) return false;
    if (f.actor !== "all" && (log.actor_id || "none") !== f.actor) return false;
    if (f.action !== "all" && log.action !== f.action) return false;
    if (f.from && diffDays(f.from, dayKey(log.created_at)) < 0) return false;
    if (f.to && diffDays(dayKey(log.created_at), f.to) < 0) return false;
    if (term && (String(log.entity_label || "") + " " + (log.field || "") + " " + (log.new_value || "") + " " + (log.old_value || "")).toLowerCase().indexOf(term) < 0) return false;
    return true;
  });
}

/* ---------------- BÁO CÁO ---------------- */
function reportItems(){
  const f = state.filters.reports;
  let list = withBlockedSince(allItems());
  if (f.owner && f.owner !== "all") list = f.owner === "none" ? list.filter(isUnassigned) : list.filter(function(i){ return i.ownerId === f.owner; });
  if (f.project && f.project !== "all") list = list.filter(function(i){ return i.project === f.project; });
  return list;
}
function leadTime(list){
  const arr = list.map(function(i){
    if (!i.actualEnd || !i.actualStart) return null;
    const d = diffDays(i.actualStart, i.actualEnd);
    return d != null && d >= 0 ? d : null;
  }).filter(function(x){ return x !== null; });
  return { count: arr.length, avg: avg(arr), med: median(arr) };
}
function reportData(){
  const f = state.filters.reports;
  const to = f.to || todayKey();
  const from = f.from || dayKey(startOfMonth(new Date()));
  const unit = f.period === "month" ? "month" : "week";
  const items = reportItems();
  const tickets = items.filter(function(i){ return i.kind === "ticket"; });
  const backlogs = items.filter(function(i){ return i.kind === "backlog"; });
  const tasks = items.filter(function(i){ return i.kind === "task"; });
  const buckets = trendBuckets(from, to, unit);
  const labels = bucketLabels(buckets, unit);
  const within = function(list, dateFn, b){ return list.filter(function(i){ return inRange(dateFn(i), b.from, b.to); }); };
  const remainingAt = function(b){
    return items.filter(function(i){ return inRange(i.created, "1970-01-01", b.to) && (!i.actualEnd || diffDays(dayKey(i.actualEnd), b.to) < 0); });
  };
  const ticketSeries = {
    created: buckets.map(function(b){ return within(tickets, function(i){ return i.created; }, b).length; }),
    done: buckets.map(function(b){ return within(tickets, function(i){ return i.actualEnd; }, b).length; })
  };
  const backlogSeries = {
    created: buckets.map(function(b){ return within(backlogs, function(i){ return i.created; }, b).length; }),
    done: buckets.map(function(b){ return within(backlogs, function(i){ return i.actualEnd; }, b).length; }),
    remaining: buckets.map(function(b){ return remainingAt(b).filter(function(i){ return i.kind === "backlog"; }).length; })
  };
  const taskDoneSeries = buckets.map(function(b){ return within(tasks, function(i){ return i.actualEnd; }, b).length; });
  const completed = {
    tickets: tickets.filter(function(i){ return inRange(i.actualEnd, from, to); }),
    backlogs: backlogs.filter(function(i){ return inRange(i.actualEnd, from, to); }),
    tasks: tasks.filter(function(i){ return inRange(i.actualEnd, from, to); })
  };
  const onTime = function(list){
    const withDue = list.filter(function(i){ return i.due; });
    const ok = withDue.filter(function(i){ return diffDays(dayKey(i.actualEnd), i.due) <= 0; });
    return { total: list.length, withDue: withDue.length, ok: ok.length, pct: withDue.length ? pct(ok.length, withDue.length) : null };
  };
  const doneTasks = completed.tasks;
  const estimate = {
    est: doneTasks.reduce(function(a, b){ return a + (b.effort || 0); }, 0),
    act: doneTasks.reduce(function(a, b){ return a + (b.actualEffort || 0); }, 0),
    withData: doneTasks.filter(function(i){ return i.effort != null || i.actualEffort != null; }).length
  };
  const targetedBacklogs = backlogs.filter(function(i){ return inRange(i.due, from, to); });
  const blockedNow = blockedList(items);
  const blockedDays = blockedNow.reduce(function(a, b){
    if (!b.blockedSince) return a;
    const d = diffDays(b.blockedSince, new Date());
    return a + (d && d > 0 ? d : 0);
  }, 0);
  const overdueSeries = buckets.map(function(b){ return items.filter(function(i){ return inRange(i.due, b.from, b.to) && isOverdue(i); }).length; });
  const owners = ownerRows(items).rows.filter(function(r){ return r.items.length; }).sort(function(a, b){ return workloadScore(b) - workloadScore(a); });
  return {
    from: from, to: to, unit: unit, labels: labels, buckets: buckets, items: items,
    tickets: tickets, backlogs: backlogs, tasks: tasks, ticketSeries: ticketSeries, backlogSeries: backlogSeries,
    taskDoneSeries: taskDoneSeries, completed: completed, onTime: onTime,
    lead: { tickets: leadTime(completed.tickets), work: leadTime(completed.backlogs.concat(completed.tasks)) },
    estimate: estimate, targetedBacklogs: targetedBacklogs, blockedNow: blockedNow, blockedDays: blockedDays,
    overdueSeries: overdueSeries, remainingSeries: buckets.map(function(b){ return remainingAt(b).length; }), owners: owners
  };
}

async function reviewMember(id, approve){
  const m = state.members.find(function(x){ return x.user_id === id; });
  if (!m) return;
  if (!approve && !confirm("Từ chối yêu cầu của " + m.email + "?")) return;
  const r = await state.client.rpc("jtm_review_member", { p_user_id: id, p_approve: approve });
  if (r.error) { toast("Không thể cập nhật quyền: " + r.error.message, "error"); return; }

function paintList(){
  if (state.listPaint && $("#listHost")) $("#listHost").innerHTML = state.listPaint();
  else renderShell();
}
function drillTo(tab, patch){
  if (!TAB_META[tab]) tab = "tickets";
  state.tab = tab;
  if (patch && Object.keys(patch).length) state.filters[tab] = Object.assign(blankFilters(tab), patch);
  state.focusMember = tab === "workload" && patch && patch.member ? patch.member : null;
  state.page[tab] = 1;
  closeDrawer();
  renderShell();
  window.scrollTo({ top: 0, behavior: "smooth" });
}
function parsePatch(str){
  const patch = {};
  String(str || "").split(";").forEach(function(pair){
    if (!pair) return;
    const bits = pair.split("=");
    if (bits.length < 2) return;
    patch[bits[0]] = bits.slice(1).join("=");
  });
  return patch;
}
function onFilterChange(el, isText){
  const parts = String(el.dataset.filter || "").split(":");
  const scope = parts[0], key = parts.slice(1).join(":");
  if (!state.filters[scope]) return;
  state.filters[scope][key] = el.value;
  if (!isText && (key === "from" || key === "to") && state.filters[scope].preset) state.filters[scope].preset = "custom";
  state.page[scope] = 1;
  if (isText) paintList();
  else renderShell();
}
document.addEventListener("input", debounce(function(event){
  const el = event.target.closest("[data-filter]");
  if (!el || el.tagName !== "INPUT" || (el.type !== "search" && el.type !== "text")) return;
  onFilterChange(el, true);
}, 260));
document.addEventListener("change", function(event){
  const saved = event.target.closest('[data-action="apply-saved"]');
  if (saved && saved.value) { applySavedFilter(saved.value); return; }
  const el = event.target.closest("[data-filter]");
  if (!el || (el.tagName === "INPUT" && (el.type === "search" || el.type === "text"))) return;
  onFilterChange(el, false);
});
document.addEventListener("click", async function(event){
  if (event.target.closest("a[data-stop]")) return;
  const zoomEl = event.target.closest("[data-zoom]");
  if (zoomEl) { state.filters.timeline.zoom = zoomEl.dataset.zoom; renderShell(); return; }
  const kindEl = event.target.closest("[data-kinds]");
  if (kindEl) { state.filters.timeline.kinds = kindEl.dataset.kinds.split(","); renderShell(); return; }
  const wsEl = event.target.closest("[data-workload-sort]");
  if (wsEl) { state.sort.workload = { f: wsEl.dataset.workloadSort, d: "desc" }; renderShell(); return; }
  const drillEl = event.target.closest("[data-drill]");
  if (drillEl) { const parts = drillEl.dataset.drill.split("|"); drillTo(parts[0], parsePatch(parts[1])); return; }
  const periodEl = event.target.closest("[data-period]");
  if (periodEl) { const parts = periodEl.dataset.period.split(":"); applyPreset(parts[0], parts.slice(1).join(":")); renderShell(); return; }
  const presetEl = event.target.closest("[data-preset]");
  if (presetEl) {
    const parts = presetEl.dataset.preset.split(":");
    const scope = parts[0], value = parts.slice(1).join(":");
    state.filters[scope].preset = value === "all" ? "" : value;
    state.page[scope] = 1;
    renderShell();
    return;
  }
  const pageEl = event.target.closest("[data-page]");
  if (pageEl) {
    const parts = pageEl.dataset.page.split(":");
    state.page[parts[0]] = clamp((state.page[parts[0]] || 1) + (parts[1] === "next" ? 1 : -1), 1, 9999);
    paintList();
    return;
  }
  const sortEl = event.target.closest("[data-sort]");
  if (sortEl) {
    const parts = sortEl.dataset.sort.split(":");
    const scope = parts[0], field = parts.slice(1).join(":");
    const current = state.sort[scope] || { f: field, d: "desc" };
    state.sort[scope] = { f: field, d: current.f === field && current.d === "desc" ? "asc" : "desc" };
    state.page[scope] = 1;
    paintList();
    return;
  }
  const tabEl = event.target.closest("[data-tab]");
  if (tabEl) {
    const tab = tabEl.dataset.tab;
    if (TAB_META[tab]) {
      state.tab = tab;
      if (tab !== "workload") state.focusMember = null;
      closeDrawer();
      state.listPaint = null;
      if (tab === "activity" && !state.loaded.activity) {
        loadActivity(true).then(function(){ renderShell(); }).catch(function(e){ toast("Không tải được lịch sử: " + e.message, "error"); });
      }
      $$(".nav-btn").forEach(function(n){ n.classList.toggle("active", n.dataset.tab === tab); });
      requestAnimationFrame(function(){ renderShell(); });
      window.scrollTo({ top: 0, behavior: "auto" });
    }
    return;
  }
  const actionEl = event.target.closest("[data-action]");
  if (!actionEl) return;
  const action = actionEl.dataset.action;
  const id = actionEl.dataset.id;
  if (action === "logout") { await logout(); return; }
  if (action === "retry") { await loadSession(state.session, true); return; }
  if (action === "reapply") {
    const r = await state.client.rpc("jtm_reapply_access");
    if (r.error) toast("Gửi lại không thành công: " + r.error.message, "error");
    else { toast("Đã gửi lại yêu cầu", "good"); await loadSession(state.session, true); }
    return;
  }
  if (action === "refresh") { await refreshData(false); return; }
  if (action === "refresh-activity") { await loadActivity(true); renderShell(); toast("Đã tải lại lịch sử", "good"); return; }
  if (action === "load-more-activity") { await loadActivity(false); renderShell(); return; }
  if (action === "close-drawer") { closeDrawer(); return; }
  if (action === "close-record") { $("#recordDialog").close(); state.editing = null; return; }
  if (action === "close-history") { $("#historyDialog").close(); return; }
  if (action === "close-filter") { $("#filterDialog").close(); return; }
  if (action === "open-log") { openLogDetail(Number(actionEl.dataset.index)); return; }
  if (action === "open-log-item") { $("#historyDialog").close(); openItemDrawer(actionEl.dataset.kind, actionEl.dataset.id); return; }
  if (action === "open-item") { openItemDrawer(actionEl.dataset.kind, actionEl.dataset.id); return; }
  if (action === "open-member") { state.focusMember = id; renderShell(); window.scrollTo({ top: 0, behavior: "smooth" }); return; }
  if (action === "open-workload") { state.focusMember = null; renderShell(); return; }
  if (action === "new-backlog") { openRecord("backlog"); return; }
  if (action === "new-task") { openRecord("task"); return; }
  if (action === "new-task-from-ticket") {
    const key = actionEl.dataset.key;
    closeDrawer();
    openRecord("task", null, key ? { title: key + ": ", jira_key: key } : {});
    return;
  }
  if (action === "edit-backlog") { openRecord("backlog", id); return; }
  if (action === "edit-task") { openRecord("task", id); return; }
  if (action === "delete-backlog") { await deleteRecord("backlog", id); return; }
  if (action === "delete-task") { await deleteRecord("task", id); return; }
  if (action === "archive-backlog") { archiveBacklog(id); return; }
  if (action === "complete-task") {
    const patch = { status: "done", completed_date: todayKey() };
    const row = state.tasks.find(function(t){ return t.id === id; });
    if (row && !row.actual_start_date) patch.actual_start_date = todayKey();
    const ok = await patchItem("task", id, patch, "Đã đánh dấu hoàn thành");
    if (ok) await loadAll({ only: ["backlogs", "tasks"] });
    return;
  }
  if (action === "quick-done") {
    const kind = actionEl.dataset.kind;
    const ok = await patchItem(kind, id, quickDone(kind, id), "Đã đánh dấu hoàn thành");
    if (ok) { closeDrawer(); await loadAll({ only: ["backlogs", "tasks"] }); }
    return;
  }
  if (action === "approve-member") { await reviewMember(id, true); return; }
  if (action === "reject-member") { await reviewMember(id, false); return; }
  if (action === "save-filter") { openSaveFilter(actionEl.dataset.scope); return; }
  if (action === "delete-saved") {
    const scope = actionEl.dataset.scope;
    if (state.filters[scope] && state.filters[scope].__savedId) await deleteSavedFilter(state.filters[scope].__savedId);
    return;
  }
  if (action === "clear-filters") {
    const scope = actionEl.dataset.scope;
    state.filters[scope] = blankFilters(scope);
    state.page[scope] = 1;
    renderShell();
    return;
  }
  if (action === "timeline-shift") { shiftTimeline(Number(actionEl.dataset.dir)); return; }
  if (action === "timeline-today") { timelineToday(); return; }
  if (action === "export-overview") { exportOverviewCsv(); return; }
  if (action === "export-tickets") { exportTicketsCsv(); return; }
  if (action === "export-backlogs") { exportBacklogsCsv(); return; }
  if (action === "export-tasks") { exportTasksCsv(); return; }
  if (action === "export-workload") { exportWorkloadCsv(); return; }
  if (action === "export-member") { exportMemberCsv(id); return; }
  if (action === "export-timeline") { exportTimelineCsv(); return; }
  if (action === "export-risks") { exportRiskRows(); return; }
  if (action === "export-risk-group") {
    const rule = RISK_RULES.find(function(r){ return r.key === actionEl.dataset.risk; });
    if (!rule) return;
    const list = withBlockedSince(allItems()).filter(rule.test);
    downloadFile("rui-ro-" + rule.key + "-" + stampName() + ".csv",
      csvOf(["Loại", "Mã", "Tiêu đề", "Trạng thái", "Ưu tiên", "Người phụ trách", "Deadline", "Cập nhật"],
        list.map(function(i){ return [i.kind, i.code, i.title, labelStatus(i.status), i.priority, i.ownerName, fmtDay(i.due), fmtStamp(i.updated)]; })));
    toast("Đã xuất " + fmtNum(list.length) + " dòng", "good");
    return;
  }
  if (action === "export-report") { exportReportCsv(actionEl.dataset.report); return; }
  if (action === "export-activity") { exportActivityCsv(); return; }
});
