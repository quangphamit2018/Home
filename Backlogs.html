<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#131c27">
<title>Jira Desk — Team Operations</title>
<style>
:root{--ink:#17212b;--muted:#74808c;--muted2:#9aa5b1;--line:#e5e9ed;--grid:#eef1f4;--paper:#fff;--canvas:#f4f6f7;--nav:#131c27;--nav2:#1e2a37;--blue:#356ee6;--blue-dark:#2358ca;--blue-soft:#eef3fe;--mint:#dff4ed;--green:#168162;--amber:#bd7c19;--amber-soft:#fdf3e3;--red:#c84949;--red-soft:#fdeeee;--violet:#6b5ce7;--teal:#0f9b8e;--rose:#c2477a;--radius:14px;--shadow:0 18px 48px rgba(25,39,52,.13);--shadow-sm:0 1px 2px rgba(23,33,43,.06),0 6px 16px rgba(23,33,43,.05);--focus:0 0 0 3px rgba(53,110,230,.22)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--canvas);font-size:13.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.55;cursor:not-allowed}
a{color:var(--blue-dark)}
h1,h2,h3,h4{margin:0;font-weight:700;letter-spacing:-.3px}
svg{flex:none}
.icon svg,.nav-icon svg,.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block}
.nowrap{white-space:nowrap}
.muted{color:var(--muted)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- gate ---------- */
.gate{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(1100px 600px at 20% -10%,#26374d,transparent),var(--nav);padding:22px;z-index:20;overflow:auto}
.gate-card{width:100%;max-width:452px;background:var(--paper);border-radius:20px;padding:30px 30px 26px;box-shadow:var(--shadow)}
.gate-brand{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.brand-mark{height:38px;width:38px;border-radius:12px;background:#e8efff;color:#315fca;display:grid;place-items:center;font-weight:850;font-size:15px;letter-spacing:-1px;flex:none}
.brand-name{font-weight:720;letter-spacing:-.35px;font-size:15px}
.brand-sub{display:block;color:#8794a3;font-size:10px;font-weight:600;letter-spacing:1.15px;text-transform:uppercase;margin-top:3px}
.gate-card h1{font-size:21px;margin-bottom:9px}
.gate-copy{color:var(--muted);margin:0 0 18px;font-size:13px}
.gate-foot{color:var(--muted);font-size:11.5px;margin-top:16px;line-height:1.55}
.gate-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}
.gate-actions .btn{flex:1 1 auto;justify-content:center}
.google-btn{width:100%;display:flex;align-items:center;justify-content:center;gap:11px;background:var(--paper);border:1px solid var(--line);border-radius:11px;padding:12px 16px;font-weight:650;font-size:13.5px;transition:background-color .16s,border-color .16s,color .16s,box-shadow .16s,transform .16s,opacity .16s;box-shadow:var(--shadow-sm)}
.google-btn:hover{border-color:#c9d2dc;transform:translateY(-1px)}
.google-g{height:22px;width:22px;border-radius:50%;background:conic-gradient(from -45deg,#ea4335 0 25%,#fbbc05 0 50%,#34a853 0 75%,#4285f4 0);color:#fff;font-weight:800;font-size:12px;display:grid;place-items:center}
.loading{display:flex;align-items:center;gap:11px;color:var(--muted);font-size:13px;padding:16px 0 6px}
.spinner{height:17px;width:17px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--blue);animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.config-row{margin-bottom:12px}
.config-row label{display:block;font-size:11.5px;font-weight:700;letter-spacing:.3px;color:var(--muted);margin-bottom:6px}
.config-row input{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 13px;background:#fbfcfd}
.config-row input:focus{outline:0;border-color:var(--blue);box-shadow:var(--focus);background:var(--paper)}

/* ---------- layout ---------- */
.shell{display:none;min-height:100vh}
.sidebar{position:fixed;inset:0 auto 0 0;width:252px;background:var(--nav);color:#f5f7fa;padding:22px 14px 16px;display:flex;flex-direction:column;z-index:5}
.brand{display:flex;align-items:center;gap:12px;padding:0 8px 20px}
.side-scroll{overflow-y:auto;min-height:0;flex:1;scrollbar-width:thin}
.nav-group+.nav-group{margin-top:16px}
.nav-label{padding:0 11px 7px;color:#8290a0;font-size:9.5px;font-weight:700;letter-spacing:1.25px;text-transform:uppercase}
.nav-list{display:grid;gap:3px}
.nav-btn{border:0;background:transparent;color:#b5c0cb;text-align:left;border-radius:10px;padding:10px 12px;display:flex;align-items:center;gap:11px;font-size:13px;font-weight:600;transition:background-color .16s,border-color .16s,color .16s,box-shadow .16s,transform .16s,opacity .16s;width:100%}
.nav-btn:hover{background:#1b2734;color:#fff}
.nav-btn.active{background:#263751;color:#fff;box-shadow:inset 3px 0 #86a9ff}
.nav-icon{width:18px;height:18px;display:grid;place-items:center;color:inherit}
.nav-count{margin-left:auto;border-radius:99px;background:#33455c;color:#dbe5f2;font-size:10px;line-height:18px;min-width:19px;text-align:center;font-weight:800;padding:0 5px}
.nav-count.alert{background:#dba84a;color:#1d2630}
.nav-count:empty{display:none}
.side-bottom{margin-top:auto;border-top:1px solid #293542;padding-top:13px}
.connection-mini{display:flex;align-items:center;gap:8px;padding:8px 10px;color:#9aa7b4;font-size:11px;overflow:hidden}
.connection-mini span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{height:7px;width:7px;border-radius:50%;background:#42b983;display:inline-block;flex:none}
.side-user{display:flex;align-items:center;gap:10px;padding:9px 8px 3px;min-width:0}
.avatar{height:31px;width:31px;object-fit:cover;border-radius:50%;background:#e9eef4;display:grid;place-items:center;color:#475766;font-size:11px;font-weight:800;flex:none}
.side-user-text{min-width:0}
.side-user-name{font-size:12.5px;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side-user-email{color:#8794a3;font-size:10.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.main{margin-left:252px;min-height:100vh;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:4;background:rgba(244,246,247,.97);border-bottom:1px solid var(--line);padding:0 30px;height:60px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.crumb{font-size:12.5px;color:var(--muted)}
.crumb-sep{padding:0 7px;color:#b1b9bf}
.crumb strong{color:var(--ink);font-weight:650}
.top-right{display:flex;align-items:center;gap:10px}
.user-chip{display:flex;align-items:center;gap:8px;background:var(--paper);border:1px solid var(--line);border-radius:99px;padding:5px 12px 5px 6px;font-size:12.5px;font-weight:600;box-shadow:var(--shadow-sm)}
.content{padding:26px 30px 70px;flex:1;max-width:1680px;width:100%}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:20px}
.page-head-text{min-width:0}
.eyebrow{font-size:10px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:var(--blue);margin-bottom:6px}
.page-title{font-size:24px;letter-spacing:-.6px}
.page-desc{color:var(--muted);margin:5px 0 0;font-size:13px;max-width:70ch}
.page-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* ---------- controls ---------- */
.btn{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:9px 13px;display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:650;color:var(--ink);transition:background-color .15s,border-color .15s,color .15s,box-shadow .15s,transform .15s,opacity .15s;box-shadow:var(--shadow-sm);text-decoration:none}
.btn:hover{border-color:#cfd8e2;transform:translateY(-1px)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{background:var(--blue-dark);border-color:var(--blue-dark)}
.btn.danger{background:var(--paper);border-color:#f0d3d3;color:var(--red)}
.btn.danger:hover{background:var(--red-soft)}
.btn.ghost{box-shadow:none;background:transparent}
.btn.text{border-color:transparent;background:transparent;box-shadow:none;color:var(--blue-dark);padding:6px 8px}
.btn.text:hover{background:var(--blue-soft);transform:none}
.btn.small{padding:6px 10px;font-size:11.5px;border-radius:9px}
.btn.icon{padding:7px}
.icon-btn{border:1px solid transparent;background:transparent;border-radius:9px;padding:7px;display:grid;place-items:center;color:var(--muted);transition:background-color .15s,border-color .15s,color .15s,box-shadow .15s,transform .15s,opacity .15s}
.icon-btn:hover{background:#eef1f4;color:var(--ink)}
.icon-btn.dark{color:#93a1b0}
.icon-btn.dark:hover{background:#1b2734;color:#fff}
.field{display:flex;flex-direction:column;gap:6px}
.field>span,.fld-label{font-size:11.5px;font-weight:700;letter-spacing:.3px;color:var(--muted)}
input,select,textarea{border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:var(--paper);min-width:0}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--blue);box-shadow:var(--focus)}
select{cursor:pointer;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 15px) 51%,calc(100% - 10px) 51%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:29px}
.toolbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:14px;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:11px 12px;box-shadow:var(--shadow-sm)}
.toolbar .grow{flex:1 1 220px;min-width:180px}
.toolbar select,.toolbar input{font-size:12.5px;padding:8px 10px}
.toolbar select{padding-right:28px}
.search-box{position:relative;flex:1 1 240px;min-width:180px;display:flex}
.search-box input{padding-left:33px;width:100%}
.search-ico{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted2);display:grid;place-items:center;pointer-events:none}
.search-ico svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.9}
.toolbar-sep{width:1px;height:22px;background:var(--line)}
.chips{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:99px;padding:6px 12px;font-size:12px;font-weight:600;color:var(--muted);transition:background-color .15s,border-color .15s,color .15s,box-shadow .15s,transform .15s,opacity .15s;white-space:nowrap}
.chip:hover{border-color:#cfd8e2;color:var(--ink)}
.chip.active{background:var(--ink);border-color:var(--ink);color:#fff}
.chip .c-count{opacity:.7;font-weight:700;margin-left:5px}
.seg{display:inline-flex;background:#eef1f4;border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:8px;padding:6px 11px;font-size:12px;font-weight:650;color:var(--muted)}
.seg button.active{background:var(--paper);color:var(--ink);box-shadow:var(--shadow-sm)}

/* ---------- cards ---------- */
.grid{display:grid;gap:14px}
.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:18px}
.stats.five{grid-template-columns:repeat(5,minmax(0,1fr))}
.stats.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.stat-card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:15px 16px;box-shadow:var(--shadow-sm);position:relative;transition:background-color .16s,border-color .16s,color .16s,box-shadow .16s,transform .16s,opacity .16s;text-align:left}
button.stat-card{cursor:pointer;width:100%}
button.stat-card:hover{border-color:#cfd8e2;transform:translateY(-2px);box-shadow:var(--shadow)}
.stat-top{display:flex;align-items:center;justify-content:space-between;gap:10px;color:var(--muted);font-size:11.5px;font-weight:650;letter-spacing:.2px}
.stat-icon{height:28px;width:28px;border-radius:9px;background:#f1f4f7;display:grid;place-items:center;color:var(--muted)}
.stat-icon.blue{background:var(--blue-soft);color:var(--blue-dark)}
.stat-icon.green{background:var(--mint);color:var(--green)}
.stat-icon.amber{background:var(--amber-soft);color:var(--amber)}
.stat-icon.red,.stat-icon.rose{background:var(--red-soft);color:var(--red)}
.stat-icon.violet{background:#f0eefe;color:var(--violet)}
.stat-num{font-size:25px;font-weight:780;letter-spacing:-1px;margin:9px 0 2px;line-height:1.1}
.stat-note{color:var(--muted);font-size:11.5px;line-height:1.45}
.stat-foot{color:var(--blue-dark);font-size:11px;font-weight:700;margin-top:7px;display:flex;align-items:center;gap:5px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm);overflow:hidden;margin-bottom:16px}
.panel-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;padding:15px 17px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.panel-title{font-size:14px;font-weight:700}
.panel-sub{color:var(--muted);font-size:11.5px;margin-top:3px}
.panel-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.panel-body{padding:15px 17px}
.panel-body.tight{padding:0}
.panel-foot{padding:11px 17px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);background:#fbfcfd}
.callout{padding:11px 13px;border-radius:12px;font-size:12px;line-height:1.5}
.callout.big{font-size:15px;font-weight:700}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{height:9px;width:9px;border-radius:3px;display:inline-block}

/* ---------- table ---------- */
.table-wrap{overflow-x:auto}
.table-wrap.soft{overflow-x:auto;overflow-y:visible}
table{width:100%;border-collapse:collapse;font-size:12.8px}
thead th{text-align:left;font-size:10.5px;letter-spacing:.75px;text-transform:uppercase;color:var(--muted);font-weight:750;padding:11px 14px;background:#fbfcfd;border-bottom:1px solid var(--line);white-space:nowrap;position:relative}
thead th.sortable{cursor:pointer;user-select:none}
thead th.sortable:hover{color:var(--ink)}
thead th .dir{color:var(--blue);font-size:10px;margin-left:4px}
tbody td{padding:11px 14px;border-bottom:1px solid var(--grid);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr.hoverable{cursor:pointer}
tbody tr.hoverable:hover{background:#fafbfc}
.primary-cell{font-weight:640;display:block;max-width:52ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell-sub{display:block;color:var(--muted);font-size:11px;margin-top:2px;max-width:46ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell-sub.wrap{white-space:normal;overflow:visible}
.ticket-key{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;font-weight:700;color:var(--blue-dark);background:var(--blue-soft);border-radius:6px;padding:3px 7px;display:inline-block;white-space:nowrap}
.row-actions{display:flex;gap:2px;align-items:center;justify-content:flex-end}
.link-btn{background:none;border:0;padding:0;color:var(--blue-dark);font-weight:650;font-size:12.5px;text-decoration:none}
.link-btn:hover{text-decoration:underline}
.badge{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:3px 9px;font-size:11px;font-weight:700;white-space:nowrap;border:1px solid transparent}
.badge.green{background:var(--mint);color:var(--green)}
.badge.red{background:var(--red-soft);color:var(--red)}
.badge.blue{background:var(--blue-soft);color:var(--blue-dark)}
.badge.amber{background:var(--amber-soft);color:var(--amber)}
.badge.violet{background:#f0eefe;color:var(--violet)}
.badge.gray{background:#f1f4f7;color:var(--muted)}
.badge.outline{background:transparent;border-color:var(--line);color:var(--muted)}
.priority{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:650;text-transform:capitalize}
.priority:before{content:"";height:7px;width:7px;border-radius:50%;background:var(--muted2);flex:none}
.priority.low:before{background:#9aa5b1}
.priority.medium:before{background:var(--blue)}
.priority.high:before{background:var(--amber)}
.priority.urgent:before,.priority.highest:before,.priority.critical:before{background:var(--red)}
.person{display:inline-flex;align-items:center;gap:8px;min-width:0}
.person .avatar{height:26px;width:26px;font-size:10px}
.progress{height:6px;border-radius:99px;background:#edf0f3;overflow:hidden;min-width:56px}
.progress i{display:block;height:100%;border-radius:99px;background:var(--blue)}
.progress.green i{background:var(--green)}
.progress.red i{background:var(--red)}
.progress.amber i{background:var(--amber)}
.progress-line{display:flex;align-items:center;gap:9px}
.progress-line b{font-size:11.5px;font-weight:700;color:var(--muted);min-width:34px;text-align:right}
.empty{padding:34px 18px;text-align:center;color:var(--muted);font-size:12.5px}
.empty strong{display:block;color:var(--ink);font-size:13.5px;margin-bottom:5px;font-weight:680}
.notice{border-radius:12px;padding:11px 13px;font-size:12.5px;margin-bottom:14px;border:1px solid var(--line);background:#fbfcfd;color:var(--muted)}
.notice.error{background:var(--red-soft);border-color:#f2d5d5;color:#8f3030}
.notice.warn{background:var(--amber-soft);border-color:#f0e0c4;color:#8a5c14}
.notice.success{background:var(--mint);border-color:#c7e8dd;color:#10604a}
.notice b{color:inherit}
.skeleton{height:12px;border-radius:6px;background:linear-gradient(90deg,#eef1f4,#f7f9fa,#eef1f4);background-size:200% 100%;animation:shine 1.3s linear infinite}
@keyframes shine{to{background-position:-200% 0}}
.skeleton-row{display:flex;gap:12px;padding:13px 16px;border-bottom:1px solid var(--grid)}
.skeleton-row .skeleton:nth-child(1){flex:2}
.skeleton-row .skeleton:nth-child(2){flex:1}
.skeleton-row .skeleton:nth-child(3){flex:1}

/* ---------- dialog / drawer ---------- */
.dialog{border:0;border-radius:18px;padding:0;max-width:min(820px,94vw);width:100%;box-shadow:var(--shadow);background:var(--paper);color:var(--ink)}
.dialog::backdrop{background:rgba(19,28,39,.5)}
.dialog-inner{padding:22px 24px 20px}
.dialog-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:16px}
.dialog-title{font-size:16.5px;font-weight:730}
.dialog-desc{color:var(--muted);font-size:12px;margin-top:4px;max-width:62ch}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.form-grid .full{grid-column:1/-1}
.form-grid textarea{min-height:78px;resize:vertical}
.dialog-foot{display:flex;justify-content:flex-end;gap:9px;margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}
.drawer-scrim{position:fixed;inset:0;background:rgba(19,28,39,.42);opacity:0;pointer-events:none;transition:background-color .22s,border-color .22s,color .22s,box-shadow .22s,transform .22s,opacity .22s;z-index:8}
.drawer-scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--paper);box-shadow:var(--shadow);transform:translateX(102%);transition:transform .26s cubic-bezier(.32,.72,.28,1);z-index:9;display:flex;flex-direction:column}
.drawer.open{transform:none}
.drawer-head{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;gap:14px}
.drawer-kicker{font-size:10.5px;font-weight:750;letter-spacing:1.1px;text-transform:uppercase;color:var(--muted)}
.drawer-title{font-size:16.5px;font-weight:730;margin-top:5px;line-height:1.35}
.drawer-body{padding:20px 22px 40px;overflow-y:auto;flex:1}
.kv{display:grid;grid-template-columns:132px 1fr;gap:9px 14px;font-size:12.5px}
.kv dt{color:var(--muted);font-weight:600}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.section-label{font-size:10.5px;font-weight:750;letter-spacing:1.1px;text-transform:uppercase;color:var(--muted);margin:22px 0 10px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.section-label:first-child{margin-top:0}
.drawer-raw{background:#fbfcfd;border:1px solid var(--line);border-radius:12px;padding:12px;font-size:11px;max-height:260px;overflow:auto;white-space:pre-wrap;word-break:break-word;color:#44515e}

/* ---------- timeline / gantt ---------- */
.gantt{border:1px solid var(--line);border-radius:12px;background:var(--paper);overflow:hidden}
.gantt-scroll{overflow-x:auto;overscroll-behavior-x:contain}
.gantt-head{display:flex;position:sticky;top:0;z-index:3;background:#fbfcfd;border-bottom:1px solid var(--line)}
.gantt-corner{width:232px;flex:none;border-right:1px solid var(--line);padding:10px 12px;font-size:10.5px;font-weight:750;letter-spacing:.8px;text-transform:uppercase;color:var(--muted)}
.gantt-cols{position:relative;display:flex}
.gantt-col{flex:none;border-right:1px solid var(--grid);font-size:10.5px;color:var(--muted);text-align:center;padding:10px 0;white-space:nowrap;overflow:hidden}
.gantt-col.weekend{background:#f7f9fb}
.gantt-col b{display:block;font-size:11px;color:var(--ink);font-weight:700}
.gantt-groupbar{display:flex;background:#f7f9fb;border-bottom:1px solid var(--line)}
.gantt-groupbar>div{padding:8px 12px;font-size:10.5px;font-weight:750;letter-spacing:.7px;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.gantt-groupbar .gl{width:232px;flex:none;border-right:1px solid var(--line)}
.gantt-row{display:flex;border-bottom:1px solid var(--grid);position:relative}
.gantt-row:hover{background:#fafbfc}
.gantt-label{width:232px;flex:none;border-right:1px solid var(--line);padding:8px 12px;min-width:0}
.gantt-label .primary-cell{font-size:12.5px}
.gantt-track{position:relative;flex:none;background-image:linear-gradient(to right,var(--grid) 1px,transparent 1px)}
.gantt-bar{position:absolute;top:9px;height:22px;border-radius:7px;background:var(--blue);color:#fff;font-size:11px;font-weight:650;display:flex;align-items:center;gap:6px;padding:0 8px;box-shadow:0 2px 6px rgba(53,110,230,.24);white-space:nowrap;overflow:hidden;cursor:grab;touch-action:none}
.gantt-bar:active{cursor:grabbing}
.gantt-bar.blocked{background:var(--red);box-shadow:0 2px 6px rgba(200,73,73,.24)}
.gantt-bar.done{background:var(--green);box-shadow:0 2px 6px rgba(22,129,98,.22)}
.gantt-bar.planned{background:#7f8da0;box-shadow:none}
.gantt-bar.dragging{opacity:.85;box-shadow:var(--shadow);z-index:6}
.gantt-bar.overdue{outline:2px solid rgba(200,73,73,.4);outline-offset:1px}
.gantt-actual{position:absolute;bottom:5px;height:6px;border-radius:3px;background:rgba(22,129,98,.85)}
.gantt-today{position:absolute;top:0;bottom:0;width:2px;background:var(--amber);z-index:2;pointer-events:none}
.gantt-today i{position:absolute;top:-1px;left:-4px;height:8px;width:10px;border-radius:2px;background:var(--amber)}
.gantt-missing{font-size:11px;color:var(--amber);font-weight:650;display:inline-flex;align-items:center;gap:5px;padding-left:2px}
.gantt-zoom{display:flex;align-items:center;gap:6px}

/* ---------- charts ---------- */
.chart{width:100%;display:block;overflow:visible}
.chart text{font-size:10px;fill:var(--muted);font-family:inherit}
.chart .axis{stroke:var(--grid)}
.chart .seg{cursor:pointer;transition:opacity .15s}
.chart .seg:hover{opacity:.82}
.chart .gridline{stroke:#f0f3f6}
.chart-empty{color:var(--muted);font-size:12px;padding:26px 0;text-align:center}
.hbar-list{display:flex;flex-direction:column;gap:11px}
.hbar{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:12px}
.hbar-track{grid-column:1/-1;height:8px;border-radius:99px;background:#f1f4f7;overflow:hidden}
.hbar-track i{display:block;height:100%;border-radius:99px;background:var(--blue)}
.hbar-name{font-weight:640;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar-val{color:var(--muted);font-weight:650;font-size:11.5px}
.bar-list{display:flex;flex-direction:column;gap:12px}
.bar-row{display:grid;grid-template-columns:1fr auto;gap:5px 10px}
.bar-row .bar-meta{font-size:11.5px;color:var(--muted)}
.bar-stack{grid-column:1/-1;display:flex;height:9px;border-radius:99px;overflow:hidden;background:#f1f4f7}
.bar-stack i{display:block;height:100%}

/* ---------- feed ---------- */
.feed{display:flex;flex-direction:column}
.feed-item{display:flex;gap:13px;padding:13px 17px;border-bottom:1px solid var(--grid)}
.feed-item:last-child{border-bottom:0}
.feed-icon{height:29px;width:29px;border-radius:9px;background:#f1f4f7;display:grid;place-items:center;color:var(--muted);flex:none}
.feed-icon.blue{background:var(--blue-soft);color:var(--blue-dark)}
.feed-icon.green{background:var(--mint);color:var(--green)}
.feed-icon.red{background:var(--red-soft);color:var(--red)}
.feed-icon.amber{background:var(--amber-soft);color:var(--amber)}
.feed-text{font-size:12.8px;line-height:1.5;min-width:0}
.feed-text b{font-weight:680}
.feed-meta{color:var(--muted);font-size:11px;margin-top:3px;display:flex;gap:9px;flex-wrap:wrap}
.delta{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;background:#f4f6f8;border-radius:5px;padding:1px 5px}
.delta.old{color:var(--red)}
.delta.new{color:var(--green)}

/* ---------- misc ---------- */
.person-card{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--paper)}
.person-info{min-width:0;flex:1}
.person-name{font-weight:680;font-size:13px}
.person-email{color:var(--muted);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.role-label{font-size:9.5px;font-weight:800;letter-spacing:.9px;color:var(--muted)}
.toast-stack{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:9px;z-index:30;max-width:min(400px,92vw)}
.toast{background:var(--ink);color:#f7f9fb;border-radius:11px;padding:11px 15px;font-size:12.5px;box-shadow:var(--shadow);animation:pop .22s ease-out;border-left:3px solid #5f6b7a}
.toast.good{border-left-color:#42b983}
.toast.error{border-left-color:var(--red)}
@keyframes pop{from{opacity:0;transform:translateY(9px)}}
.pager{display:flex;align-items:center;gap:9px;font-size:12px;color:var(--muted)}
.risk-group{border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden;background:var(--paper)}
.risk-head{display:flex;align-items:center;gap:11px;padding:12px 15px;cursor:pointer}
.risk-head:hover{background:#fbfcfd}
.risk-count{margin-left:auto;font-weight:780;font-size:15px}
.legend-note{color:var(--muted);font-size:11.5px;margin-top:6px}
.split{display:grid;grid-template-columns:1.35fr .95fr;gap:15px;align-items:start}
.stack{display:flex;flex-direction:column;gap:15px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:15px;overflow-x:auto}
.tabs button{border:0;background:transparent;padding:10px 13px;font-size:12.5px;font-weight:650;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.active{color:var(--ink);border-bottom-color:var(--blue)}
.bar-inline{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;color:var(--muted)}
.mini-stat{display:flex;flex-direction:column;gap:3px;padding:11px 13px;border:1px solid var(--line);border-radius:12px;background:#fbfcfd}
.mini-stat span{font-size:11px;color:var(--muted);font-weight:650}
.mini-stat b{font-size:18px;font-weight:760;letter-spacing:-.5px}
.report-table{width:100%;border-collapse:collapse;font-size:12.5px}
.report-table th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);padding:9px 12px;border-bottom:1px solid var(--line)}
.report-table td{padding:9px 12px;border-bottom:1px solid var(--grid)}
.report-table tr:last-child td{border-bottom:0}
.report-table td.num{text-align:right;font-variant-numeric:tabular-nums;font-weight:650}
.link-out{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:650}

/* ---------- responsive ---------- */
@media(max-width:1180px){
  .stats{grid-template-columns:repeat(3,minmax(0,1fr))}
  .stats.five{grid-template-columns:repeat(3,minmax(0,1fr))}
  .split{grid-template-columns:1fr}
}
@media(max-width:1050px){
  .sidebar{width:216px}
  .main{margin-left:216px}
  .content{padding:22px 20px 60px}
  .topbar{padding:0 20px}
  .stats,.stats.five{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cols-3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .gantt-corner,.gantt-label,.gantt-groupbar .gl{width:180px}
}
@media(max-width:820px){
  .cols-2,.cols-3{grid-template-columns:1fr}
  .form-grid{grid-template-columns:1fr}
  .kv{grid-template-columns:110px 1fr}
}
@media(max-width:760px){
  .sidebar{position:sticky;top:0;width:100%;height:auto;inset:auto;padding:10px 12px 9px;display:block}
  .brand{padding:0 4px 9px}
  .brand-sub{display:none}
  .side-scroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;flex:none}
  .nav-group{display:contents}
  .nav-label{display:none}
  .nav-list{display:flex;gap:6px}
  .nav-btn{padding:8px 11px;font-size:12px;white-space:nowrap;background:#1a2532}
  .nav-btn.active{box-shadow:inset 0 -2px #86a9ff}
  .nav-count{margin-left:6px}
  .side-bottom{display:none}
  .main{margin-left:0}
  .topbar{padding:0 14px;height:54px}
  .crumb{font-size:11.5px}
  .crumb .crumb-lead{display:none}
  .user-chip{display:none}
  .content{padding:16px 14px 64px}
  .page-title{font-size:20px}
  .page-head{margin-bottom:15px}
  .stats,.stats.five,.stats.three{grid-template-columns:1fr 1fr;gap:10px}
  .stat-card{padding:12px 13px}
  .stat-num{font-size:21px}
  .toolbar{padding:10px}
  .toolbar .grow,.search-box{flex:1 1 100%}
  .dialog-inner{padding:18px 16px}
  .drawer{width:100%}
  .drawer-head,.drawer-body{padding-left:16px;padding-right:16px}
  .kv{grid-template-columns:1fr;gap:3px 0}
  .kv dt{margin-top:7px}
  .toast-stack{left:12px;right:12px;bottom:12px;max-width:none}
  /* tables become cards */
  table.responsive thead{display:none}
  table.responsive tbody tr{display:block;border-bottom:1px solid var(--line);padding:11px 2px}
  table.responsive tbody td{display:flex;justify-content:space-between;gap:14px;padding:4px 14px;border:0;text-align:right}
  table.responsive tbody td:before{content:attr(data-label);color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;font-weight:700;text-align:left;flex:none}
  table.responsive tbody td[data-label=""]:before,table.responsive tbody td.cell-main:before{display:none}
  table.responsive tbody td.cell-main{display:block;text-align:left;padding-bottom:7px}
  table.responsive tbody td.cell-main .primary-cell{max-width:none;white-space:normal}
  .primary-cell,.cell-sub{max-width:none}
  .row-actions{justify-content:flex-end}
  .gantt-corner,.gantt-label,.gantt-groupbar .gl{width:150px}
  .gantt-label{padding:7px 9px}
  .panel-head{padding:13px 14px}
  .panel-body{padding:13px 14px}
}
@media(max-width:460px){
  .stats,.stats.five,.stats.three{grid-template-columns:1fr}
}

/* ---------- chuyển động mượt, skeleton ---------- */
html{scroll-behavior:auto}
.gate-card{animation:gateIn .34s cubic-bezier(.22,.7,.2,1) both}
@keyframes gateIn{from{opacity:0;transform:translateY(12px) scale(.985)}}
.panel{content-visibility:auto;contain-intrinsic-size:auto 340px}
.btn:active,.google-btn:active,.nav-btn:active{transform:scale(.97)}
.toast{animation:toastIn .26s cubic-bezier(.22,.7,.2,1)}
.toast.leaving{animation:toastOut .22s ease-in forwards}
@keyframes toastIn{from{opacity:0;transform:translateY(12px) scale(.97)}}
@keyframes toastOut{to{opacity:0;transform:translateX(24px)}}
.dialog[open]{animation:dialogIn .24s cubic-bezier(.22,.7,.2,1)}
.dialog[open]::backdrop{animation:fadeIn .2s ease-out}
@keyframes dialogIn{from{opacity:0;transform:translateY(14px) scale(.98)}}
@keyframes fadeIn{from{opacity:0}}
.sk{position:relative;overflow:hidden;border-radius:7px;background:#eceff3;height:12px}
.sk::after{content:"";position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,rgba(255,255,255,.75),transparent);animation:skMove 1.25s ease-in-out infinite}
@keyframes skMove{to{transform:translateX(100%)}}
.sk-wrap{pointer-events:none}
.sk-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}
.sk-card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow-sm)}
.sk-s{width:46%}
.sk-n{height:26px;width:34%;margin:14px 0 10px;border-radius:8px}
.sk-m{width:72%;height:10px}
.sk-panel{content-visibility:visible}
.sk-head{display:flex;justify-content:space-between;align-items:center;padding:16px 17px;border-bottom:1px solid var(--line)}
.sk-t{width:180px;height:14px}
.sk-tool{width:110px;height:28px;border-radius:9px}
.sk-row{display:flex;align-items:center;gap:16px;padding:15px 17px;border-bottom:1px solid var(--grid)}
.sk-row:last-child{border-bottom:0}
.sk-pill{width:64px;flex:none;height:20px;border-radius:99px}
@media(max-width:900px){.sk-stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}

/* ---------- Issue register mở rộng (đủ cột như Dashboard) ---------- */
.table-wrap.tall{max-height:68vh;overflow:auto;scrollbar-width:thin;scrollbar-color:#aab6c2 transparent}
table.tbl-wide{width:max-content;min-width:100%}
table.tbl-wide th,table.tbl-wide td{white-space:nowrap}
table.tbl-wide thead th{position:sticky;top:0;z-index:3;background:#f7f9fb}
table.tbl-wide td.cell-main,table.tbl-wide thead th:first-child{position:sticky;left:0;background:var(--paper);box-shadow:1px 0 0 var(--line)}
table.tbl-wide td.cell-main{z-index:2}
table.tbl-wide thead th:first-child{z-index:4;background:#f7f9fb}
table.tbl-wide tbody tr.hoverable:hover td.cell-main{background:#fafbfc}
table.tbl-wide .primary-cell{max-width:340px}
.cell-clip{display:block;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell-clip.w-md{max-width:260px}
.cell-clip.w-lg{max-width:360px}
a.ticket-key.tk-link{text-decoration:none;border:1px solid #cfe0fb;transition:background .12s,color .12s}
a.ticket-key.tk-link:hover{background:var(--blue-dark);color:#fff;border-color:var(--blue-dark)}
.st-badge{display:inline-flex;align-items:center;gap:7px;padding:4px 11px;border-radius:99px;font-size:11.5px;font-weight:700;line-height:1.2;white-space:nowrap;background:#eef1f4;color:var(--ink)}
.st-badge::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--st,#999);flex:0 0 auto}
@supports (background:color-mix(in srgb,red 10%,white)){
  .st-badge{background:color-mix(in srgb,var(--st,#999) 13%,#fff);color:color-mix(in srgb,var(--st,#999) 74%,#000);border:1px solid color-mix(in srgb,var(--st,#999) 34%,#fff)}
}
.sla-wrap{display:flex;align-items:center;gap:8px;min-width:130px}
.sla-track{flex:1;height:10px;border-radius:99px;background:#e1e9f1;overflow:hidden;box-shadow:inset 0 1px 2px rgba(25,39,52,.18)}
.sla-fill{height:100%;border-radius:99px}
.sla-pct{font-size:11.5px;font-weight:700;font-variant-numeric:tabular-nums;min-width:36px;text-align:right}
@media(max-width:760px){
  .table-wrap.tall{max-height:none;overflow:visible}
  table.tbl-wide{width:100%}
  table.tbl-wide th,table.tbl-wide td{white-space:normal}
  table.tbl-wide td.cell-main{position:static;box-shadow:none}
  .cell-clip,.cell-clip.w-md,.cell-clip.w-lg{max-width:none;white-space:normal}
  .sla-wrap{min-width:140px}
}
</style>
</head>
<body>

<div id="gate" class="gate"></div>

<div id="shell" class="shell">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">JD</div>
      <div><div class="brand-name">Jira Desk</div><span class="brand-sub">Team operations</span></div>
    </div>
    <div class="side-scroll">
      <div class="nav-group">
        <div class="nav-label">Tổng quan</div>
        <nav class="nav-list" aria-label="Tổng quan">
          <button class="nav-btn" data-tab="overview"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M4 13h6V4H4zM14 20h6v-9h-6zM4 20h6v-4H4zM14 8h6V4h-6z"/></svg></span><span>Tổng quan</span></button>
        </nav>
      </div>
      <div class="nav-group">
        <div class="nav-label">Công việc</div>
        <nav class="nav-list" aria-label="Công việc">
          <button class="nav-btn active" data-tab="tickets"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M4 5h16v14H4z"/><path d="M8 9h8M8 13h5"/></svg></span><span>Jira tickets</span><span class="nav-count" id="navTickets"></span></button>
          <button class="nav-btn" data-tab="backlogs"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M5 5h14M5 12h14M5 19h14"/><path d="M2.5 5h.01M2.5 12h.01M2.5 19h.01"/></svg></span><span>Backlogs</span><span class="nav-count" id="navBacklogs"></span></button>
          <button class="nav-btn" data-tab="tasks"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12"/><path d="m3 6 1.2 1.2L6 5.3M3 12l1.2 1.2L6 11.3M3 18l1.2 1.2L6 17.3"/></svg></span><span>Tasks</span><span class="nav-count" id="navTasks"></span></button>
        </nav>
      </div>
      <div class="nav-group">
        <div class="nav-label">Nhóm &amp; tiến độ</div>
        <nav class="nav-list" aria-label="Nhóm và tiến độ">
          <button class="nav-btn" data-tab="workload"><span class="nav-icon"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.4"/><path d="M2.6 20v-1.4a4 4 0 0 1 4-4h4.8a4 4 0 0 1 4 4V20M17 5a3.4 3.4 0 0 1 0 6.6M18 14.6a4 4 0 0 1 3.4 4V20"/></svg></span><span>Workload</span></button>
          <button class="nav-btn" data-tab="timeline"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M4 4v16"/><path d="M8 7h9M8 12h6M8 17h11"/></svg></span><span>Timeline</span></button>
        </nav>
      </div>
      <div class="nav-group">
        <div class="nav-label">Kiểm soát</div>
        <nav class="nav-list" aria-label="Kiểm soát">
          <button class="nav-btn" data-tab="risks"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M12 4 2.8 20h18.4z"/><path d="M12 10v4.5M12 17.4h.01"/></svg></span><span>Rủi ro &amp; deadline</span><span class="nav-count alert" id="navRisks"></span></button>
          <button class="nav-btn" data-tab="reports"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M4 20h16"/><path d="M7 20v-6M12 20V6M17 20v-9"/></svg></span><span>Báo cáo</span></button>
          <button class="nav-btn" data-tab="activity"><span class="nav-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.4"/><path d="M12 7.6V12l3.2 2"/></svg></span><span>Lịch sử hoạt động</span></button>
        </nav>
      </div>
      <div class="nav-group admin-nav" style="display:none">
        <div class="nav-label">Quản trị</div>
        <nav class="nav-list" aria-label="Quản trị">
          <button class="nav-btn" data-tab="members"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/></svg></span><span>Thành viên</span><span class="nav-count alert" id="pendingCount"></span></button>
        </nav>
      </div>
    </div>
    <div class="side-bottom">
      <div class="connection-mini"><span class="dot"></span><span id="connLabel">Supabase</span></div>
      <div class="side-user">
        <img id="sideAvatar" class="avatar" alt="" />
        <div id="sideInitial" class="avatar">JD</div>
        <div class="side-user-text"><div class="side-user-name" id="sideName">Member</div><div class="side-user-email" id="sideEmail"></div></div>
      </div>
    </div>
  </aside>

function esc(value){
  return String(value == null ? "" : value).replace(/[&<>"']/g, function(ch){
    return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[ch];
  });
}
function escAttr(value){ return esc(value).replace(/\n/g, " "); }
function norm(value){ return String(value == null ? "" : value).toLowerCase().replace(/[_-]+/g, " ").trim(); }
function valueOf(row, names){
  for (const key of names) {
    const v = row && row[key];
    if (v !== undefined && v !== null && v !== "") {
      if (typeof v === "object") return v.name || v.displayName || v.email || JSON.stringify(v);
      return String(v);
    }
  }
  return "";
}
function toast(message, type){
  const stack = $("#toastStack");
  if (!stack) return;
  while (stack.children.length >= 4) stack.firstChild.remove();
  const el = document.createElement("div");
  el.className = "toast " + (type || "");
  el.setAttribute("role", type === "error" ? "alert" : "status");
  el.textContent = message;
  stack.appendChild(el);
  setTimeout(function(){
    el.classList.add("leaving");
    setTimeout(function(){ el.remove(); }, 240);
  }, type === "error" ? 5200 : 3400);
}
function initials(value){
  const words = String(value || "").trim().split(/\s+/).filter(Boolean);
  return words.length ? words.slice(0, 2).map(function(x){ return x[0]; }).join("").toUpperCase() : "JD";
}

    t = setTimeout(function(){ fn.apply(self, args); }, wait || 280);
  };
}

/* ---------------- ngày tháng ---------------- */
function parseDay(value){
  if (!value) return null;
  if (value instanceof Date) return value;
  const s = String(value);
  const m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (m) return new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
  const d = new Date(s);
  return Number.isNaN(d.getTime()) ? null : d;
}
function dayKey(value){
  const d = parseDay(value);
  if (!d) return "";
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function todayKey(){ return dayKey(new Date()); }
function addDays(value, n){
  const d = parseDay(value);
  if (!d) return null;
  const out = new Date(d.getTime());
  out.setDate(out.getDate() + n);
  return out;
}
function diffDays(a, b){
  const x = parseDay(a), y = parseDay(b);
  if (!x || !y) return null;
  return Math.round((y.getTime() - x.getTime()) / 86400000);
}
function startOfWeek(value){
  const d = parseDay(value);
  if (!d) return null;
  const out = new Date(d.getTime());
  const wd = (out.getDay() + 6) % 7;
  out.setDate(out.getDate() - wd);
  out.setHours(0, 0, 0, 0);
  return out;
}
function startOfMonth(value){
  const d = parseDay(value);
  return d ? new Date(d.getFullYear(), d.getMonth(), 1) : null;
}
function startOfQuarter(value){
  const d = parseDay(value);
  return d ? new Date(d.getFullYear(), Math.floor(d.getMonth() / 3) * 3, 1) : null;
}
const DF_DAY = new Intl.DateTimeFormat("vi-VN", { day: "2-digit", month: "2-digit", year: "numeric" });
const DF_DAYSHORT = new Intl.DateTimeFormat("vi-VN", { day: "2-digit", month: "2-digit" });
const DF_MONTH = new Intl.DateTimeFormat("vi-VN", { month: "2-digit", year: "numeric" });
function fmtDay(value){
  const d = parseDay(value);
  return d ? DF_DAY.format(d) : "—";
}
function fmtDayShort(value){
  const d = parseDay(value);
  return d ? DF_DAYSHORT.format(d) : "—";
}
function fmtMonthKey(key){
  if (!key) return "—";
  const p = String(key).split("-");
  return p.length > 1 ? p[1] + "/" + p[0] : key;
}
function fmtStamp(value){
  if (!value) return "—";
  const d = new Date(value);
  if (Number.isNaN(d.getTime())) return String(value);
  return new Intl.DateTimeFormat("vi-VN", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit", timeZone: CONFIG.timeZone }).format(d);
}
function relTime(value){
  if (!value) return "";
  const d = new Date(value);
  if (Number.isNaN(d.getTime())) return "";
  const mins = Math.round((Date.now() - d.getTime()) / 60000);
  if (mins < 1) return "vừa xong";
  if (mins < 60) return mins + " phút trước";
  const hours = Math.round(mins / 60);
  if (hours < 24) return hours + " giờ trước";
  const days = Math.round(hours / 24);
  if (days < 31) return days + " ngày trước";
  return fmtStamp(value);
}
function fmtNum(v){
  const n = safeNum(v);
  return new Intl.NumberFormat("vi-VN").format(n);
}
function fmtHours(v){
  if (!hasVal(v)) return "—";
  const n = safeNum(v);
  return (Math.round(n * 10) / 10).toLocaleString("vi-VN") + "h";
}
function pct(part, total){
  if (!total) return 0;
  return Math.round((part / total) * 100);
}
function median(list){
  const arr = list.filter(function(x){ return Number.isFinite(x); }).sort(function(a, b){ return a - b; });
  if (!arr.length) return null;
  const mid = Math.floor(arr.length / 2);
  return arr.length % 2 ? arr[mid] : (arr[mid - 1] + arr[mid]) / 2;
}
function avg(list){
  const arr = list.filter(function(x){ return Number.isFinite(x); });
  if (!arr.length) return null;
  return arr.reduce(function(a, b){ return a + b; }, 0) / arr.length;
}

/* ---------------- xuất dữ liệu ---------------- */
function csvCell(value){
  const s = value === undefined || value === null ? "" : String(value);
  return /[",;\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function csvOf(header, rows){
  const lines = [header.map(csvCell).join(",")];
  rows.forEach(function(row){ lines.push(row.map(csvCell).join(",")); });
  return lines.join("\r\n");
}
function downloadFile(filename, content, mime){
  const blob = new Blob(["\ufeff" + content], { type: mime || "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  a.style.display = "none";
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
}
function stampName(){
  const d = new Date();
  return d.getFullYear() + String(d.getMonth() + 1).padStart(2, "0") + String(d.getDate()).padStart(2, "0") + "-" + String(d.getHours()).padStart(2, "0") + String(d.getMinutes()).padStart(2, "0");
}

}

async function adoptSessionFromStorage(){
  if (!state.client) return false;
  const r = await state.client.auth.getSession();
  if (r.data && r.data.session) {
    stopLoginPoll();
    await loadSession(r.data.session);

  }
  return false;
}
function startLoginPoll(){
  stopLoginPoll();
  const until = Date.now() + 5 * 60 * 1000;

async function signInGoogle(){
  if (!state.client) { toast("Hãy cấu hình Supabase trong code trước", "error"); return; }
  if (location.protocol === "file:" || location.origin === "null") { toast("Hãy mở app qua địa chỉ https (GitHub Pages…), không mở trực tiếp file từ máy", "error"); return; }
  authUrlError = "";
  const redirect = location.origin + location.pathname;
  /* Cửa sổ popup chọn tài khoản Google (prompt=select_account). Google không cho đăng nhập trong iframe,
     nên popup luôn là cửa sổ cấp cao nhất; phiên đăng nhập được chia sẻ qua localStorage cùng origin. */
  const result = await state.client.auth.signInWithOAuth({
    provider: "google",
    options: { redirectTo: redirect, skipBrowserRedirect: true, queryParams: { prompt: "select_account" } }
  });
  if (result.error || !result.data || !result.data.url) { toast("Google login: " + ((result.error && result.error.message) || "không lấy được URL đăng nhập"), "error"); return; }
  loginIntent = true;
  try { localStorage.setItem(LOGIN_MARK, String(Date.now())); } catch (e) {}
  const w = 500, h = 650;
  const left = Math.max(0, Math.round((window.screenX || 0) + ((window.outerWidth || 1000) - w) / 2));
  const top = Math.max(0, Math.round((window.screenY || 0) + ((window.outerHeight || 800) - h) / 2));
  const popup = window.open(result.data.url, "jd-google-login", "popup=yes,width=" + w + ",height=" + h + ",left=" + left + ",top=" + top);
  if (!popup) {
    /* Popup bị chặn: chuyển hướng cả trang (hoặc cửa sổ chính nếu đang trong iframe) */
    try { localStorage.removeItem(LOGIN_MARK); } catch (e) {}
    try { (inFrame() ? window.top : window).location.href = result.data.url; }
    catch (e) { toast("Trình duyệt chặn cửa sổ đăng nhập. Hãy cho phép popup cho trang này rồi thử lại.", "error"); }
    return;
  }
  try { popup.focus(); } catch (e) {}
  startLoginPoll();
}
/* Chạy trong cửa sổ popup sau khi Google chuyển hướng về: báo cho cửa sổ gốc rồi tự đóng */
function finishPopupLogin(){
  let fresh = false;
  try {
    const t = Number(localStorage.getItem(LOGIN_MARK) || 0);
    fresh = t > 0 && Date.now() - t < 3 * 60 * 1000;
  } catch (e) {}
  if (!fresh || inFrame()) return false;
  try { localStorage.removeItem(LOGIN_MARK); } catch (e) {}
  if (authChannel) { try { authChannel.postMessage("signed-in"); } catch (e) {} }
  try { window.close(); } catch (e) {}
  return true;
}

let sessionChain = Promise.resolve();
function loadSession(session, force){
  sessionChain = sessionChain.then(function(){ return loadSessionNow(session, force); }).catch(function(e){
    gateMessage("Không thể kiểm tra quyền truy cập", (e && e.message) || String(e), true);
  });
  return sessionChain;
}
async function loadSessionNow(session, force){
  const uid = session && session.user ? session.user.id : null;
  state.session = session || null;
  if (!session) { showGate(); return; }
  /* Tránh nhấp nháy / tải lặp khi Supabase phát lại sự kiện SIGNED_IN lúc đổi tab */
  if (!force && state.member && state.member.user_id === uid) {
    if (state.member.status === "approved" && state.dataStarted) { updateUserHeader(); return; }
    if (state.member.status !== "approved") return;
  }
  showGate();
  const cols = "user_id,email,full_name,avatar_url,role,status,created_at,reviewed_at";
  let r = await state.client.from(MEMBER_TABLE).select(cols).eq("user_id", uid).maybeSingle();
  if (r.error) { gateMessage("Không thể kiểm tra bảng thành viên", r.error.message, true); return; }
  if (!r.data) {
    /* Tự chữa: nhờ database tạo hồ sơ nếu trigger đăng ký bị lỡ */
    const ens = await state.client.rpc("jtm_ensure_member");
    if (!ens.error) {
      r = await state.client.from(MEMBER_TABLE).select(cols).eq("user_id", uid).maybeSingle();
      if (r.error) { gateMessage("Không thể kiểm tra bảng thành viên", r.error.message, true); return; }
    }
  }
  if (!r.data) {
    gateMessage("Chưa tìm thấy hồ sơ thành viên", "Không tạo được hồ sơ cho tài khoản (uid " + (uid || "trống") + "). Hãy chạy file Jira-Desk-Complete.sql trong Supabase SQL Editor, sau đó tải lại trang bằng Ctrl/Cmd+Shift+R." , true);
    return;
  }
  state.member = r.data;
  if (r.data.status !== "approved") { renderPending(); return; }
  /* Vào app ngay, dữ liệu đồng bộ nền với skeleton */
  const justLoggedIn = loginIntent;
  loginIntent = false;
  resetData();
  showApp();
  if (justLoggedIn) toast("Đăng nhập thành công", "good");
  loadAll({ initial: true });
}

async function bootstrap(){
  try { loginIntent = /[?&]code=/.test(location.search) || /access_token=/.test(location.hash); } catch (e) {}
  readAuthUrlError();
  if (!connect()) { showGate(); return; }
  const r = await state.client.auth.getSession();
  if (r.error) { gateMessage("Không đọc được phiên đăng nhập", r.error.message, true); return; }
  if (r.data.session) {
    finishPopupLogin();
    /* Nếu cửa sổ không tự đóng được, tiếp tục hiển thị app bình thường */
  }
  await loadSession(r.data.session);
  state.client.auth.onAuthStateChange(function(event, session){
    setTimeout(function(){
      if (event === "INITIAL_SESSION" || event === "TOKEN_REFRESHED") { if (session) state.session = session; return; }
      if (event === "SIGNED_OUT" || !session) {
        state.session = null;
        state.member = null;
        resetData();
        showGate();
      } else {
        loadSession(session);
      }
    }, 0);
  });
}

function ticketUrlOf(row){
  const direct = tf(row, "ticketUrl");
  if (/^https?:\/\//i.test(direct)) return direct;
  const key = tf(row, "key");
  const base = config().jira;
  if (!base || !/^[A-Za-z][A-Za-z0-9]*-\d+$/.test(key)) return "";
  return base + "/browse/" + key;
}

/* ---------------- cột mở rộng của Issue register (đồng bộ logic với Dashboard) ---------------- */
const TICKET_STATUS_COLORS = {
  "Resolved": "#28A745", "Closed": "#6c757d", "Canceled": "#adb5bd", "Cancelled": "#adb5bd",
  "In Progress L1": "#123a5e", "In Progress L2": "#1b4a73", "Pending": "#D9B300",
  "Waiting for customer": "#118DFF", "Waiting for support": "#FF0000"
};
function ynOf(v){
  const s = String(v == null ? "" : v).trim().toLowerCase();
  if (s === "true" || s === "yes" || s === "1") return "Yes";
  if (s === "false" || s === "no" || s === "0") return "No";
  return "";
}
function stampMs(v){
  if (!v) return null;
  const raw = String(v);
  const t = new Date(raw.indexOf(" ") > 0 ? raw.replace(" ", "T") : raw).getTime();
  return Number.isNaN(t) ? null : t;
}
function fmtDt(v){
  if (!v) return "";
  const t = stampMs(v);
  if (t === null) return String(v);
  const d = new Date(t);
  const p = function(n){ return String(n).padStart(2, "0"); };
  return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) + " " + p(d.getHours()) + ":" + p(d.getMinutes()) + ":" + p(d.getSeconds());
}
function slaProgress(createdValue, deadlineValue){
  const start = stampMs(createdValue), end = stampMs(deadlineValue);
  if (start === null || end === null) return null;
  const now = Date.now();
  const total = end - start;
  const overdue = now > end;
  let p = total > 0 ? ((now - start) / total) * 100 : (overdue ? 100 : 0);
  p = Math.max(0, Math.min(100, p));
  if (overdue) p = 100;
  return { pct: p, overdue: overdue, remainingMs: end - now };
}
function slaInfoOf(x, which){
  return x ? slaProgress(x.createdRaw, which === "fr" ? x.frDeadline : x.ttrDeadline) : null;
}
function durVi(ms){
  let totalMin = Math.round(Math.abs(ms) / 60000);
  const days = Math.floor(totalMin / 1440); totalMin -= days * 1440;
  const hrs = Math.floor(totalMin / 60); totalMin -= hrs * 60;
  const parts = [];
  if (days > 0) parts.push(days + "ng");
  if (hrs > 0) parts.push(hrs + "g");
  if (parts.length < 2 && totalMin > 0) parts.push(totalMin + "p");
  if (!parts.length) parts.push("<1p");
  return parts.join(" ");
}
function slaCell(x, which){
  const info = slaInfoOf(x, which);
  if (!info) return "";
  const breached = which === "fr" ? x.frBreached : x.ttrBreached;
  let color;
  if (breached === "Yes") color = "var(--red)";
  else if (breached === "No") color = "var(--blue)";
  else if (info.overdue) color = "var(--red)";
  else if (info.pct >= 85) color = "var(--amber)";
  else color = "var(--green)";
  const label = (info.overdue ? "Quá hạn " : "Còn lại ") + durVi(info.remainingMs) + " (" + Math.round(info.pct) + "%)";
  return '<div class="sla-wrap' + (info.overdue ? " over" : "") + '" title="' + escAttr(label) + '"><div class="sla-track"><div class="sla-fill" style="width:' + info.pct.toFixed(1) + "%;background:" + color + '"></div></div><div class="sla-pct" style="color:' + color + '">' + Math.round(info.pct) + "%</div></div>";
}
function slaText(x, which){
  const info = slaInfoOf(x, which);
  return info ? Math.round(info.pct) + "%" + (info.overdue ? " (Quá hạn)" : "") : "";
}
function stBadge(label, color){
  return label ? '<span class="st-badge" style="--st:' + escAttr(color) + '">' + esc(label) + "</span>" : "";
}
function ticketStatusPill(status){ return stBadge(status, TICKET_STATUS_COLORS[status] || "#999"); }
function breachedPill(v){ return v === "Yes" ? stBadge("Yes", "#c84949") : (v === "No" ? stBadge("No", "#168162") : ""); }

async function fetchAll(table, options){
  const opts = options || {};
  const pageSize = opts.pageSize || 1000;
  const max = opts.max || 20000;
  const out = [];
  let from = 0;
  while (out.length < max) {
    let q = state.client.from(table).select(opts.select || "*").range(from, from + pageSize - 1);
    if (opts.order) q = q.order(opts.order, { ascending: opts.ascending !== false });
    const r = await q;
    if (r.error) throw r.error;
    const batch = r.data || [];
    out.push.apply(out, batch);
    if (batch.length < pageSize) break;
    from += pageSize;
  }
  return out;
}
async function loadTicketsAll(){
  state.ticketFilter = null;
  const r = await state.client.from(TICKET_TABLE).select("*").range(0, THRESHOLDS.ticketPageSize - 1);
  if (r.error) throw r.error;
  const probe = r.data || [];
  if (probe.length < THRESHOLDS.ticketPageSize) {
    state.tickets = probe;
    state.ticketComplete = true;
  } else {
    const cols = probe.length ? Object.keys(probe[0]) : [];
    const orderCol = ["created_at", "created", "updated_at", "updated", "issue_key", "ticket_key", "key", "id"].find(function(c){ return cols.indexOf(c) >= 0; });
    if (orderCol) {
      state.tickets = await fetchAll(TICKET_TABLE, { order: orderCol, ascending: true, pageSize: THRESHOLDS.ticketPageSize, max: THRESHOLDS.ticketMaxRows });
      state.ticketComplete = true;
    } else {
      state.tickets = probe;
      state.ticketComplete = false;
    }
  }
  state.loaded.tickets = true;
}
/* Chỉ tải ticket của các assignee thuộc nhóm (lọc ngay trên server, tải song song nhiều trang) */
const TICKET_ASSIGNEES = ["Vxceed Support", "Abhishek.shetty", "Tan Nguyen", "Quang Pham", "Pramodh", "Susanta", "Long Vo", "Phuc Nguyen23", "Rakesha HR", "Truong Nguyen10", "Sharad Kumar"];
async function loadTickets(){
  const probe = await state.client.from(TICKET_TABLE).select("*").limit(1);
  if (probe.error) throw probe.error;
  const cols = probe.data && probe.data.length ? Object.keys(probe.data[0]) : [];
  const assigneeCol = TICKET_FIELDS.assignee.find(function(c){ return cols.indexOf(c) >= 0; });
  if (!assigneeCol) { await loadTicketsAll(); return; }
  const orderCol = ["id", "issue_key", "ticket_key", "key", "jira_key", "created_at", "created", "updated_at", "updated"].find(function(c){ return cols.indexOf(c) >= 0; });
  const orExpr = TICKET_ASSIGNEES.map(function(n){ return assigneeCol + ".ilike.%" + n + "%"; }).join(",");
  const size = THRESHOLDS.ticketPageSize;
  const cnt = await state.client.from(TICKET_TABLE).select("*", { count: "exact", head: true }).or(orExpr);
  if (cnt.error) throw cnt.error;
  const total = cnt.count || 0;
  if (total === 0) {
    toast("Không có ticket nào khớp danh sách assignee, đang tải toàn bộ ticket", "error");
    await loadTicketsAll();
    return;
  }
  let rows = [];
  if (total <= size || !orderCol) {
    const r = await state.client.from(TICKET_TABLE).select("*").or(orExpr).range(0, size - 1);
    if (r.error) throw r.error;
    rows = r.data || [];
    state.ticketComplete = total <= size;
  } else {
    const pages = Math.min(Math.ceil(total / size), Math.ceil(THRESHOLDS.ticketMaxRows / size));
    const fetchPage = function(i){
      return state.client.from(TICKET_TABLE).select("*").or(orExpr).order(orderCol, { ascending: true }).range(i * size, i * size + size - 1)
        .then(function(r){ if (r.error) throw r.error; return r.data || []; });
    };
    const results = new Array(pages);
    let next = 0;
    const worker = async function(){
      while (next < pages) { const i = next++; results[i] = await fetchPage(i); }
    };
    await Promise.all([worker(), worker(), worker(), worker()]);
    results.forEach(function(chunk){ rows = rows.concat(chunk); });
    state.ticketComplete = pages * size >= total;
  }
  state.tickets = rows;
  state.ticketFilter = { column: assigneeCol, count: TICKET_ASSIGNEES.length, total: total };
  state.loaded.tickets = true;
}

function approvedNow(){ return !!(state.session && state.member && state.member.status === "approved"); }
/* opts.initial: lần tải đầu sau khi vào app (hiện skeleton, vẽ ngay khi đủ dữ liệu cho tab đang mở).
   opts.only: chỉ tải lại một số nguồn (sau khi lưu/xoá không cần tải lại hàng chục nghìn ticket). */
async function loadAll(opts){
  opts = opts || {};
  const initial = !!opts.initial;
  const names = opts.only || ["tickets", "backlogs", "tasks", "directory", "members", "saved"];
  if (initial) { state.settled = {}; state.syncing = true; }
  state.dataStarted = true;
  names.forEach(function(n){ delete state.errors[n]; });
  const jobs = names.map(function(name){
    return Promise.resolve().then(function(){ return LOADERS[name](); }).catch(function(e){
      if (name !== "saved") state.errors[name] = String((e && e.message) || e);
      if (name === "tickets") state.tickets = [];
      if (name === "backlogs") state.backlogs = [];
      if (name === "tasks") state.tasks = [];
      if (name === "directory") state.directory = [];
    }).then(function(){
      state.settled[name] = true;
      if (!initial || !approvedNow()) return;
      if (state.skeletonShown && tabDataReady()) renderShell();
      else if (name === "tickets" && (state.tab === "backlogs" || state.tab === "tasks") && !userIsBusy()) renderShell();
      else paintNavCounts();
    });
  });
  await Promise.all(jobs);
  const touchesWork = !opts.only || opts.only.indexOf("backlogs") >= 0 || opts.only.indexOf("tasks") >= 0;
  if (touchesWork && state.loaded.activity) { try { await loadActivity(true); } catch (e) { state.errors.activity = e.message; } }
  if (initial) state.syncing = false;
  if (approvedNow()) {
    if (initial && !state.skeletonShown) paintNavCounts();
    else renderShell();
  }
  if (initial) {
    const failed = Object.keys(state.errors);
    if (failed.length) toast("Đã vào workspace, nhưng chưa tải được: " + failed.join(", "), "error");
    else toast("Đã đồng bộ dữ liệu", "good");
  }
}
async function refreshData(silent){
  const btn = $('[data-action="refresh"]');
  if (btn) btn.disabled = true;
  try {
    await loadAll();
    if (!silent) toast("Đã tải lại dữ liệu", "good");
  } catch (e) {
    toast("Không tải lại được dữ liệu: " + e.message, "error");
  } finally {
    if (btn) btn.disabled = false;
  }
}

function ownerMatchId(name, email){
  const n = norm(name), e = norm(email);
  if (!n && !e) return null;
  const byEmail = state.directory.filter(function(p){ return e && norm(p.email) === e; });
  if (byEmail.length === 1) return byEmail[0].user_id;
  const byName = state.directory.filter(function(p){ return n && norm(p.full_name) === n; });
  if (byName.length === 1) return byName[0].user_id;
  return null;
}
function memberOf(id){
  return state.directory.find(function(p){ return p.user_id === id; }) || null;
}
function memberName(id){
  const m = memberOf(id);
  return m ? (m.full_name || m.email) : "Chưa giao";
}

function allItems(){

function itemsByKind(kind){
  if (kind === "ticket") return state.tickets.map(normTicket);
  if (kind === "backlog") return state.backlogs.map(normBacklog);
  if (kind === "task") return state.tasks.map(normTask);
  return allItems();
}
function blockedSinceMap(){
  const map = {};
  state.activity.forEach(function(log){
    if (log.field !== "status") return;
    const key = log.entity_type + ":" + log.entity_id;
    if (map[key]) return;
    if (norm(log.new_value) === "blocked") map[key] = log.created_at;
  });
  return map;
}
function withBlockedSince(list){
  const map = blockedSinceMap();
  list.forEach(function(item){
    if (item.kind === "ticket") return;
    const since = map[item.kind + ":" + item.id];
    item.blockedSince = item.blocked && since ? since : (item.blocked ? null : null);
  });
  return list;
}

/* ---------------- quy tắc rủi ro dùng chung ---------------- */
function daysLeft(item){ return item.due ? diffDays(todayKey(), item.due) : null; }
function isOverdue(item){
  if (!item.due || item.statusGroup === "done") return false;
  const left = daysLeft(item);
  return left !== null && left < 0;
}
function isDueSoon(item, days){
  if (!item.due || item.statusGroup === "done") return false;
  const left = daysLeft(item);
  return left !== null && left >= 0 && left <= (days || THRESHOLDS.dueSoon);
}
function isStale(item){
  const ref = item.kind === "ticket" ? item.updated : item.updated;
  if (!ref || item.statusGroup === "done") return false;
  const limit = item.kind === "ticket" ? THRESHOLDS.staleTicketDays : THRESHOLDS.staleWorkDays;
  const age = diffDays(ref, new Date());
  return age !== null && age > limit;
}
function isUnassigned(item){
  return item.statusGroup !== "done" && (!item.ownerId && !item.ownerName || item.ownerName === "Unassigned" || item.ownerName === "Chưa giao");
}
function isBlockedItem(item){ return item.statusGroup === "blocked" || item.blocked; }
function missingDates(item){
  if (item.kind === "ticket") return false;
  if (item.statusGroup === "done") return !item.actualEnd;
  return !item.due || (!item.start && !item.actualStart);
}
function isAtRisk(item){
  if (item.statusGroup === "done") return false;
  if (isBlockedItem(item)) return true;
  const left = daysLeft(item);
  return left !== null && left <= THRESHOLDS.riskWindowDays && (item.progress == null ? true : item.progress < 100);
}
function riskGroupOf(item){
  const groups = [];
  if (isOverdue(item)) groups.push("overdue");
  else if (isDueSoon(item, THRESHOLDS.dueSoon)) groups.push("duesoon");
  if (isBlockedItem(item)) groups.push("blocked");
  if (isUnassigned(item)) groups.push("unassigned");
  if (item.kind === "ticket" && isStale(item)) groups.push("stale");
  if (missingDates(item)) groups.push("missing");
  return groups;
}
function riskItems(){
  const list = withBlockedSince(allItems());
  return list.filter(function(item){ return riskGroupOf(item).length > 0; });
}

   4. BỘ LỌC · SẮP XẾP · BẢNG · BIỂU ĐỒ (dùng chung cho mọi màn hình)
   ============================================================================ */
function haystack(item){
  const x = item.x;
  return [item.code, item.title, item.ownerName, item.project, item.type, item.status, item.priority,
    item.description, item.blockedReason, item.raw && item.raw.jira_key, item.raw && item.raw.sprint,
    item.reporter].concat(x ? [x.category, x.group, x.level, x.cause, x.resolutionCf, x.organizations, x.requestType, x.statusCategory] : [])
    .filter(Boolean).join(" ").toLowerCase();
}
function applyListFilters(list, f){
  const term = String(f.q || "").trim().toLowerCase();
  return list.filter(function(item){
    if (f.status && f.status !== "all" && norm(item.status) !== norm(f.status)) return false;
    if (f.priority && f.priority !== "all" && norm(item.priority) !== norm(f.priority)) return false;
    if (f.type && f.type !== "all" && norm(item.type) !== norm(f.type)) return false;
    if (f.project && f.project !== "all" && item.project !== f.project) return false;
    if (f.owner && f.owner !== "all"){
      if (f.owner === "none") { if (!isUnassigned(item)) return false; }
      else if (item.ownerId !== f.owner) return false;
    }
    if (f.from || f.to){
      if (!item.due) return false;
      if (f.from && diffDays(f.from, item.due) < 0) return false;
      if (f.to && diffDays(item.due, f.to) < 0) return false;
    }
    if (item.kind === "backlog" && norm(item.status) === "archived" && f.preset !== "archived" && norm(f.status) !== "archived") return false;
    if (f.preset){
      if (f.preset === "mine" && item.ownerId !== (state.member && state.member.user_id)) return false;
      if (f.preset === "archived" && norm(item.status) !== "archived") return false;
      if (f.preset === "active" && f.preset !== "archived" && item.statusGroup === "done") return false;
      if (f.preset === "done" && item.statusGroup !== "done") return false;
      if (f.preset === "overdue" && !isOverdue(item)) return false;
      if (f.preset === "duesoon" && !isDueSoon(item, THRESHOLDS.dueSoon)) return false;
      if (f.preset === "blocked" && !isBlockedItem(item)) return false;
      if (f.preset === "stale" && !isStale(item)) return false;
      if (f.preset === "unassigned" && !isUnassigned(item)) return false;
      if (f.preset === "missing" && !missingDates(item)) return false;
      if (f.preset === "risk" && !riskGroupOf(item).length) return false;
    }
    if (term && haystack(item).indexOf(term) < 0) return false;
    return true;
  });
}
function sortValue(item, key){
  switch (key) {
    case "due": return item.due ? parseDay(item.due).getTime() : null;
    case "start": return item.start ? parseDay(item.start).getTime() : null;
    case "created": return stampMs(item.created);
    case "updated": return stampMs(item.updated);
    case "updatedRaw": return item.x ? stampMs(item.x.updatedRaw) : null;
    case "resolvedAt": return item.x ? stampMs(item.x.resolvedRaw) : null;
    case "frDeadline": return item.x ? stampMs(item.x.frDeadline) : null;
    case "ttrDeadline": return item.x ? stampMs(item.x.ttrDeadline) : null;
    case "frPct": { const i = slaInfoOf(item.x, "fr"); return i ? i.pct : null; }
    case "ttrPct": { const i = slaInfoOf(item.x, "ttr"); return i ? i.pct : null; }
    case "statusName": return String(item.status || "").toLowerCase();
    case "reporter": return String(item.reporter || "").toLowerCase();
    case "description": return String(item.description || "").toLowerCase();
    case "category": case "group": case "level": case "cause": case "resolutionCf":
    case "organizations": case "requestType": case "statusCategory": case "frBreached": case "ttrBreached":
      return item.x ? String(item.x[key] || "").toLowerCase() : "";
    case "completed": return item.actualEnd ? new Date(item.actualEnd).getTime() : null;
    case "priority": return item.prio;
    case "status": return item.statusGroup;
    case "title": return item.title.toLowerCase();
    case "owner": return item.ownerName.toLowerCase();
    case "progress": return item.progress;
    case "effort": return item.effort;
    case "code": return item.code;
    case "project": return item.project;
    case "kind": return item.kind;
    default: return null;
  }
}
function sortItems(list, sort){
  const key = sort.f, dir = sort.d === "asc" ? 1 : -1;
  return list.slice().sort(function(a, b){
    const va = sortValue(a, key), vb = sortValue(b, key);
    if (va === null && vb === null) return 0;
    if (va === null) return 1;
    if (vb === null) return -1;
    if (va < vb) return -1 * dir;
    if (va > vb) return 1 * dir;
    return 0;
  });
}
function paginate(list, page, size){
  const total = list.length;
  const pages = Math.max(1, Math.ceil(total / size));
  const p = clamp(safeNum(page) || 1, 1, pages);
  return { items: list.slice((p - 1) * size, p * size), total: total, pages: pages, page: p, from: total ? (p - 1) * size + 1 : 0, to: Math.min(total, p * size) };
}

function inRange(value, from, to){
  if (!value) return false;
  const key = dayKey(value);
  if (!key) return false;
  if (from && diffDays(from, key) < 0) return false;
  if (to && diffDays(key, to) < 0) return false;
  return true;
}
function createdIn(list, from, to){ return list.filter(function(i){ return inRange(i.created, from, to); }); }
function completedIn(list, from, to){ return list.filter(function(i){ return inRange(i.actualEnd, from, to); }); }
function overdueList(list){ return list.filter(isOverdue); }
function dueSoonList(list, days){ return list.filter(function(i){ return isDueSoon(i, days); }); }
function blockedList(list){ return list.filter(isBlockedItem); }
function unassignedList(list){ return list.filter(isUnassigned); }
function staleList(list){ return list.filter(isStale); }
function missingList(list){ return list.filter(missingDates); }
function openList(list){ return list.filter(function(i){ return i.statusGroup !== "done"; }); }

function trendBuckets(from, to, unit){
  const end = parseDay(to) || new Date();
  const start = parseDay(from) || addDays(end, -83);
  const out = [];
  let cursor = unit === "month" ? startOfMonth(start) : unit === "quarter" ? startOfQuarter(start) : startOfWeek(start);
  let guard = 0;
  while (cursor <= end && guard < 120) {
    const next = unit === "month" ? new Date(cursor.getFullYear(), cursor.getMonth() + 1, 1)
      : unit === "quarter" ? new Date(cursor.getFullYear(), cursor.getMonth() + 3, 1)
      : addDays(cursor, 7);
    out.push({ key: dayKey(cursor), from: dayKey(cursor), to: dayKey(addDays(next, -1)), date: new Date(cursor.getTime()) });
    cursor = next;
    guard++;
  }
  return out;
}
function bucketLabels(buckets, unit){
  return buckets.map(function(b){
    if (unit === "month") return DF_MONTH.format(b.date);
    if (unit === "quarter") return "Q" + (Math.floor(b.date.getMonth() / 3) + 1) + "/" + String(b.date.getFullYear()).slice(2);
    return fmtDayShort(b.from);
  });
}
function bucketCounts(list, buckets, dateFn){
  return buckets.map(function(b){
    return list.filter(function(i){ return inRange(dateFn(i), b.from, b.to); }).length;
  });
}
function ownerRows(list){

    const mine = list.filter(function(i){ return i.ownerId === p.user_id; });
    return {
      id: p.user_id,
      name: p.full_name || p.email,
      email: p.email,
      role: p.role,
      tickets: mine.filter(function(i){ return i.kind === "ticket"; }).length,
      openTickets: mine.filter(function(i){ return i.kind === "ticket" && i.statusGroup !== "done"; }).length,
      backlogs: mine.filter(function(i){ return i.kind === "backlog"; }).length,
      openBacklogs: mine.filter(function(i){ return i.kind === "backlog" && i.statusGroup !== "done"; }).length,
      openTasks: mine.filter(function(i){ return i.kind === "task" && i.statusGroup !== "done"; }).length,
      doneTasks: mine.filter(function(i){ return i.kind === "task" && i.statusGroup === "done"; }).length,
      overdue: overdueList(mine).length,
      blocked: blockedList(mine).length,
      dueSoon: dueSoonList(mine, THRESHOLDS.dueSoon).length,
      estimateLeft: mine.filter(function(i){ return i.statusGroup !== "done" && i.effort != null; }).reduce(function(a, b){ return a + b.effort; }, 0),
      actualEffort: mine.reduce(function(a, b){ return a + (b.actualEffort || 0); }, 0),
      blockedDays: mine.reduce(function(a, b){
        if (!b.blocked) return a;
        const d = b.blockedSince ? diffDays(b.blockedSince, new Date()) : null;
        return a + (d && d > 0 ? d : 0);
      }, 0),
      items: mine

  });

function logSentence(log){
  const who = "<b>" + esc(actorName(log.actor_id)) + "</b>";

  if (log.action === "deleted") return who + " đã xoá " + esc(log.entity_type === "task" ? "task" : "backlog") + " <b>" + label + "</b>";
  if (log.action === "blocked") return who + " đã chuyển <b>" + label + "</b> sang Blocked" + (log.new_value ? ": " + esc(log.new_value) : "");
  if (log.action === "completed") return who + " đã hoàn thành <b>" + label + "</b>";
  if (log.action === "reopened") return who + " đã mở lại <b>" + label + "</b>";

  if (log.action === "unlinked") return who + " đã gỡ liên kết của <b>" + label + "</b>";

function formField(name, label, type, value, opts, full, placeholder, hint){
  let control = "";
  if (type === "textarea") control = '<textarea name="' + name + '" rows="3" placeholder="' + escAttr(placeholder || "") + '">' + esc(value || "") + "</textarea>";
  else if (type === "select") control = '<select name="' + name + '">' + (opts || []).map(function(o){
    return '<option value="' + escAttr(o.value) + '"' + (String(value == null ? "" : value) === String(o.value) ? " selected" : "") + ">" + esc(o.label) + "</option>";
  }).join("") + "</select>";
  else control = '<input name="' + name + '" type="' + type + '" value="' + escAttr(type === "date" ? (dayKey(value) || "") : (value == null ? "" : value)) + '" placeholder="' + escAttr(placeholder || "") + '"' + (type === "number" ? ' step="any" min="0"' : "") + ">";
  return '<label class="field' + (full ? " full" : "") + '"><span>' + esc(label) + "</span>" + control +
    (hint ? '<span class="muted" style="font-size:10.5px">' + esc(hint) + "</span>" : "") + "</label>";
}
function statusOptions(kind, current){
  const map = kind === "backlog"

    : [["todo", "To do"], ["in_progress", "In progress"], ["blocked", "Blocked"], ["done", "Done"]];
  const cur = norm(current) === "active" ? (kind === "backlog" ? "in_progress" : current) : current;
  return map.map(function(p){ return { value: p[0], label: p[1], selected: String(cur || "") === p[0] }; });
